<script>
  /* Defined before the images so a fast/cached failure is still caught.
     Removes the illustration and collapses its grid column, so a missing
     image leaves no empty gutter. Part 2 shows two people in one figure, so
     only the missing one is dropped — the column collapses when nothing is
     left to show. */
  function lessonImgFail(img) {
    var fig = img.closest('figure');
    var holder = img.parentElement;
    img.remove();
    if (holder && holder !== fig && !holder.querySelector('img')) holder.remove();
    if (fig && !fig.querySelector('img')) {
      var parent = fig.parentElement;
      fig.remove();
      if (parent) parent.classList.add('no-figure');
    }
  }
</script>

<style>
  /* ============================================================
     THEMES — the same token names and values as the main app, so
     students who later unlock the app land on a familiar surface.
     Three themes only (Warm / Paper / Dark) rather than all six.
     ============================================================ */
  :root {
    --bg: #f5ecd9;
    --bg-2: #ebe0c4;
    --panel: #fffaf0;
    --ink: #2b2418;
    --ink-soft: #6b5d44;
    --accent: #b8893a;
    --accent-2: #8a6420;
    --rom: #7a5a1e;
    --shadow: rgba(80, 60, 20, 0.18);
    --shadow-strong: rgba(80, 60, 20, 0.3);
    --button-bg: #fffaf0;
    --button-hover: #f5ecd9;
    --topbar-bg: #fffaf0;
    --hairline: var(--shadow);

    /* Text-size multiplier driven by the A—A slider. */
    --tx: 1;
    /* Shared layout width. One number governs every block on the page. */
    --measure: 860px;
    --radius: 10px;
  }

  [data-theme="paper"] {
    --bg: #dee2e6;
    --bg-2: #d6dbe1;
    --panel: #fbfcfd;
    --ink: #1f2225;
    --ink-soft: #56606b;
    --accent: #5a6b80;
    --accent-2: #3f5266;
    --rom: #3f6b78;
    --shadow: rgba(30, 35, 45, 0.16);
    --shadow-strong: rgba(30, 35, 45, 0.28);
    --button-bg: #fbfcfd;
    --button-hover: #e9edf1;
    --topbar-bg: #eef1f4;
  }

  [data-theme="dark"] {
    --bg: #1a1815;
    --bg-2: #252220;
    --panel: #2a2622;
    --ink: #f0e6d2;
    --ink-soft: #b8a888;
    --accent: #d4b87a;
    --accent-2: #b8893a;
    --rom: #dcc48c;
    --shadow: rgba(0, 0, 0, 0.5);
    --shadow-strong: rgba(0, 0, 0, 0.7);
    --button-bg: #2a2622;
    --button-hover: #353028;
    --topbar-bg: #2a2622;
  }

  /* ========= RESET & BASE ========= */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    background-image: radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg) 70%);
    background-attachment: fixed;
    color: var(--ink);
    line-height: 1.55;
    min-height: 100%;
    transition: background-color 0.3s ease, color 0.3s ease;
    /* Text on a review page must stay copyable — the app disables selection
       globally because taps there are game moves, but here they are not. */
    -webkit-text-size-adjust: 100%;
  }
  [data-theme="paper"] body { background-image: none; }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }
  img { max-width: 100%; display: block; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .wrap { width: 100%; max-width: var(--measure); margin: 0 auto; padding: 0 1rem; }

  /* ========= SCROLL PROGRESS ========= */
  #progress {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    width: 0%;
    background: var(--accent);
    z-index: 60;
    transition: width 0.08s linear;
  }

  /* ========= TOPBAR ========= */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.55rem 1rem;
    background: var(--topbar-bg);
    border-bottom: 1px solid var(--hairline);
    box-shadow: 0 1px 6px var(--shadow);
  }
  .topbar-brand {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    min-width: 0;
  }
  .topbar-brand .tb-lesson {
    font-family: 'Prompt', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    color: var(--accent);
    white-space: nowrap;
  }
  .topbar-brand .tb-course {
    font-size: 0.82rem;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @media (max-width: 520px) { .topbar-brand .tb-course { display: none; } }

  .icon-btn {
    width: 40px;
    height: 40px;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background: var(--button-bg);
    border: 1px solid var(--shadow);
    transition: background-color 0.2s ease, transform 0.1s ease;
  }
  .icon-btn:hover { background: var(--button-hover); }
  .icon-btn:active { transform: scale(0.95); }
  .icon-btn svg { width: 20px; height: 20px; fill: var(--ink); }

  /* ========= SETTINGS PANEL ========= */
  .settings-wrap { position: relative; }
  .settings-panel {
    position: absolute;
    top: calc(100% + 0.5rem);
    right: 0;
    width: 260px;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-radius: 12px;
    box-shadow: 0 8px 28px var(--shadow-strong);
    padding: 0.9rem;
    z-index: 55;
  }
  .settings-panel[hidden] { display: none; }
  .settings-label {
    font-family: 'Prompt', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    margin-bottom: 0.45rem;
  }
  .theme-row { display: flex; gap: 0.4rem; margin-bottom: 1rem; }
  .theme-opt {
    flex: 1;
    padding: 0.5rem 0.2rem 0.45rem;
    border: 1px solid var(--shadow);
    border-radius: 8px;
    background: var(--button-bg);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--ink-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .theme-opt .sw {
    width: 100%;
    height: 16px;
    border-radius: 4px;
    border: 1px solid var(--shadow);
  }
  .theme-opt[aria-pressed="true"] {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .sw-warm  { background: linear-gradient(135deg, #f5ecd9 50%, #b8893a 50%); }
  .sw-paper { background: linear-gradient(135deg, #dee2e6 50%, #5a6b80 50%); }
  .sw-dark  { background: linear-gradient(135deg, #1a1815 50%, #d4b87a 50%); }

  /* Font-size slider — same pill component as the app's Vocabulary menu. */
  .font-slider {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 0.85rem;
    background: var(--bg);
    border: 1px solid var(--shadow);
    border-radius: 999px;
  }
  .font-slider .mfs-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink-soft);
    white-space: nowrap;
    display: flex;
    align-items: baseline;
    gap: 0.3rem;
  }
  .font-slider .mfs-a-small { font-size: 0.8rem; }
  .font-slider .mfs-a-big { font-size: 1.05rem; }
  .font-slider input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); cursor: pointer; }
  .font-slider .mfs-value {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent);
    min-width: 3.6ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ========= HERO ========= */
  .hero { text-align: center; padding: 2.4rem 0 1.6rem; }
  .hero h1 {
    font-family: 'Prompt', sans-serif;
    font-size: clamp(2rem, 7vw, 3rem);
    font-weight: 700;
    line-height: 1.05;
    color: var(--accent);
    letter-spacing: 0.01em;
  }
  .hero-rom {
    font-size: clamp(0.95rem, 3vw, 1.1rem);
    font-style: italic;
    font-weight: 500;
    color: var(--accent-2);
    margin-top: 0.15rem;
  }
  .hero-rom .th { font-style: normal; }
  .hero-lede {
    max-width: 32rem;
    margin: 0.9rem auto 0;
    color: var(--ink-soft);
    font-size: calc(1.02rem * var(--tx));
  }
  /* ========= CONTENTS ========= */
  .contents {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.5rem;
    margin: 0.5rem 0 2.6rem;
  }
  .toc-link {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.65rem 0.8rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-radius: var(--radius);
    text-decoration: none;
    color: var(--ink);
    font-size: 0.9rem;
    font-weight: 500;
    transition: border-color 0.15s ease, transform 0.12s ease;
  }
  .toc-link:hover { border-color: var(--accent); transform: translateY(-1px); }
  .toc-num {
    font-family: 'Prompt', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.06em;
    flex: 0 0 auto;
  }

  /* ========= PART SECTIONS ========= */
  .part {
    /* Clears the sticky topbar when a TOC link jumps here. */
    scroll-margin-top: 72px;
    margin-bottom: 3.2rem;
  }
  .part-head { margin-bottom: 1.3rem; }
  .part-eyebrow {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-family: 'Prompt', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.5rem;
  }
  .part-eyebrow::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }
  .part-head h2 {
    font-family: 'Prompt', sans-serif;
    font-size: calc(clamp(1.3rem, 4vw, 1.7rem) * var(--tx));
    font-weight: 600;
    line-height: 1.2;
    color: var(--ink);
  }
  .part-head p {
    margin-top: 0.4rem;
    color: var(--ink-soft);
    font-size: calc(1rem * var(--tx));
    max-width: 44rem;
  }

  /* ========= PHRASE CARDS ========= */
  .phrase-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
  }
  .phrase-card {
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-radius: var(--radius);
    padding: 1.1rem 1.15rem 1.2rem;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .question-transform {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    gap: 1rem;
    align-items: center;
  }
  .transform-example {
    min-width: 0;
    padding: 0.9rem 1rem;
    border-radius: calc(var(--radius) - 4px);
    background: color-mix(in srgb, var(--panel) 84%, var(--accent) 16%);
    border: 1px solid var(--hairline);
  }
  .transform-arrow {
    display: grid;
    justify-items: center;
    gap: 0.25rem;
    color: var(--accent-2);
    text-align: center;
  }
  .transform-arrow strong {
    font-family: 'Prompt', sans-serif;
    font-size: calc(0.78rem * var(--tx));
    line-height: 1.35;
  }
  .transform-arrow-symbol {
    font-size: 2rem;
    line-height: 1;
    color: var(--accent);
  }
  .speaker-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: 'Prompt', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-2);
    padding-bottom: 0.65rem;
    margin-bottom: 0.85rem;
    border-bottom: 1px solid var(--hairline);
    width: 100%;
  }
  /* Avatar icons in the speaker tags. Sized in rem, not em, so they stay
     put when the text-size slider moves — the tag label is fixed-size too. */
  .speaker-tag .sym-img {
    flex: none;
    width: 1.45rem;
    height: 1.45rem;
    object-fit: contain;
    margin-right: 0.1rem;
  }

  .line { margin-bottom: 0.95rem; }
  .line:last-child { margin-bottom: 0; }
  .question-transform .transform-example { margin-bottom: 0; }
  .line .th {
    font-size: calc(1.5rem * var(--tx));
    font-weight: 600;
    color: var(--ink);
    line-height: 1.7;
    word-break: break-word;
  }
  .line .rom {
    font-size: calc(1rem * var(--tx));
    font-weight: 500;
    color: var(--rom);
    line-height: 1.4;
    margin-top: 0.1rem;
  }
  .line .en {
    font-size: calc(0.9rem * var(--tx));
    color: var(--ink-soft);
    margin-top: 0.15rem;
  }

  /* The name slot that the personalisation input fills in. */
  .slot {
    display: inline-block;
    padding: 0 0.3em;
    border-bottom: 2px dotted var(--accent);
    color: var(--accent-2);
    font-weight: 600;
    min-width: 2.5em;
    text-align: center;
  }
  .slot.filled { border-bottom-style: solid; }

  /* The English line gets a plain slot — no underline, just a light
     emphasis once a real country is in it, so the sentence still reads
     as ordinary English. */
  .slot-en.filled { color: var(--ink); font-weight: 600; }

  /* ========= NAME PERSONALISATION ========= */
  .name-box {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.7rem;
    margin-top: 1.1rem;
    padding: 0.85rem 1rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
  }
  .name-box label {
    font-size: calc(0.92rem * var(--tx));
    font-weight: 500;
    color: var(--ink-soft);
  }
  .name-box input {
    flex: 1;
    min-width: 140px;
    padding: 0.5rem 0.75rem;
    font-size: calc(0.98rem * var(--tx));
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--shadow);
    border-radius: 8px;
  }
  .name-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--shadow); }

  /* ========= AUDIO PLAYER ========= */
  .player {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.85rem 1rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-radius: var(--radius);
    box-shadow: 0 1px 3px var(--shadow);
  }
  .player.is-error { opacity: 0.72; }

  /* A player nested inside a card would otherwise be panel-on-panel and
     disappear into it, so it drops back to the page background. */
  .phrase-card .player,
  .tip .player {
    background: var(--bg);
    box-shadow: none;
  }
  /* The .line above already contributes its own margin-bottom, so this only
     needs to top it up — 1.05rem here totalled ~2rem and read as a gap. */
  .phrase-card .player { margin-top: 0.35rem; }

  .play-btn {
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, filter 0.15s ease;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .play-btn svg { width: 22px; height: 22px; fill: var(--panel); }
  .play-btn:hover { filter: brightness(1.07); }
  .play-btn:active { transform: scale(0.94); }
  .play-btn:disabled { cursor: not-allowed; filter: grayscale(1); opacity: 0.5; }

  .player-body { flex: 1; min-width: 0; }
  .player-title {
    font-size: calc(0.92rem * var(--tx));
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 0.4rem;
    line-height: 1.3;
  }
  .player-title .hint { font-weight: 400; color: var(--ink-soft); }

  .player-bar {
    position: relative;
    height: 6px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--shadow);
    cursor: pointer;
    overflow: hidden;
  }
  .player-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
  }
  .player-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    margin-top: 0.4rem;
  }
  .player-time {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .player-tools { display: flex; gap: 0.35rem; }
  .mini-btn {
    padding: 0.2rem 0.6rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--bg);
    border: 1px solid var(--shadow);
    border-radius: 999px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .mini-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mini-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .player-error { font-size: 0.78rem; color: var(--ink-soft); font-style: italic; }

  /* ========= WAVEFORM PLAYER (listen-and-repeat tracks) =========
     Used only where a player carries data-waveform="true". It is a
     block, not the flex row above, because the waveform needs the
     full width under the title rather than a lane beside it. */
  .wave-player {
    display: block;
    padding: 0.95rem 1.1rem 0.85rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-radius: var(--radius);
    box-shadow: 0 1px 3px var(--shadow);
  }
  .wave-head { display: flex; align-items: center; gap: 0.9rem; }
  .wave-head-text { flex: 1; min-width: 0; }
  .wave-title {
    font-size: calc(0.92rem * var(--tx));
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
  }
  .wave-title .hint { font-weight: 400; color: var(--ink-soft); }
  .wave-sub {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 0.2rem;
    font-variant-numeric: tabular-nums;
  }
  .wave-canvas-wrap { margin-top: 0.8rem; }
  .wave-canvas {
    display: block;
    width: 100%;
    height: 78px;
    cursor: pointer;
    border-radius: 8px;
    touch-action: none;
  }
  .wave-canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .wave-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    margin-top: 0.55rem;
    flex-wrap: wrap;
  }
  .wave-time {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .wave-tools { display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; }
  .wave-tools .mini-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .wave-tools .mini-btn svg { width: 13px; height: 13px; fill: currentColor; display: block; }
  .wave-step { padding: 0.28rem 0.5rem; }
  .wave-gap { display: inline-flex; align-items: center; gap: 0.3rem; }
  .wave-gap-label { font-size: 0.75rem; font-weight: 600; color: var(--ink-soft); }
  .wave-select {
    font: inherit;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.2rem 0.4rem;
    color: var(--ink-soft);
    background: var(--bg);
    border: 1px solid var(--shadow);
    border-radius: 999px;
    cursor: pointer;
  }
  .wave-select:disabled { opacity: 0.45; cursor: not-allowed; }
  .wave-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  @media (max-width: 520px) {
    .wave-canvas { height: 64px; }
    .wave-foot { justify-content: flex-start; }
  }

  /* ========= LISTENING BLOCK (image + player) ========= */
  .listen-block {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 190px;
    gap: 1.5rem;
    align-items: center;
  }
  .listen-block .listen-figure { justify-self: center; text-align: center; }
  .listen-block .listen-figure img {
    max-height: 260px;
    width: auto;
    margin: 0 auto;
    filter: drop-shadow(0 6px 14px var(--shadow));
  }
  /* The homework illustration is two people side by side, so it needs a wider
     column than the single-figure blocks above. */
  .listen-block--wide { grid-template-columns: minmax(0, 1fr) 280px; }
  .listen-block--wide .listen-figure img { max-height: 210px; }
  .listen-block--conversation { grid-template-columns: minmax(0, 1fr) 300px; }
  .listen-block .listen-figure img.conversation-art {
    display: block;
    width: min(100%, 361px);
    height: auto;
    aspect-ratio: 361 / 283;
    object-fit: contain;
    max-height: none;
    filter: none;
  }
  /* Per-illustration proportions.
     The rule above shapes the box 361/283, so a picture with different
     proportions gets letterboxed inside it by object-fit: contain and draws
     smaller than the column actually allows — which is exactly why the
     portrait below looked undersized. Each modifier restates the real ratio
     and picks a width that lands the artwork at a comparable on-screen
     height, so no block towers over its neighbours. Widths stay inside
     min(100%, …), so every one still shrinks with its column.
       --portrait   lesson_8_02.jpg  441 x 627  (tall)
       --tall       lesson_8_05.jpg  502 x 560  (slightly taller than square)
       --landscape  lesson_8_07.jpg  302 x 234  (mildly landscape)
       --wide       lesson_8_06.jpg  738 x 482  (landscape) */
  .listen-block .listen-figure img.conversation-art--portrait {
    aspect-ratio: 441 / 627;
    width: min(100%, 200px);
  }
  .listen-block .listen-figure img.conversation-art--tall {
    aspect-ratio: 502 / 560;
    width: min(100%, 255px);
  }
  /* Capped at its own 302px so the artwork is never drawn larger than the
     source file and stays crisp; the column is 300px, so it fills it. */
  .listen-block .listen-figure img.conversation-art--landscape {
    aspect-ratio: 302 / 234;
    width: min(100%, 302px);
  }
  .listen-block .listen-figure img.conversation-art--wide {
    aspect-ratio: 738 / 482;
    width: min(100%, 300px);
  }
  /* Two portraits need more room than one: at 320px each gets ~156px, which is
     comfortably wider than either image needs at 195px tall, so the height —
     not the width — stays the limiting dimension for both. */
  .listen-block--pair { grid-template-columns: minmax(0, 1fr) 320px; }
  .listen-block.no-figure { grid-template-columns: 1fr; }

  /* Two speakers side by side (Parts 2 and 3).
     Each portrait is drawn into a box of the SAME fixed height using
     object-fit: contain, so the two people appear the same size on screen
     whatever the source files measure. Mali is 869×1250 (ratio 0.695) and
     Achara 738×1167 (ratio 0.632): letting the shared 190px-ish column width
     drive the size made Achara render noticeably taller, because the narrower
     image had height left to spare. Driving height instead of width fixes it,
     and it keeps working for David, whose dimensions we don't know here. */
  .listen-figure--pair {
    display: flex;
    gap: 0.5rem;
    align-items: flex-end;
    justify-content: center;
    width: 100%;
  }
  .listen-figure--pair .fig-one { flex: 1 1 0%; min-width: 0; text-align: center; }
  /* Matched at the same weight as the .listen-block .listen-figure img rules
     above and placed after them, so these are the values that actually win. */
  .listen-block .listen-figure--pair img {
    height: calc(var(--pair-h, 195px) * var(--fig-scale, 1));
    width: 100%;
    max-height: none;
    object-fit: contain;
    object-position: bottom center;
  }
  /* Part 3 only: Mali is drawn at 90% of the shared height so David reads as
     slightly taller beside her. Scaling the SHORTER figure down (rather than
     David up) is what keeps this safe: no image ever grows, so the block's
     height is unchanged and no image can become width-limited at any
     breakpoint. Because the pair is bottom-aligned, their feet stay on the
     same line. Part 2 is untouched, so Mali and Achara stay matched there. */
  .listen-figure--pair .fig-one--short img { --fig-scale: 0.9; }
  .fig-name {
    display: block;
    margin-top: 0.35rem;
    font-family: 'Prompt', sans-serif;
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align: center;
  }

  /* The two .jpg illustrations sit on their own white background, which floats
     awkwardly on the warm and dark themes — a soft frame settles them down. */
  .framed {
    border: 1px solid var(--shadow);
    border-radius: var(--radius);
    background: #fff;
    padding: 4px;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .linking-figure {
    width: min(100%, 620px);
    margin: 1rem auto 0;
  }
  .linking-figure img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 786 / 514;
    object-fit: cover;
  }
  /* Outweighs the drop-shadow on .listen-block .listen-figure img — the frame
     carries its own box-shadow, so the filter would only double it up. */
  .listen-block .listen-figure img.framed { filter: none; }

  .hw-brief {
    font-size: calc(1rem * var(--tx));
    color: var(--ink);
    margin-bottom: 1rem;
    max-width: 40rem;
  }
  .hw-brief strong { color: var(--accent-2); font-weight: 600; }
  @media (max-width: 640px) {
    .listen-block { grid-template-columns: 1fr; gap: 1.1rem; }
    .listen-block .listen-figure { order: -1; }
    .listen-block .listen-figure img { max-height: 190px; }
    /* Declared after the cap above so the pair keeps its own equal height. */
    .listen-block .listen-figure--pair img { max-height: none; }
    .listen-figure--pair { --pair-h: 175px; }
    .listen-block .listen-figure img.conversation-art {
      width: min(100%, 320px);
      max-height: none;
    }
    /* Same caps as above, restated after the 320px rule so they win inside
       this breakpoint. Without them the portrait would run 455px tall and
       push the transcript button off the first screen. */
    .listen-block .listen-figure img.conversation-art--portrait  { width: min(100%, 220px); }
    .listen-block .listen-figure img.conversation-art--tall      { width: min(100%, 250px); }
    .listen-block .listen-figure img.conversation-art--landscape { width: min(100%, 302px); }
    .listen-block .listen-figure img.conversation-art--wide      { width: min(100%, 320px); }
  }

  /* Landscape phones and small tablets: still a two-column grid, but a 320px
     figure column would squeeze the player. Narrow the figures and shrink
     their height to match, keeping height the limiting dimension. */
  @media (min-width: 641px) and (max-width: 760px) {
    .listen-block--pair { grid-template-columns: minmax(0, 1fr) 260px; }
    .listen-figure--pair { --pair-h: 160px; }
    /* Held to the blocks carrying a modifier illustration, so the existing
       conversation blocks keep the layout they already ship with. */
    .listen-block--art { grid-template-columns: minmax(0, 1fr) 250px; }
  }

  /* ========= REVEAL (transcript / answer) ========= */
  .reveal { margin-top: 0.9rem; }
  .reveal-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.42rem 0.9rem;
    font-size: calc(0.85rem * var(--tx));
    font-weight: 600;
    color: var(--accent-2);
    background: var(--panel);
    border: 1px dashed var(--accent);
    border-radius: 999px;
  }
  .reveal-btn:hover { background: var(--button-hover); }
  .reveal-btn .chev { transition: transform 0.2s ease; display: inline-block; }
  .reveal-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .reveal-body {
    margin-top: 0.7rem;
    padding: 0.85rem 1rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-left: 3px solid var(--accent-2);
    border-radius: var(--radius);
  }
  .reveal-body[hidden] { display: none; }
  /* A short teaching note under a transcript, set apart from the dialogue. */
  .reveal-note {
    margin-top: 0.9rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--hairline);
    font-size: calc(0.88rem * var(--tx));
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .reveal-note .th-inline { color: var(--ink); font-weight: 600; }
  .reveal-note .rom-inline { color: var(--rom); font-weight: 500; }

  /* ========= DIALOGUE TRANSCRIPT ========= */
  .dialogue { display: grid; }
  .turn {
    display: grid;
    grid-template-columns: 5rem minmax(0, 1fr);
    gap: 0 1rem;
  }
  /* Separator between speakers rather than a border on every turn — the reveal
     box already has its own accent edge, so extra rules would read as clutter. */
  .turn + .turn {
    margin-top: 0.9rem;
    padding-top: 0.9rem;
    border-top: 1px solid var(--hairline);
  }
  .turn-who {
    font-family: 'Prompt', sans-serif;
    font-size: calc(0.88rem * var(--tx));
    font-weight: 600;
    color: var(--accent);
    padding-top: 0.3rem;
  }
  .turn-lines .line { margin-bottom: 0.8rem; }
  .turn-lines .line:last-child { margin-bottom: 0; }
  .turn-lines .th { font-size: calc(1.28rem * var(--tx)); }

  @media (max-width: 560px) {
    .turn { grid-template-columns: 1fr; gap: 0.15rem; }
    .turn-who { padding-top: 0; }
  }

  /* ========= TIP BOX ========= */
  .tip {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 150px;
    gap: 1.2rem;
    align-items: center;
    margin-top: 1.3rem;
    padding: 1.05rem 1.15rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-left: 3px solid var(--accent-2);
    border-radius: var(--radius);
  }
  .tip-label {
    font-family: 'Prompt', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 0.4rem;
  }
  .tip p { font-size: calc(0.96rem * var(--tx)); color: var(--ink); }
  .tip .th-inline { font-weight: 600; }
  /* The casual form itself — spaced away from the sentence that introduces it
     and from the player that follows. */
  .tip-line { margin: 0.8rem 0 0.9rem; }
  .tip-note {
    margin-top: 0.9rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--hairline);
    font-size: calc(0.88rem * var(--tx));
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .tip-note .th-inline { color: var(--ink); }
  .tip .rom-inline { color: var(--rom); font-weight: 500; }
  .tip.no-figure { grid-template-columns: 1fr; }
  .tip-figure img { max-height: 170px; width: auto; margin: 0 auto; filter: drop-shadow(0 6px 14px var(--shadow)); }
  @media (max-width: 640px) {
    .tip { grid-template-columns: 1fr; }
    .tip-figure { order: -1; }
    .tip-figure img { max-height: 140px; }
  }

  /* ========= VOCABULARY ========= */
  .vocab-head {
    display: grid;
    grid-template-columns: 1fr 1fr 1.2fr;
    gap: 0.5rem;
    padding: 0 0.9rem 0.45rem;
    margin-bottom: 0.5rem;
    border-bottom: 1px solid var(--hairline);
    font-family: 'Prompt', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .vocab-list { display: grid; grid-template-columns: 1fr; gap: 0.4rem; }
  .vocab-item {
    display: grid;
    grid-template-columns: 1fr 1fr 1.2fr;
    gap: 0.5rem;
    padding: 0.7rem 0.9rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-radius: 8px;
    align-items: center;
    transition: border-color 0.15s ease;
  }
  .vocab-item:hover { border-color: var(--accent); }
  .vocab-item .v-th  { font-weight: 600; color: var(--ink); font-size: calc(1.15rem * var(--tx)); line-height: 1.7; }
  .vocab-item .v-rom { font-weight: 500; color: var(--rom); font-size: calc(0.95rem * var(--tx)); }
  .vocab-item .v-en  { font-weight: 500; color: var(--ink); font-size: calc(0.95rem * var(--tx)); }

  /* Phones: the three columns become a stacked card — Thai leads, romanization
     under it, English as the muted gloss. Mirrors the app's ≤480px vocab row. */
  @media (max-width: 560px) {
    .vocab-head { display: none; }
    .vocab-item {
      grid-template-columns: 1fr;
      gap: 0.1rem;
      padding: 0.75rem 0.9rem;
    }
    .vocab-item .v-en { color: var(--ink-soft); font-size: calc(0.88rem * var(--tx)); order: 3; }
    .vocab-item .v-rom { order: 2; }
    .vocab-item .v-th { order: 1; font-size: calc(1.25rem * var(--tx)); }
  }

  /* ========= PREVIOUS LESSON LINK ========= */
  .prev-lesson {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    max-width: 30rem;
    margin: 0 auto 2.4rem;
    padding: 0.85rem 1.1rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-radius: var(--radius);
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 1px 3px var(--shadow);
    transition: border-color 0.15s ease, transform 0.12s ease;
  }
  .prev-lesson:hover { border-color: var(--accent); transform: translateY(-1px); }
  .prev-lesson .pl-arrow {
    flex: 0 0 auto;
    font-size: 1.1rem;
    color: var(--accent);
  }
  .prev-lesson .pl-text { min-width: 0; }
  /* The three labels are spans, so they need to be told to stack. */
  .prev-lesson .pl-kicker,
  .prev-lesson .pl-title,
  .prev-lesson .pl-sub { display: block; }
  .prev-lesson .pl-kicker {
    font-family: 'Prompt', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .prev-lesson .pl-title { font-size: calc(0.95rem * var(--tx)); font-weight: 600; line-height: 1.3; }
  .prev-lesson .pl-sub { font-size: calc(0.85rem * var(--tx)); color: var(--ink-soft); line-height: 1.35; }

  /* ========= FOOTER ========= */
  .foot {
    text-align: center;
    padding: 2.2rem 0 3rem;
    border-top: 1px solid var(--hairline);
    margin-top: 1rem;
  }
  .foot-line {
    font-family: 'Prompt', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 0.2rem;
  }
  .foot-rom { font-style: italic; font-size: 0.9rem; color: var(--accent-2); margin-bottom: 1rem; }
  .foot-rom .th { font-style: normal; }
  .foot-credit { font-size: 0.8rem; color: var(--ink-soft); }
  .foot-credit-link {
    display: inline-flex;
    align-items: center;
    gap: 0.3em;
    margin-left: 0.12em;
    padding: 0.2em 0.58em;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    background: var(--button-bg);
    box-shadow: 0 2px 7px var(--shadow);
    color: var(--accent-2);
    font-weight: 600;
    line-height: 1.35;
    text-decoration: none;
    transition: transform 180ms ease, color 180ms ease, background-color 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    transform: translateZ(0);
  }
  .foot-credit-link::after {
    content: '\2197';
    font-size: 0.9em;
    line-height: 1;
    opacity: 0.72;
  }
  .foot-credit-link:hover {
    color: var(--accent);
    background: var(--button-hover);
    border-color: var(--accent);
    box-shadow: 0 4px 12px var(--shadow-strong);
    transform: translateY(-1px) scale(1.04);
  }
  .foot-credit-link:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }
  .foot-credit-link:active { transform: translateY(0) scale(0.99); }

  /* ========= BACK TO TOP ========= */
  #to-top {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--shadow);
    box-shadow: 0 3px 12px var(--shadow-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 45;
  }
  #to-top.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  #to-top svg { width: 20px; height: 20px; fill: var(--accent); }

  .key-grid, .question-grid, .tone-grid, .answer-grid { display:grid; gap:.85rem; }
  .key-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .question-grid, .answer-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .tone-grid { grid-template-columns:repeat(5,minmax(0,1fr)); }
  .key-card, .question-card, .tone-card, .answer-card {
    min-width:0; padding:1rem; border:1px solid var(--shadow); border-radius:var(--radius);
    background:color-mix(in srgb,var(--panel) 92%,var(--accent) 8%);
  }
  .key-card .th { font-size:calc(1.55rem * var(--tx)); font-weight:700; }
  .key-card .player { margin-top:.75rem; background:var(--bg); box-shadow:none; }
  .template-slot {
    display:inline-block;
    font-style:italic;
    text-decoration:underline;
    text-decoration-thickness:.08em;
    text-underline-offset:.16em;
  }
  .question-card .player { margin-top:.7rem; }
  .question-number, .tone-name {
    margin-bottom:.4rem; font-family:'Prompt',sans-serif; color:var(--accent-2);
    font-size:calc(.78rem * var(--tx)); font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  }
  .tone-card, .answer-card { text-align:center; }
  .tone-card .rom { font-size:calc(1.2rem * var(--tx)); font-weight:700; }
  .tone-card .en, .answer-card .en { color:var(--ink-soft); font-size:calc(.88rem * var(--tx)); }
  .answer-card .th { font-size:calc(1.3rem * var(--tx)); font-weight:700; }
  .answer-card .rom { color:var(--rom); font-weight:600; }
  .answer-grid.two { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .answer-grid.five { grid-template-columns:repeat(5,minmax(0,1fr)); }
  .stack-lines .line + .line { margin-top:.9rem; padding-top:.9rem; border-top:1px solid var(--hairline); }
  .homework-age-grid {
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:1rem;
  }
  .homework-age-card {
    min-width:0;
    padding:1rem;
    border:1px solid var(--shadow);
    border-radius:var(--radius);
    background:var(--panel);
  }
  .homework-age-card .question-number { text-align:center; }
  .homework-age-card img {
    display:block;
    width:100%;
    height:180px;
    object-fit:contain;
    margin:0 auto .85rem;
  }
  .homework-age-card .player { margin-top:0; background:var(--bg); box-shadow:none; }
  .homework-age-card .reveal-body { text-align:center; }
  .homework-listen-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem;
  }
  .homework-listen-card {
    min-width: 0;
    padding: 1rem;
    border: 1px solid var(--shadow);
    border-radius: var(--radius);
    background: var(--panel);
    box-shadow: 0 1px 3px var(--shadow);
  }
  .homework-listen-card .player { margin-top: 0; background: var(--bg); box-shadow: none; }
  .homework-listen-card .reveal-body { text-align: center; }
  @media(max-width:760px){
    .question-grid{grid-template-columns:1fr}.tone-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .answer-grid.five{grid-template-columns:repeat(2,minmax(0,1fr))}
    .homework-age-grid{grid-template-columns:1fr}
    .homework-age-card img{height:auto;max-height:220px}
    .homework-listen-grid{grid-template-columns:1fr}
  }
  /* ========= THREE "TO BE" VERBS SUMMARY (Part 10) =========
     Three equal cards, each led by the Thai word set large. Built from the
     same tokens as .answer-card so it reads as part of the same family. */
  .tobe-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1rem;
  }
  .tobe-card {
    min-width: 0;
    padding: 1.1rem 1.15rem 1.2rem;
    border: 1px solid var(--shadow);
    border-top: 3px solid var(--accent);
    border-radius: var(--radius);
    background: var(--panel);
    box-shadow: 0 1px 3px var(--shadow);
  }
  .tobe-card .tobe-th {
    font-family: 'Sarabun', sans-serif;
    font-size: calc(2rem * var(--tx));
    font-weight: 700;
    line-height: 1.5;
    color: var(--ink);
  }
  .tobe-card .tobe-rom {
    font-size: calc(1rem * var(--tx));
    font-weight: 600;
    font-style: italic;
    color: var(--rom);
  }
