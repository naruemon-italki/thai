    function play(from) {
      if (!buffer) return;
      /* buildPlayer keeps its own stopOthers() private to its closure, so
         this walks the shared registry directly. */
      for (var pi = 0; pi < players.length; pi++) {
        if (players[pi] !== api) players[pi].pause();
      }
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      dropSource();

      var at = (typeof from === 'number') ? from : startOffset;
      if (at >= buffer.duration - 0.02) at = 0;

      var node = ctx.createBufferSource();
      node.buffer = buffer;
      /* Always 1: slowing down is done by rebuilding the audio, never by
         resampling it, so the speaker's pitch never moves. */
      node.playbackRate.value = 1;
      if (loopIdx >= 0 && words[loopIdx]) {
        node.loop = true;
        node.loopStart = words[loopIdx].s;
        node.loopEnd = loopEnd(loopIdx);
        if (at < node.loopStart || at > node.loopEnd) at = node.loopStart;
      }
      node.connect(gainNode);
      node.onended = function () { if (source === node) stop(true); };
      source = node;
      node.start(0, at);

      startOffset = at;
      startedAt = ctx.currentTime;
      playing = true;
      btn.innerHTML = ICON_PAUSE;
      btn.setAttribute('aria-label', 'Pause');
      tick();
    }

    function tick() {
      render();
      if (playing) raf = requestAnimationFrame(tick);
    }

    function seek(t, keepPlaying) {
      var was = playing;
      if (playing) stop(false);
      startOffset = Math.max(0, Math.min(buffer ? buffer.duration : 0, t));
      if (was || keepPlaying) play(startOffset); else render();
    }

    /* ---- word lookup ----
       Three different questions, three different answers — conflating
       them is what made ⏭ skip a word. */

    /* The word the playhead is INSIDE, or -1 while in a pause. */
    function wordIndexAt(t) {
      for (var i = 0; i < words.length; i++) {
        if (t >= words[i].s && t <= words[i].e) return i;
      }
      return -1;
    }

    /* The word this moment belongs to: the one being spoken, or the
       one whose pause we are sitting in. Used by Loop word and by the
       rebuild, which need an answer even mid-silence. */
    function wordIndexNear(t) {
      var last = -1;
      for (var i = 0; i < words.length; i++) {
        if (words[i].s <= t + 0.05) last = i; else break;
      }
      return last;
    }

    function jump(dir) {
      if (!words.length) return;
      var t = pos(), i;
      if (dir > 0) {
        i = -1;
        for (var k = 0; k < words.length; k++) {
          if (words[k].s > t + 0.05) { i = k; break; }
        }
        if (i < 0) return;                 /* already at the last word */
      } else {
        /* First press restarts the word you are on; press again to
           step back. Sitting in a pause counts as "on" the word you
           have just heard, which is the one you want to hear again. */
        i = wordIndexNear(t - 0.25);
        if (i < 0) i = 0;
      }
      if (loopIdx >= 0) loopIdx = i;
      seek(words[i].s, true);
    }

    /* ---- drawing ---- */
    function cssVar(name, fallbackColor) {
      var v = getComputedStyle(el).getPropertyValue(name);
      return (v && v.trim()) || fallbackColor;
    }

    /* Canvas roundRect() is recent, so this draws the path by hand. */
    function roundRect(g, x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      g.beginPath();
      g.moveTo(x + r, y);
      g.arcTo(x + w, y,     x + w, y + h, r);
      g.arcTo(x + w, y + h, x,     y + h, r);
      g.arcTo(x,     y + h, x,     y,     r);
      g.arcTo(x,     y,     x + w, y,     r);
      g.closePath();
    }

    function buildPeaks(buckets) {
      var d = buffer.getChannelData(0), n = d.length;
      var out = new Float32Array(buckets), max = 0;
      var step = n / buckets;
      for (var i = 0; i < buckets; i++) {
        var a = Math.floor(i * step), b = Math.min(n, Math.floor((i + 1) * step));
        var m = 0;
        for (var j = a; j < b; j++) {
          var v = d[j] < 0 ? -d[j] : d[j];
          if (v > m) m = v;
        }
        out[i] = m;
        if (m > max) max = m;
      }
      if (max > 0) for (i = 0; i < buckets; i++) out[i] /= max;
      peaks = out;
      peakBuckets = buckets;
    }

    function render() {
      if (!buffer || !canvas.clientWidth) return;

      var dpr  = window.devicePixelRatio || 1;
      var wCss = canvas.clientWidth;
      var hCss = canvas.clientHeight || 78;
      var W = Math.round(wCss * dpr), H = Math.round(hCss * dpr);
      if (canvas.width !== W || canvas.height !== H) {
        canvas.width = W;
        canvas.height = H;
        peaks = null;
      }

      var barW = 2 * dpr, step = 3 * dpr;
      var buckets = Math.max(1, Math.floor(W / step));
      if (!peaks || peakBuckets !== buckets) buildPeaks(buckets);

      var g = canvas.getContext('2d');
      var accent = cssVar('--accent', '#b8893a');
      var soft   = cssVar('--ink-soft', '#6b5d44');
      var dur    = buffer.duration;
      var t      = pos();

      /* A label lane across the top carries the word numbers; the
         waveform lives underneath it. */
      var lane = Math.round(14 * dpr);
      var top = lane, boxH = H - lane;
      var mid = top + boxH / 2, maxH = boxH - 8 * dpr;
      var playedX = (t / dur) * W;
      function X(sec) { return (sec / dur) * W; }

      g.clearRect(0, 0, W, H);

      /* Pauses are marked, not boxed: an inset rounded shape at very
         low opacity. Enough to say "wait here", quiet enough to stay
         in the background. */
      var prevEnd = 0, k;
      for (k = 0; k <= items.length; k++) {
        var gs = prevEnd;
        var ge = (k < items.length) ? items[k].s : dur;
        if (ge - gs > 0.35) {
          g.save();
          g.globalAlpha = 0.05;
          g.fillStyle = soft;
          roundRect(g, X(gs), top + boxH * 0.16, X(ge) - X(gs), boxH * 0.68, 5 * dpr);
          g.fill();
          g.restore();
        }
        if (k < items.length) prevEnd = items[k].e;
      }

      /* The word being spoken right now, softly lit. */
      var cur = wordIndexAt(t);
      var marked = loopIdx >= 0 ? loopIdx : cur;
      if (marked >= 0 && words[marked]) {
        g.save();
        g.globalAlpha = loopIdx >= 0 ? 0.16 : 0.10;
        g.fillStyle = accent;
        roundRect(g, X(words[marked].s), top, X(words[marked].e) - X(words[marked].s), boxH, 4 * dpr);
        g.fill();
        g.restore();
      }

      for (var i = 0; i < buckets; i++) {
        var x = i * step;
        var h = Math.max(2 * dpr, peaks[i] * maxH);
        g.fillStyle = accent;
        g.globalAlpha = (x + barW / 2 <= playedX) ? 1 : 0.28;
        g.fillRect(x, mid - h / 2, barW, h);
      }
      g.globalAlpha = 1;

      /* Word numbers. These replace the old tick marks: a number says
         what a tick could not, and turns the waveform into a map the
         student can aim at. */
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = '600 ' + Math.round(10 * dpr) + 'px "Prompt", "Sarabun", sans-serif';
      if (lead && items.length) {
        g.globalAlpha = 0.5;
        g.fillStyle = soft;
        g.fillText('▸', (X(items[0].s) + X(items[0].e)) / 2, lane / 2);
      }
      var lastLabelX = -1e9;
      for (i = 0; i < words.length; i++) {
        var cx = (X(words[i].s) + X(words[i].e)) / 2;
        if (cx - lastLabelX < 13 * dpr) continue;   /* never let numbers collide */
        lastLabelX = cx;
        var hot = (i === marked);
        g.globalAlpha = hot ? 1 : 0.55;
        g.fillStyle = hot ? accent : soft;
        g.fillText(String(i + 1), cx, lane / 2);
      }
      g.globalAlpha = 1;

      g.fillStyle = accent;
      g.fillRect(Math.min(W - 2 * dpr, playedX), 0, 2 * dpr, H);

      timeEl.textContent = fmt(t) + ' / ' + fmt(dur);
      canvas.setAttribute('aria-valuenow', Math.round((t / dur) * 100));
      sub.textContent = statusText(t, cur);
    }

    function statusText(t, cur) {
      if (!words.length) return 'Click the waveform to jump anywhere';
      var n = words.length, head = n + ' words · ';
      if (loopIdx >= 0) return head + 'looping word ' + (loopIdx + 1);
      if (lead && items.length && t < items[0].e) return head + 'instructions';
      if (cur >= 0) return head + 'word ' + (cur + 1) + ' of ' + n;
      var near = wordIndexNear(t);
      if (near < 0) return head + 'ready';
      return head + 'your turn — repeat word ' + (near + 1);
    }

    /* ---- interaction ---- */
    btn.addEventListener('click', function () {
      if (playing) stop(false); else play();
    });

    replay.addEventListener('click', function () {
      loopIdx = -1;
      loopB.setAttribute('aria-pressed', 'false');
      play(0);
    });

    /* Clicking a phrase snaps to its start, so a click can never land
       40 ms into a word and clip its first consonant. Clicking a pause
       still seeks exactly where you pointed. */
    canvas.addEventListener('click', function (e) {
      if (!buffer) return;
      var r = canvas.getBoundingClientRect();
      var ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      var t = ratio * buffer.duration;
      for (var i = 0; i < items.length; i++) {
        if (t >= items[i].s && t <= items[i].e) { t = items[i].s; break; }
      }
      loopIdx = -1;
      loopB.setAttribute('aria-pressed', 'false');
      seek(t);
    });

    canvas.addEventListener('keydown', function (e) {
      if (!buffer) return;
      if (e.key === 'ArrowRight') { seek(pos() + 2); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { seek(pos() - 2); e.preventDefault(); }
      else if (e.key === ' ' || e.key === 'Enter') {
        if (playing) stop(false); else play();
        e.preventDefault();
      }
    });

    prevB.addEventListener('click', function () { jump(-1); });
    nextB.addEventListener('click', function () { jump(1); });

    loopB.addEventListener('click', function () {
      var on = loopB.getAttribute('aria-pressed') === 'true';
      if (on) {
        /* Releasing the loop always continues from just after the word
           that was looping, whether it ran round twice or fifty times.
           The old code read pos() AFTER clearing loopIdx, so pos() no
           longer wrapped and handed back the raw elapsed time — loop a
           word for half a minute and playback resumed half a minute
           further down the track. Read the resume point first, clear
           the loop second. */
        var at = words[loopIdx] ? words[loopIdx].e : pos();
        loopIdx = -1;
        loopB.setAttribute('aria-pressed', 'false');
        if (playing) play(at);
        else { startOffset = at; render(); }
      } else {
        var i = wordIndexNear(pos());
        if (i < 0) i = 0;
        loopIdx = i;
        loopB.setAttribute('aria-pressed', 'true');
        play(words[i].s);
      }
    });

    slowB.addEventListener('click', function () {
      var on = slowB.getAttribute('aria-pressed') === 'true';
      if (on) {
        rate = 1;
        slowB.setAttribute('aria-pressed', 'false');
        rebuild(gapNow());
        return;
      }
      ensureSlow(function () {
        rate = SLOW_RATE;
        slowB.setAttribute('aria-pressed', 'true');
        rebuild(gapNow());
      });
    });

    gapSel.addEventListener('change', function () {
      rebuild(parseFloat(gapSel.value) || 0);
    });
  }

  /* Waveforms are painted, not styled, so they have to be repainted
     when the theme changes or the element is resized. */
  function repaintWaves() {
    for (var i = 0; i < waveRedraws.length; i++) waveRedraws[i]();
  }
  if (window.MutationObserver) {
    new MutationObserver(repaintWaves).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  var waveResizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(waveResizeTimer);
    waveResizeTimer = setTimeout(repaintWaves, 120);
  }, { passive: true });

  Array.prototype.forEach.call(document.querySelectorAll('.player[data-src]'), function (el) {
    if (el.getAttribute('data-waveform') === 'true') buildWavePlayer(el);
    else buildPlayer(el);
  });

  /* =========================================================
     REVEAL BUTTONS
     ========================================================= */
  Array.prototype.forEach.call(document.querySelectorAll('.reveal-btn'), function (btn) {
    btn.addEventListener('click', function () {
      var body = document.getElementById(btn.getAttribute('aria-controls'));
      if (!body) return;
      var open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      body.hidden = open;
      btn.firstChild.nodeValue = (open ? btn.dataset.showLabel : btn.dataset.hideLabel) || btn.firstChild.nodeValue;
    });
    // Remember both label variants ("Show …" / "Hide …") on first wire.
    var label = btn.firstChild.nodeValue.trim();
    btn.dataset.showLabel = ' ' + label + ' ';
    btn.dataset.hideLabel = ' ' + label.replace(/^Show/, 'Hide') + ' ';
  });

  /* =========================================================
     COUNTRY PERSONALISATION
     Fills the student's country into the ผมมาจาก … ครับ pattern.
     ========================================================= */
  var countryInput = document.getElementById('yourcountry');
  var slotsTh   = document.querySelectorAll('[data-slot-th]');
  var slotsRom  = document.querySelectorAll('[data-slot-rom]');
  var slotsEn   = document.querySelectorAll('[data-slot-en]');

  function applyCountry(v) {
    var country = (v || '').trim();
    Array.prototype.forEach.call(slotsTh, function (s) {
      s.textContent = country || '…';
      s.classList.toggle('filled', !!country);
    });
    Array.prototype.forEach.call(slotsRom, function (s) {
      s.textContent = country || 'your country';
      s.classList.toggle('filled', !!country);
    });
    /* The full stop belongs to the finished sentence, so it only
       appears once there is a real country to end. */
    Array.prototype.forEach.call(slotsEn, function (s) {
      s.textContent = country ? country + '.' : '…';
      s.classList.toggle('filled', !!country);
    });
  }

  if (countryInput) {
    try {
      var saved = localStorage.getItem('thaiL2Country');
      if (saved) { countryInput.value = saved; applyCountry(saved); }
    } catch (e) {}

    countryInput.addEventListener('input', function () {
      applyCountry(countryInput.value);
      try { localStorage.setItem('thaiL2Country', countryInput.value.trim()); } catch (e) {}
    });
  }

  /* =========================================================
     THEME + TEXT SIZE

     The storage keys below are deliberately the "L1" ones. Theme and text
     size are reader preferences, not lesson data, so every review page in
     the course shares one pair of keys — set dark + 110% in Lesson 1 and
     Lesson 2 opens the same way. Keep these names in future lessons too.
     Lesson-specific answers (thaiL2Country) stay per-lesson.
     ========================================================= */
  var TOPBAR_COLOR = { warm: '#fffaf0', paper: '#eef1f4', dark: '#2a2622' };
  var metaColor = document.getElementById('meta-theme-color');
  var themeBtns = document.querySelectorAll('[data-theme-set]');

  function setTheme(name) {
    if (name === 'warm') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', name);
    if (metaColor) metaColor.setAttribute('content', TOPBAR_COLOR[name] || '#fffaf0');
    Array.prototype.forEach.call(themeBtns, function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-theme-set') === name ? 'true' : 'false');
    });
    try { localStorage.setItem('thaiL1Theme', name); } catch (e) {}
  }

  Array.prototype.forEach.call(themeBtns, function (b) {
    b.addEventListener('click', function () { setTheme(b.getAttribute('data-theme-set')); });
  });

  var slider = document.getElementById('text-slider');
  var sliderVal = document.getElementById('text-value');

  function setScale(n) {
    document.documentElement.style.setProperty('--tx', (n / 100).toFixed(2));
    if (sliderVal) sliderVal.textContent = n + '%';
    try { localStorage.setItem('thaiL1Text', String(n)); } catch (e) {}
  }

  if (slider) {
    slider.addEventListener('input', function () {
      var n = parseInt(slider.value, 10);
      if (isFinite(n)) setScale(n);
    });
  }

  // Restore saved preferences.
  try {
    var t = localStorage.getItem('thaiL1Theme');
    setTheme((t === 'paper' || t === 'dark') ? t : 'warm');

    var s = parseInt(localStorage.getItem('thaiL1Text'), 10);
    if (isFinite(s) && s >= 90 && s <= 140) { if (slider) slider.value = s; setScale(s); }
  } catch (e) { setTheme('warm'); }

  /* =========================================================
     SETTINGS PANEL
     ========================================================= */
  var settingsBtn   = document.getElementById('btn-settings');
  var settingsPanel = document.getElementById('settings-panel');

  function closeSettings() {
    settingsPanel.hidden = true;
    settingsBtn.setAttribute('aria-expanded', 'false');
  }

  settingsBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = !settingsPanel.hidden;
    settingsPanel.hidden = open;
    settingsBtn.setAttribute('aria-expanded', open ? 'false' : 'true');
  });

  document.addEventListener('click', function (e) {
    if (!settingsPanel.hidden && !settingsPanel.contains(e.target)) closeSettings();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !settingsPanel.hidden) { closeSettings(); settingsBtn.focus(); }
  });

  /* =========================================================
     SCROLL PROGRESS + BACK TO TOP
     ========================================================= */
  var progress = document.getElementById('progress');
  var toTop = document.getElementById('to-top');
  var ticking = false;

  function onScroll() {
    var doc = document.documentElement;
    var max = doc.scrollHeight - doc.clientHeight;
    var y = window.scrollY || doc.scrollTop;
    progress.style.width = (max > 0 ? (y / max) * 100 : 0) + '%';
    toTop.classList.toggle('show', y > 600);
    ticking = false;
  }

  window.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; window.requestAnimationFrame(onScroll); }
  }, { passive: true });

  window.addEventListener('resize', onScroll, { passive: true });
  onScroll();

  toTop.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

})();
</script>
</body>
</html>
