<script>
document.querySelector('.tb-lesson').textContent = 'Lesson 8 · Review';
document.querySelector('main').innerHTML = `
<div class="wrap">
  <section class="hero">
    <h1>Lesson 8</h1>
    <p class="hero-rom"><span class="th">บทเรียนที่ 8</span> - bòt rian têe bpàet</p>
    <p class="hero-lede">English has one verb "to be". Thai has <strong>three</strong>, and each one does a different job: <span class="th">อยู่</span> yòo for where things are, <span class="th">คือ</span> keu for saying what something is, and <span class="th">เป็น</span> bpen for describing someone. In <strong>Lesson 8</strong> you meet all three - plus your first look at the past tense.<br>This is a <strong>focused review</strong>: see each pattern, listen before you read, then finish with the full vocabulary.<br>Tip: Use the <strong>settings</strong> button in the top-right corner to change the theme or text size.</p>
  </section>

  <nav class="contents" aria-label="Lesson contents">
    <a class="toc-link" href="#part-1"><span class="toc-num">01</span> Where you are - อยู่ yòo</a>
    <a class="toc-link" href="#part-2"><span class="toc-num">02</span> Asking "Where?"</a>
    <a class="toc-link" href="#part-3"><span class="toc-num">03</span> Happening right now</a>
    <a class="toc-link" href="#part-4"><span class="toc-num">04</span> Yesterday and last night</a>
    <a class="toc-link" href="#part-5"><span class="toc-num">05</span> Saying you didn't</a>
    <a class="toc-link" href="#part-6"><span class="toc-num">06</span> นี่ nêe, นั่น nân and คือ keu</a>
    <a class="toc-link" href="#part-7"><span class="toc-num">07</span> "Or" and "is not"</a>
    <a class="toc-link" href="#part-8"><span class="toc-num">08</span> Example conversations</a>
    <a class="toc-link" href="#part-9"><span class="toc-num">09</span> Jobs and nationalities</a>
    <a class="toc-link" href="#part-10"><span class="toc-num">10</span> The three verbs at a glance</a>
    <a class="toc-link" href="#part-11"><span class="toc-num">11</span> Vocabulary</a>
    <a class="toc-link" href="#part-12"><span class="toc-num">12</span> Homework</a>
  </nav>

  <!-- ===================== PART 1 ===================== -->
  <section class="part" id="part-1">
    <div class="part-head"><div class="part-eyebrow">Part 01</div><h2>Where you are - อยู่ <span class="rom-inline">yòo</span></h2><p>The first of Thai's three "to be" verbs. <span class="th-inline">อยู่</span> <span class="rom-inline">yòo</span> means "to be at" or "to be located" - use it whenever you're saying <em>where</em> someone or something is.</p></div>
    <div class="phrase-card">
      <div class="speaker-tag">The basic pattern</div>
      <div class="line"><div class="th">ผมอยู่ที่บ้าน</div><div class="rom">pŏm yòo têe bâan</div><div class="en">I am at home.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">ผมอยู่บ้าน</div><div class="rom">pŏm yòo bâan</div><div class="en">I am at home. <strong>(same meaning)</strong></div></div>
    </div>
    <div class="tip no-figure"><div><div class="tip-label">Do you need ที่ têe?</div><p><span class="th-inline">ที่</span> <span class="rom-inline">têe</span> means "at", but <span class="th-inline">อยู่</span> <span class="rom-inline">yòo</span> already tells the listener you're talking about a location - so in everyday speech <span class="th-inline">ที่</span> is usually dropped.</p><p class="tip-line">Simple rule: <strong>drop</strong> <span class="th-inline">ที่</span> before a place, <strong>keep</strong> it before an activity. <span class="th-inline">บ้าน</span> <span class="rom-inline">bâan</span> (home) and <span class="th-inline">โรงเรียน</span> <span class="rom-inline">rohng rian</span> (school) are places, so <span class="th-inline">ที่</span> can go. But <span class="th-inline">ทำงาน</span> <span class="rom-inline">tam ngaan</span> is a verb ("to work"), so you must say <span class="th-inline">อยู่ที่ทำงาน</span> <span class="rom-inline">yòo têe tam ngaan </span>(I'm at work).</p></div></div>
    <div class="part-head" style="margin-top:1.8rem"><h3>Statement, negative, question</h3><p>Nothing new here - <span class="th-inline">อยู่</span> <span class="rom-inline">yòo</span> behaves like any other verb you've learned.</p></div>
    <div class="phrase-card">
      <div class="line"><div class="th">ผมอยู่บ้าน</div><div class="rom">pŏm yòo bâan</div><div class="en">I am at home.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">ผมไม่อยู่บ้าน</div><div class="rom">pŏm mâi yòo bâan</div><div class="en">I am not at home. <strong>(ไม่ mâi before the verb)</strong></div></div>
      <div class="line" style="margin-top:1rem"><div class="th">คุณอยู่บ้านไหม</div><div class="rom">kun yòo bâan măi</div><div class="en">Are you at home? <strong>(ไหม măi at the end)</strong></div></div>
    </div>
    <div class="phrase-card" style="margin-top:1rem">
      <div class="speaker-tag">More places</div>
      <div class="line"><div class="th">พวกเขาอยู่โรงเรียน</div><div class="rom">pûak kăo yòo rohng rian</div><div class="en">They are at school.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">เขาอยู่ออฟฟิศ</div><div class="rom">kăo yòo òp-fít</div><div class="en">He / she is at the office.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">เขาอยู่ที่ทำงาน</div><div class="rom">kăo yòo têe tam ngaan</div><div class="en">He / she is at work.</div></div>
      <div class="player" data-src="lesson_8_01.mp3" data-title="Listen and repeat - อยู่ yòo and places" style="margin-top:1rem"></div>
    </div>
  </section>

  <!-- ===================== PART 2 ===================== -->
  <section class="part" id="part-2">
    <div class="part-head"><div class="part-eyebrow">Part 02</div><h2>Asking "Where?"</h2><p>One short question gets you a long way in Thailand: <span class="th-inline">อยู่ไหน</span> <span class="rom-inline">yòo năi</span>.</p></div>
    <div class="phrase-card">
      <div class="line"><div class="th">คุณอยู่ไหน</div><div class="rom">kun yòo năi</div><div class="en">Where are you?</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">อยู่ไหนครับ</div><div class="rom">yòo năi kráp</div><div class="en">Where are you? <strong>(everyday Thai, pronoun dropped)</strong></div></div>
      <div class="line" style="margin-top:1rem"><div class="th">ฉันอยู่ร้านอาหารค่ะ</div><div class="rom">chăn yòo ráan aa-hăan kâ</div><div class="en">I'm at a restaurant.</div></div>
    </div>
    <div class="tip no-figure"><div><div class="tip-label">ไหน năi - "where?" or "which?"</div><p>On its own, <span class="th-inline">ไหน</span> <span class="rom-inline">năi</span> means "where?". Put it <em>after a noun</em> and it means "which?" instead.</p></div></div>
    <div class="answer-grid two" style="margin-top:1rem">
      <div class="answer-card"><div class="th">ร้านอาหารไหน</div><div class="rom">ráan aa-hăan năi</div><div class="en">Which restaurant?</div></div>
      <div class="answer-card"><div class="th">โรงเรียนไหน</div><div class="rom">rohng rian năi</div><div class="en">Which school?</div></div>
    </div>
    <div class="listen-block listen-block--conversation listen-block--art" style="margin-top:1.4rem">
      <div>
        <p class="hw-brief"><strong>Listen first:</strong> two friends check in on each other. New word: <span class="th-inline">พักผ่อน</span> <span class="rom-inline">pák pòn</span> (to rest; relax).</p>
        <div class="player" data-src="lesson_8_02.mp3" data-title="Where are you? - a short exchange"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-dialogue-02">Show the transcript <span class="chev">▾</span></button><div class="reveal-body" id="l8-dialogue-02" hidden><div class="dialogue">
          <div class="turn"><div class="turn-who">A</div><div class="turn-lines"><div class="line"><div class="th">อยู่ไหน</div><div class="rom">yòo năi</div><div class="en">Where are you?</div></div></div></div>
          <div class="turn"><div class="turn-who">B</div><div class="turn-lines"><div class="line"><div class="th">ผมอยู่บ้าน แล้วคุณล่ะ</div><div class="rom">pŏm yòo bâan · láew kun lâ</div><div class="en">I'm at home. And you?</div></div></div></div>
          <div class="turn"><div class="turn-who">A</div><div class="turn-lines"><div class="line"><div class="th">ฉันอยู่โรงเรียน แล้วทำอะไรที่บ้าน</div><div class="rom">chăn yòo rohng rian · láew tam à-rai têe bâan</div><div class="en">I'm at school. And what are you doing at home?</div></div></div></div>
          <div class="turn"><div class="turn-who">B</div><div class="turn-lines"><div class="line"><div class="th">ผมพักผ่อน</div><div class="rom">pŏm pák pòn</div><div class="en">I'm relaxing.</div></div></div></div>
        </div></div></div>
      </div>
      <figure class="listen-figure"><img class="conversation-art conversation-art--tall" src="lesson_8_05.jpg" alt="A schoolgirl talking on the phone" loading="lazy" onerror="lessonImgFail(this)"></figure>
    </div>
    <div class="listen-block listen-block--pair" style="margin-top:1.8rem">
      <div>
        <p class="hw-brief"><strong>Listen first:</strong> David thinks he knows where Mali is. Where is she really? Listen for <span class="th-inline">ร้านไหน</span> <span class="rom-inline">ráan năi</span> - "which shop?"</p>
        <div class="player" data-src="lesson_8_03.mp3" data-title="David and Mali - which café?"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-dialogue-03">Show the transcript <span class="chev">▾</span></button><div class="reveal-body" id="l8-dialogue-03" hidden><div class="dialogue">
          <div class="turn"><div class="turn-who">David</div><div class="turn-lines"><div class="line"><div class="th">อยู่ที่ทำงานใช่ไหมครับ</div><div class="rom">yòo têe tam ngaan châi măi kráp</div><div class="en">You're at work, right?</div></div></div></div>
          <div class="turn"><div class="turn-who">Mali</div><div class="turn-lines"><div class="line"><div class="th">ไม่ใช่ค่ะ ฉันอยู่ร้านกาแฟ</div><div class="rom">mâi châi kâ · chăn yòo ráan gaa-fae</div><div class="en">No, I'm not. I'm at a café.</div></div></div></div>
          <div class="turn"><div class="turn-who">David</div><div class="turn-lines"><div class="line"><div class="th">ร้านไหน</div><div class="rom">ráan năi</div><div class="en">Which café?</div></div></div></div>
          <div class="turn"><div class="turn-who">Mali</div><div class="turn-lines"><div class="line"><div class="th">สตาร์บัคส์ค่ะ</div><div class="rom">Starbucks kâ</div><div class="en">Starbucks.</div></div></div></div>
        </div><div class="reveal-note"><span class="th-inline">ร้าน</span> <span class="rom-inline">ráan</span> is any shop or store, so <span class="th-inline">ร้านกาแฟ</span> <span class="rom-inline">ráan gaa-fae</span> is literally a "coffee shop".</div></div></div>
      </div>
      <figure class="listen-figure listen-figure--pair"><div class="fig-one"><img src="david.png" alt="David" loading="lazy" onerror="lessonImgFail(this)"><span class="fig-name">David</span></div><div class="fig-one"><img src="mali.png" alt="Mali" loading="lazy" onerror="lessonImgFail(this)"><span class="fig-name">Mali</span></div></figure>
    </div>
    <div class="tip no-figure"><div><div class="tip-label">Essential phrase - "Where's the bathroom?"</div><p>When nature calls, this is the one to have ready. Start with a polite "excuse me" to get someone's attention, then ask.</p><div class="line tip-line"><div class="th">ขอโทษครับ ห้องน้ำอยู่ไหนครับ</div><div class="rom">kŏr tôht kráp · hông náam yòo năi kráp</div><div class="en">Excuse me. Where's the bathroom?</div></div><div class="player" data-src="lesson_8_04.mp3" data-title="Excuse me, where's the bathroom?"></div><p class="tip-note">Women say <span class="th-inline">ค่ะ</span> <span class="rom-inline">kâ</span> / <span class="th-inline">คะ</span> <span class="rom-inline">ká</span> instead. Fun fact: <span class="th-inline">ห้อง</span> <span class="rom-inline">hông</span> is "room" and <span class="th-inline">น้ำ</span> <span class="rom-inline">náam</span> is "water" - so a bathroom is a "water room". We haven't covered directions yet, so hope for a helpful point of the finger.</p></div></div>
  </section>

  <!-- ===================== PART 3 ===================== -->
  <section class="part" id="part-3">
    <div class="part-head"><div class="part-eyebrow">Part 03</div><h2>อยู่ <span class="rom-inline">yòo</span> again - happening right now</h2><p>The same little word has a second job. Put <span class="th-inline">อยู่</span> <span class="rom-inline">yòo</span> <em>after</em> a verb and the action is happening at this moment - exactly like English "-ing".</p></div>
    <div class="phrase-card question-transform">
      <div class="transform-example line"><div class="th">กิน</div><div class="rom">gin</div><div class="en">to eat</div></div>
      <div class="transform-arrow" aria-label="Add อยู่ yòo after the verb"><span class="transform-arrow-symbol" aria-hidden="true">→</span><strong>Add อยู่ <span class="rom-inline">yòo</span></strong></div>
      <div class="transform-example line"><div class="th">กินอยู่</div><div class="rom">gin yòo</div><div class="en">eating</div></div>
    </div>
    <div class="phrase-card" style="margin-top:1rem">
      <div class="speaker-tag">If the verb has an object, อยู่ yòo goes last</div>
      <div class="line"><div class="th">ผมกินข้าวอยู่</div><div class="rom">pŏm gin kâao yòo</div><div class="en">I'm eating a meal.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">ฉันอ่านหนังสืออยู่</div><div class="rom">chăn àan năng-sĕu yòo</div><div class="en">I'm reading a book.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">เขาเล่นเกมอยู่</div><div class="rom">kăo lên gem yòo</div><div class="en">He / she is playing video games.</div></div>
      <div class="player" data-src="lesson_8_05.mp3" data-title="Listen and repeat - happening right now" style="margin-top:1rem"></div>
    </div>
    <div class="listen-block listen-block--conversation" style="margin-top:1.4rem">
      <div>
        <p class="hw-brief"><strong>Picture this:</strong> the phone rings in the middle of movie night. What is the man telling his friend?</p>
        <div class="player" data-src="lesson_8_06.mp3" data-title="What is he saying?"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-answer-06">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l8-answer-06" hidden><div class="line"><div class="th">เราดูหนังอยู่</div><div class="rom">rao doo năng yòo</div><div class="en">We are watching a movie.</div></div></div></div>
      </div>
      <figure class="listen-figure"><img class="conversation-art" src="lesson_8_01.jpg" alt="A couple watching a movie at home" loading="lazy" onerror="lessonImgFail(this)"></figure>
    </div>
    <div class="tip no-figure"><div><div class="tip-label">Good news: you can often skip it</div><p>Unlike English, Thai doesn't have to mark the present continuous every time. If the context already makes clear that something is happening now, native speakers simply leave <span class="th-inline">อยู่</span> <span class="rom-inline">yòo</span> out.</p><div class="line tip-line"><div class="th">ทำอะไร → ทำงาน</div><div class="rom">tam à-rai → tam ngaan</div><div class="en">What are you doing? → I'm working.</div></div><p class="tip-note">Neither the question nor the answer uses <span class="th-inline">อยู่ yòo</span>, and both are perfectly natural. So don't overthink this one - Thai grammar is being kind to you.</p></div></div>
  </section>

  <!-- ===================== PART 4 ===================== -->
  <section class="part" id="part-4">
    <div class="part-head"><div class="part-eyebrow">Part 04</div><h2>Yesterday and last night</h2><p>Thai verbs never change shape - there's no eat → ate here. To talk about the past you simply add a time word, and the verb stays exactly as it is.</p></div>
    <div class="phrase-card question-transform">
      <div class="transform-example line"><div class="th">ฉันกินผัดไทย</div><div class="rom">chăn gin pàt thai</div><div class="en">I eat Pad Thai.</div></div>
      <div class="transform-arrow" aria-label="Add a time word"><span class="transform-arrow-symbol" aria-hidden="true">→</span><strong>Add เมื่อวาน <span class="rom-inline">mêua waan</span></strong></div>
      <div class="transform-example line"><div class="th">เมื่อวานฉันกินผัดไทย</div><div class="rom">mêua waan chăn gin pàt thai</div><div class="en">Yesterday I ate Pad Thai.</div></div>
    </div>
    <div class="answer-grid two" style="margin-top:1rem">
      <div class="answer-card"><div class="th">เมื่อวาน</div><div class="rom">mêua waan</div><div class="en">yesterday</div></div>
      <div class="answer-card"><div class="th">เมื่อคืน</div><div class="rom">mêua keun</div><div class="en">last night</div></div>
    </div>
    <div class="phrase-card" style="margin-top:1rem">
      <div class="speaker-tag">Either end of the sentence works</div>
      <div class="line"><div class="th">เมื่อวานผมทำงาน</div><div class="rom">mêua waan pŏm tam ngaan</div><div class="en">I worked yesterday.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">เมื่อคืนเราดูหนัง</div><div class="rom">mêua keun rao doo năng</div><div class="en">We watched a movie last night.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">เราดูหนังเมื่อคืน</div><div class="rom">rao doo năng mêua keun</div><div class="en">We watched a movie last night. <strong>(same meaning)</strong></div></div>
      <div class="player" data-src="lesson_8_07.mp3" data-title="Listen and repeat - talking about the past" style="margin-top:1rem"></div>
    </div>
    <div class="part-head" style="margin-top:1.8rem"><h3>Your turn</h3><p>How would you ask a Thai friend these? Build each one, then reveal the answer.</p></div>
    <div class="homework-listen-grid">
      <div class="homework-listen-card"><div class="question-number">Say it in Thai</div><p class="hw-brief" style="margin-bottom:0.6rem">What did you do yesterday?</p><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-p4-a">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l8-p4-a" hidden><div class="line"><div class="th">เมื่อวานทำอะไร</div><div class="rom">mêua waan tam à-rai</div><div class="en">What did you do yesterday?</div></div></div></div></div>
      <div class="homework-listen-card"><div class="question-number">Say it in Thai</div><p class="hw-brief" style="margin-bottom:0.6rem">What did you eat last night?</p><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-p4-b">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l8-p4-b" hidden><div class="line"><div class="th">เมื่อคืนกินอะไร</div><div class="rom">mêua keun gin à-rai</div><div class="en">What did you eat last night?</div></div></div></div></div>
      <div class="homework-listen-card"><div class="question-number">Say it in Thai</div><p class="hw-brief" style="margin-bottom:0.6rem">You worked yesterday, right?</p><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-p4-c">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l8-p4-c" hidden><div class="line"><div class="th">เมื่อวานไปทำงานใช่ไหม</div><div class="rom">mêua waan bpai tam ngaan châi măi</div><div class="en">You went to work yesterday, right?</div></div></div></div></div>
    </div>
    <p class="hw-brief" style="margin-top:1rem">Notice that all three drop <span class="th-inline">คุณ</span> <span class="rom-inline">kun</span> (you). Leaving out personal pronouns is completely normal in spoken Thai once the context is clear.</p>
    <div class="listen-block listen-block--pair" style="margin-top:1.4rem">
      <div>
        <p class="hw-brief"><strong>Listen first:</strong> Somchai and Achara compare their evenings. Did they do the same thing?</p>
        <div class="player" data-src="lesson_8_08.mp3" data-title="Somchai and Achara - what did you do last night?"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-dialogue-08">Show the transcript <span class="chev">▾</span></button><div class="reveal-body" id="l8-dialogue-08" hidden><div class="dialogue">
          <div class="turn"><div class="turn-who">Somchai</div><div class="turn-lines"><div class="line"><div class="th">เมื่อคืนทำอะไรครับ</div><div class="rom">mêua keun tam à-rai kráp</div><div class="en">What did you do last night?</div></div></div></div>
          <div class="turn"><div class="turn-who">Achara</div><div class="turn-lines"><div class="line"><div class="th">ดูหนังอยู่บ้านค่ะ แล้วคุณล่ะคะ</div><div class="rom">doo năng yòo bâan kâ · láew kun lâ ká</div><div class="en">I watched movies at home. How about you?</div></div></div></div>
          <div class="turn"><div class="turn-who">Somchai</div><div class="turn-lines"><div class="line"><div class="th">เหมือนกัน</div><div class="rom">mĕuan gan</div><div class="en">Me too.</div></div></div></div>
        </div><div class="reveal-note">Achara's answer packs both jobs of <span class="th-inline">อยู่ yòo</span> into one sentence: <span class="rom-inline">doo năng</span> (watched movies) plus <span class="rom-inline">yòo bâan</span> (at home).</div></div></div>
      </div>
      <figure class="listen-figure listen-figure--pair"><div class="fig-one"><img src="somchai.png" alt="Somchai" loading="lazy" onerror="lessonImgFail(this)"><span class="fig-name">Somchai</span></div><div class="fig-one"><img src="achara.png" alt="Achara" loading="lazy" onerror="lessonImgFail(this)"><span class="fig-name">Achara</span></div></figure>
    </div>
  </section>

  <!-- ===================== PART 5 ===================== -->
  <section class="part" id="part-5">
    <div class="part-head"><div class="part-eyebrow">Part 05</div><h2>Saying you didn't - ไม่ได้ <span class="rom-inline">mâi dâai</span></h2><p>This is the one irregular bit in the lesson, so it's worth memorising. For a <em>past</em> negative, plain <span class="th-inline">ไม่</span> <span class="rom-inline">mâi</span> is not enough.</p></div>
    <div class="phrase-card question-transform">
      <div class="transform-example line"><div class="th">ไม่ + verb</div><div class="rom">mâi + verb</div><div class="en">I don't … (present)</div></div>
      <div class="transform-arrow" aria-label="For the past, use mâi dâai"><span class="transform-arrow-symbol" aria-hidden="true">→</span><strong>In the past</strong></div>
      <div class="transform-example line"><div class="th">ไม่ได้ + verb</div><div class="rom">mâi dâai + verb</div><div class="en">I didn't … (past)</div></div>
    </div>
    <div class="phrase-card" style="margin-top:1rem">
      <div class="line"><div class="th">เมื่อคืนผมไม่ได้ดูทีวี</div><div class="rom">mêua keun pŏm mâi dâai doo tee-wee</div><div class="en">I didn't watch TV last night.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">เมื่อวานผมไม่ได้อยู่บ้าน</div><div class="rom">mêua waan pŏm mâi dâai yòo bâan</div><div class="en">I wasn't at home yesterday.</div></div>
      <div class="player" data-src="lesson_8_09.mp3" data-title="Listen and repeat - ไม่ได้ mâi dâai" style="margin-top:1rem"></div>
    </div>
    <div class="listen-block listen-block--conversation listen-block--art" style="margin-top:1.4rem">
      <div>
        <p class="hw-brief"><strong>Your turn:</strong> translate what the woman is saying into English.</p>
        <div class="player" data-src="lesson_8_10.mp3" data-title="What is she saying?"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-answer-10">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l8-answer-10" hidden><div class="line"><div class="th">วันนี้ฉันไม่ได้ไปทำงาน</div><div class="rom">wan-née chăn mâi dâai bpai tam ngaan</div><div class="en">Today I didn't go to work.</div></div></div></div>
      </div>
      <figure class="listen-figure"><img class="conversation-art conversation-art--portrait" src="lesson_8_02.jpg" alt="A woman on the phone at home" loading="lazy" onerror="lessonImgFail(this)"></figure>
    </div>
    <div class="part-head" style="margin-top:1.8rem"><h3>Your turn</h3><p>Build each sentence, then reveal the answer. The examples use a male speaker's <span class="th-inline">ผม</span> <span class="rom-inline">pŏm</span>; women use <span class="th-inline">ฉัน</span> <span class="rom-inline">chăn</span>.</p></div>
    <div class="homework-listen-grid">
      <div class="homework-listen-card"><div class="question-number">Say it in Thai</div><p class="hw-brief" style="margin-bottom:0.6rem">I didn't go to work yesterday.</p><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-p5-a">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l8-p5-a" hidden><div class="line"><div class="th">เมื่อวานผมไม่ได้ไปทำงาน</div><div class="rom">mêua waan pŏm mâi dâai bpai tam ngaan</div><div class="en">I didn't go to work yesterday.</div></div></div></div></div>
      <div class="homework-listen-card"><div class="question-number">Say it in Thai</div><p class="hw-brief" style="margin-bottom:0.6rem">I didn't study Thai yesterday.</p><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-p5-b">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l8-p5-b" hidden><div class="line"><div class="th">เมื่อวานผมไม่ได้เรียนภาษาไทย</div><div class="rom">mêua waan pŏm mâi dâai rian paa-săa thai</div><div class="en">I didn't study Thai yesterday.</div></div></div></div></div>
      <div class="homework-listen-card"><div class="question-number">Say it in Thai</div><p class="hw-brief" style="margin-bottom:0.6rem">I didn't eat last night. (use <span class="th-inline">กินข้าว</span> <span class="rom-inline">gin kâao</span>)</p><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-p5-c">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l8-p5-c" hidden><div class="line"><div class="th">เมื่อคืนผมไม่ได้กินข้าว</div><div class="rom">mêua keun pŏm mâi dâai gin kâao</div><div class="en">I didn't eat last night.</div></div></div></div></div>
    </div>
    <div class="listen-block listen-block--pair" style="margin-top:1.8rem">
      <div>
        <p class="hw-brief"><strong>Listen first:</strong> Mali asks David about his day off. Notice how short a natural answer can be.</p>
        <div class="player" data-src="lesson_8_11.mp3" data-title="Mali and David - did you go to work?"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-dialogue-11">Show the transcript <span class="chev">▾</span></button><div class="reveal-body" id="l8-dialogue-11" hidden><div class="dialogue">
          <div class="turn"><div class="turn-who">Mali</div><div class="turn-lines"><div class="line"><div class="th">เมื่อวานไปทำงานไหมคะ</div><div class="rom">mêua waan bpai tam ngaan măi ká</div><div class="en">Did you go to work yesterday?</div></div></div></div>
          <div class="turn"><div class="turn-who">David</div><div class="turn-lines"><div class="line"><div class="th">ไม่ได้ไปครับ</div><div class="rom">mâi dâai bpai kráp</div><div class="en">No, I didn't.</div></div></div></div>
        </div><div class="reveal-note">To answer a <span class="th-inline">ไหม</span> <span class="rom-inline">măi</span> question in the past, repeat the main verb after <span class="th-inline">ไม่ได้ mâi dâai</span>: <span class="rom-inline">mâi dâai bpai</span> - "didn't go".</div></div></div>
      </div>
      <figure class="listen-figure listen-figure--pair"><div class="fig-one"><img src="mali.png" alt="Mali" loading="lazy" onerror="lessonImgFail(this)"><span class="fig-name">Mali</span></div><div class="fig-one"><img src="david.png" alt="David" loading="lazy" onerror="lessonImgFail(this)"><span class="fig-name">David</span></div></figure>
    </div>
  </section>

  <!-- ===================== PART 6 ===================== -->
  <section class="part" id="part-6">
    <div class="part-head"><div class="part-eyebrow">Part 06</div><h2>นี่ <span class="rom-inline">nêe</span>, นั่น <span class="rom-inline">nân</span> and คือ <span class="rom-inline">keu</span></h2><p>Two pointing words, and the second "to be" verb. Think of <span class="th-inline">คือ</span> <span class="rom-inline">keu</span> as an equals sign: it says that one thing <em>is</em> another thing.</p></div>
    <div class="answer-grid two">
      <div class="answer-card"><div class="th">นี่</div><div class="rom">nêe</div><div class="en">this; these <strong>(close to you)</strong></div></div>
      <div class="answer-card"><div class="th">นั่น</div><div class="rom">nân</div><div class="en">that; those <strong>(further away)</strong></div></div>
    </div>
    <div class="phrase-card" style="margin-top:1rem">
      <div class="speaker-tag">X คือ Y - "X is Y"</div>
      <div class="line"><div class="th">นี่คือแอปเปิ้ล</div><div class="rom">nêe keu àep-bpên</div><div class="en">This is an apple.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">นั่นคือยูเอฟโอ</div><div class="rom">nân keu yoo-ef-oh</div><div class="en">That is a UFO. <strong>(it's far away, so นั่น nân)</strong></div></div>
      <div class="line" style="margin-top:1rem"><div class="th">นี่คือหมู</div><div class="rom">nêe keu mŏo</div><div class="en">This is pork.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">นั่นคือหมา</div><div class="rom">nân keu măa</div><div class="en">That is a dog.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">มันคือน้ำ</div><div class="rom">man keu náam</div><div class="en">It is water.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">มันคือผลไม้</div><div class="rom">man keu pŏn-lá-mái</div><div class="en">It is a fruit.</div></div>
      <div class="player" data-src="lesson_8_12.mp3" data-title="Listen and repeat - นี่ / นั่น / มัน คือ" style="margin-top:1rem"></div>
    </div>
    <div class="part-head" style="margin-top:1.8rem"><h3>Getting around</h3><p>Three vehicles you'll point at constantly.</p></div>
    <div class="answer-grid">
      <div class="answer-card"><div class="th">รถยนต์</div><div class="rom">rót yon</div><div class="en">car</div></div>
      <div class="answer-card"><div class="th">รถมอเตอร์ไซค์</div><div class="rom">rót motorsai</div><div class="en">motorbike</div></div>
      <div class="answer-card"><div class="th">รถตุ๊กๆ</div><div class="rom">rót túk túk</div><div class="en">tuk tuk</div></div>
    </div>
    <p class="hw-brief" style="margin-top:1rem">In everyday speech the <span class="th-inline">ยนต์</span> <span class="rom-inline">yon</span> gets dropped and people just say <span class="th-inline">รถ</span> <span class="rom-inline">rót</span>, which simply means "vehicle".</p>
    <div class="tip no-figure"><div><div class="tip-label">คือ keu often disappears</div><p>When the meaning is obvious, Thai people leave <span class="th-inline">คือ</span> out altogether - <span class="th-inline">นี่รถยนต์</span> <span class="rom-inline">nêe rót yon</span> ("This is a car") and <span class="th-inline">นั่นรถยนต์</span> <span class="rom-inline">nân rót yon</span> ("That is a car") both sound completely natural.</p><p class="tip-line">But with <span class="th-inline">มัน</span> <span class="rom-inline">man</span> ("it") as the subject, keep it: <span class="th-inline">มันคือรถยนต์</span> <span class="rom-inline">man keu rót yon</span>. Unlike <span class="th-inline">นี่</span> and <span class="th-inline">นั่น</span>, <span class="th-inline">มัน</span> can't stand straight in front of a noun on its own.</p></div></div>
    <div class="part-head" style="margin-top:1.8rem"><h3>"What is this?"</h3><p>Thailand is full of unfamiliar fruits and dishes, so get these ready - you'll use them more than you expect.</p></div>
    <div class="phrase-card">
      <div class="line"><div class="th">นี่คืออะไร</div><div class="rom">nêe keu à-rai</div><div class="en">What is this?</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">นั่นคืออะไร</div><div class="rom">nân keu à-rai</div><div class="en">What is that?</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">มันคืออะไร</div><div class="rom">man keu à-rai</div><div class="en">What is it?</div></div>
      <div class="player" data-src="lesson_8_13.mp3" data-title="Listen and repeat - what is this?" style="margin-top:1rem"></div>
    </div>
    <div class="listen-block listen-block--conversation" style="margin-top:1.4rem">
      <div>
        <p class="hw-brief"><strong>Listen first:</strong> a tourist meets Thailand's most notorious fruit. New word: <span class="th-inline">ทุเรียน</span> <span class="rom-inline">túrian</span> (durian).</p>
        <div class="player" data-src="lesson_8_14.mp3" data-title="At the fruit stall - what is this?"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-dialogue-14">Show the transcript <span class="chev">▾</span></button><div class="reveal-body" id="l8-dialogue-14" hidden><div class="dialogue">
          <div class="turn"><div class="turn-who">Tourist</div><div class="turn-lines"><div class="line"><div class="th">นี่คืออะไรครับ</div><div class="rom">nêe keu à-rai kráp</div><div class="en">What is this?</div></div></div></div>
          <div class="turn"><div class="turn-who">Vendor</div><div class="turn-lines"><div class="line"><div class="th">นี่คือทุเรียนค่ะ</div><div class="rom">nêe keu túrian kâ</div><div class="en">This is durian.</div></div></div></div>
          <div class="turn"><div class="turn-who">Tourist</div><div class="turn-lines"><div class="line"><div class="th">มันคือผลไม้ใช่ไหม</div><div class="rom">man keu pŏn-lá-mái châi măi</div><div class="en">It's a fruit, right?</div></div></div></div>
          <div class="turn"><div class="turn-who">Vendor</div><div class="turn-lines"><div class="line"><div class="th">ใช่ มันคือผลไม้</div><div class="rom">châi · man keu pŏn-lá-mái</div><div class="en">Yes, it's a fruit.</div></div></div></div>
        </div></div></div>
      </div>
      <figure class="listen-figure"><img class="conversation-art" src="lesson_8_03.jpg" alt="A durian stall" loading="lazy" onerror="lessonImgFail(this)"></figure>
    </div>
  </section>
  <!-- ===================== PART 7 ===================== -->
  <section class="part" id="part-7">
    <div class="part-head"><div class="part-eyebrow">Part 07</div><h2>"Or" and "is not"</h2><p>One new linking word, and the one negative that breaks the usual rule.</p></div>
    <div class="phrase-card">
      <div class="speaker-tag">หรือ <span class="rom-inline">rĕu</span> - or</div>
      <p class="hw-brief">You already have <span class="th-inline">และ</span> <span class="rom-inline">láe</span> (and) and <span class="th-inline">แต่</span> <span class="rom-inline">dtàe</span> (but). Here's the third member of the family.</p>
      <div class="line"><div class="th">ผมจะกินอาหารไทยหรืออาหารอิตาเลี่ยน</div><div class="rom">pŏm jà gin aa-hăan thai rĕu aa-hăan ì-dtaa-lîan</div><div class="en">I will eat Thai food <strong>or</strong> Italian food.</div></div>
    </div>
    <div class="listen-block listen-block--conversation listen-block--art" style="margin-top:1.4rem">
      <div>
        <p class="hw-brief"><strong>Listen first:</strong> a quick exchange at a food stall - chicken or pork?</p>
        <div class="player" data-src="lesson_8_15.mp3" data-title="At the food stall - chicken or pork?"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-dialogue-15">Show the transcript <span class="chev">▾</span></button><div class="reveal-body" id="l8-dialogue-15" hidden><div class="dialogue">
          <div class="turn"><div class="turn-who">Customer</div><div class="turn-lines"><div class="line"><div class="th">ขอโทษครับ นี่คือไก่หรือหมู</div><div class="rom">kŏr tôht kráp · nêe keu gài rĕu mŏo</div><div class="en">Excuse me. Is this chicken or pork?</div></div></div></div>
          <div class="turn"><div class="turn-who">Vendor</div><div class="turn-lines"><div class="line"><div class="th">นี่คือหมูค่ะ</div><div class="rom">nêe keu mŏo kâ</div><div class="en">This is pork.</div></div></div></div>
          <div class="turn"><div class="turn-who">Customer</div><div class="turn-lines"><div class="line"><div class="th">ขอบคุณครับ</div><div class="rom">kòp kun kráp</div><div class="en">Thank you.</div></div></div></div>
        </div></div></div>
      </div>
      <figure class="listen-figure"><img class="conversation-art conversation-art--wide" src="lesson_8_06.jpg" alt="A food stall" loading="lazy" onerror="lessonImgFail(this)"></figure>
    </div>
    <div class="part-head" style="margin-top:1.8rem"><h3>"Is not" - ไม่ใช่ <span class="rom-inline">mâi châi</span></h3><p>Normally you make a negative by putting <span class="th-inline">ไม่</span> <span class="rom-inline">mâi</span> in front of the verb. <span class="th-inline">คือ</span> <span class="rom-inline">keu</span> is the exception.</p></div>
    <div class="phrase-card question-transform">
      <div class="transform-example line"><div class="th">ไม่คือ</div><div class="rom">mâi keu</div><div class="en">✗ Never used in Thai.</div></div>
      <div class="transform-arrow" aria-label="Use mâi châi instead"><span class="transform-arrow-symbol" aria-hidden="true">→</span><strong>Use instead</strong></div>
      <div class="transform-example line"><div class="th">ไม่ใช่</div><div class="rom">mâi châi</div><div class="en">✓ is not</div></div>
    </div>
    <p class="hw-brief" style="margin-top:1rem">You've met <span class="th-inline">ไม่ใช่</span> before: it's the same phrase you use to answer "no" to a <span class="th-inline">ใช่ไหม</span> <span class="rom-inline">châi măi</span> confirmation question, back in Lesson 6.</p>
    <div class="part-head" style="margin-top:1.8rem"><h3>Your turn</h3><p>Turn each sentence into its negative form, then reveal the answer.</p></div>
    <div class="homework-listen-grid">
      <div class="homework-listen-card"><div class="question-number">Make it negative</div><div class="line" style="margin-bottom:0.7rem"><div class="th">นี่คือหมู</div><div class="rom">nêe keu mŏo</div><div class="en">This is pork.</div></div><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-p7-a">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l8-p7-a" hidden><div class="line"><div class="th">นี่ไม่ใช่หมู</div><div class="rom">nêe mâi châi mŏo</div><div class="en">This is not pork.</div></div></div></div></div>
      <div class="homework-listen-card"><div class="question-number">Make it negative</div><div class="line" style="margin-bottom:0.7rem"><div class="th">นี่คือน้ำ</div><div class="rom">nêe keu náam</div><div class="en">This is water.</div></div><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-p7-b">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l8-p7-b" hidden><div class="line"><div class="th">นี่ไม่ใช่น้ำ</div><div class="rom">nêe mâi châi náam</div><div class="en">This is not water.</div></div></div></div></div>
      <div class="homework-listen-card"><div class="question-number">Make it negative</div><div class="line" style="margin-bottom:0.7rem"><div class="th">นั่นคือหนังสือ</div><div class="rom">nân keu năng-sĕu</div><div class="en">That's a book.</div></div><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-p7-c">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l8-p7-c" hidden><div class="line"><div class="th">นั่นไม่ใช่หนังสือ</div><div class="rom">nân mâi châi năng-sĕu</div><div class="en">That's not a book.</div></div></div></div></div>
      <div class="homework-listen-card"><div class="question-number">Make it negative</div><div class="line" style="margin-bottom:0.7rem"><div class="th">มันคือแมว</div><div class="rom">man keu maew</div><div class="en">It's a cat.</div></div><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-p7-d">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l8-p7-d" hidden><div class="line"><div class="th">มันไม่ใช่แมว</div><div class="rom">man mâi châi maew</div><div class="en">It's not a cat.</div></div></div></div></div>
    </div>
    <div class="player" data-src="lesson_8_16.mp3" data-title="Listen and repeat - the four negatives" style="margin-top:1rem"></div>
    <div class="phrase-card" style="margin-top:1.4rem">
      <div class="speaker-tag">Correcting someone</div>
      <div class="line"><div class="th">นั่นไม่ใช่แท็กซี่</div><div class="rom">nân mâi châi táek-sêe</div><div class="en">That's not a taxi.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">มันไม่ใช่หมู มันคือเนื้อวัว</div><div class="rom">man mâi châi mŏo · man keu néua wuua</div><div class="en">It's not pork, it's beef.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">นี่ไม่ใช่ผลไม้ นี่คือผัก</div><div class="rom">nêe mâi châi pŏn-lá-mái · nêe keu pàk</div><div class="en">This is not a fruit. This is a vegetable.</div></div>
      <div class="player" data-src="lesson_8_17.mp3" data-title="Listen and repeat - no, it's actually…" style="margin-top:1rem"></div>
    </div>
    <div class="listen-block listen-block--pair" style="margin-top:1.8rem">
      <div>
        <p class="hw-brief"><strong>Listen first:</strong> Achara points something out and gets it wrong. Remember <span class="th-inline">จริงเหรอ</span> <span class="rom-inline">jing rŏr</span> ("Really?!") from Lesson 7?</p>
        <div class="player" data-src="lesson_8_18.mp3" data-title="Achara and Somchai - that's a cat, right?"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-dialogue-18">Show the transcript <span class="chev">▾</span></button><div class="reveal-body" id="l8-dialogue-18" hidden><div class="dialogue">
          <div class="turn"><div class="turn-who">Achara</div><div class="turn-lines"><div class="line"><div class="th">นั่นคือแมวใช่ไหม</div><div class="rom">nân keu maew châi măi</div><div class="en">That's a cat, right?</div></div></div></div>
          <div class="turn"><div class="turn-who">Somchai</div><div class="turn-lines"><div class="line"><div class="th">ไม่ใช่ นั่นคือหมา</div><div class="rom">mâi châi · nân keu măa</div><div class="en">No, it's not. That's a dog.</div></div></div></div>
          <div class="turn"><div class="turn-who">Achara</div><div class="turn-lines"><div class="line"><div class="th">จริงเหรอ</div><div class="rom">jing rŏr</div><div class="en">Really?!</div></div></div></div>
          <div class="turn"><div class="turn-who">Somchai</div><div class="turn-lines"><div class="line"><div class="th">จริง ๆ</div><div class="rom">jing jing</div><div class="en">Really.</div></div></div></div>
        </div><div class="reveal-note">You can also drop <span class="th-inline">คือ keu</span> and just say <span class="th-inline">นั่น</span> <span class="rom-inline">nân + noun.</span></div></div></div>

    </div>
  </section>

  <!-- ===================== PART 8 ===================== -->
  <section class="part" id="part-8">
    <div class="part-head"><div class="part-eyebrow">Part 08</div><h2>Example conversations</h2><p>Two recordings of Thai as it's actually spoken. They sound looser than the textbook sentences above - that's the point. Listen a few times before you open the transcripts.</p></div>
    <div class="listen-block no-figure">
      <div>
        <p class="hw-brief"><strong>Listen first:</strong> a customer works out what's on offer at a market stall.</p>
        <div class="player" data-src="lesson_8_19.mp3" data-title="At the market - beef, chicken or fish?"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-dialogue-19">Show the transcript <span class="chev">▾</span></button><div class="reveal-body" id="l8-dialogue-19" hidden><div class="dialogue">
          <div class="turn"><div class="turn-who">Customer</div><div class="turn-lines"><div class="line"><div class="th">นี่คือเนื้อวัวใช่มั้ยครับ</div><div class="rom">nêe keu néua wuua châi mái kráp</div><div class="en">This is beef, right?</div></div></div></div>
          <div class="turn"><div class="turn-who">Vendor</div><div class="turn-lines"><div class="line"><div class="th">ไม่ใช่ นี่ไก่ค่ะ</div><div class="rom">mâi châi · nêe gài kâ</div><div class="en">No, it's not. This is chicken.</div></div></div></div>
          <div class="turn"><div class="turn-who">Customer</div><div class="turn-lines"><div class="line"><div class="th">แล้วนั่นคืออะไรครับ</div><div class="rom">láew nân keu à-rai kráp</div><div class="en">And what is that? (pointing at another dish)</div></div></div></div>
          <div class="turn"><div class="turn-who">Vendor</div><div class="turn-lines"><div class="line"><div class="th">นั่นปลาค่ะ</div><div class="rom">nân bplaa kâ</div><div class="en">That's fish.</div></div></div></div>
        </div><div class="reveal-note">Both of the vendor's answers drop <span class="th-inline">คือ</span> - <span class="rom-inline">nêe gài</span>, <span class="rom-inline">nân bplaa</span>. Perfectly normal, and something you'll hear constantly.</div></div></div>
      </div>
    </div>
    <div class="listen-block listen-block--conversation" style="margin-top:1.8rem">
      <div>
        <p class="hw-brief"><strong>Listen first:</strong> a couple chatting over lunch, keeping it very casual. This one is faster and less polished - don't worry if you only catch pieces the first time.</p>
        <div class="player" data-src="lesson_8_20.mp3" data-title="Over lunch - what are you eating?"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-dialogue-20">Show the transcript <span class="chev">▾</span></button><div class="reveal-body" id="l8-dialogue-20" hidden><div class="dialogue">
          <div class="turn"><div class="turn-who">She</div><div class="turn-lines"><div class="line"><div class="th">นั่นอะไรอะ</div><div class="rom">nân à-rai à</div><div class="en">What's that?</div></div><div class="line"><div class="th">นั่นไก่ใช่ไหม</div><div class="rom">nân gài châi măi</div><div class="en">That's chicken, right?</div></div></div></div>
          <div class="turn"><div class="turn-who">He</div><div class="turn-lines"><div class="line"><div class="th">อะไรนะ</div><div class="rom">à-rai ná</div><div class="en">Pardon?</div></div></div></div>
          <div class="turn"><div class="turn-who">She</div><div class="turn-lines"><div class="line"><div class="th">กินอะไรอะ</div><div class="rom">gin à-rai à</div><div class="en">What are you eating?</div></div><div class="line"><div class="th">ไก่ใช่ไหม</div><div class="rom">gài châi măi</div><div class="en">Chicken, right?</div></div></div></div>
          <div class="turn"><div class="turn-who">He</div><div class="turn-lines"><div class="line"><div class="th">ไม่ใช่ มันคือหมู</div><div class="rom">mâi châi · man keu mŏo</div><div class="en">No, it's not. It's pork.</div></div></div></div>
        </div></div></div>
      </div>
      <figure class="listen-figure"><img class="conversation-art" src="lesson_8_04.jpg" alt="A casual lunch" loading="lazy" onerror="lessonImgFail(this)"></figure>
    </div>
    <div class="tip no-figure"><div><div class="tip-label">What to listen for</div><p><strong>1. อะ à</strong> - an ending particle that makes a sentence sound relaxed and informal.<br><strong>2. นะ ná</strong> - softens a statement, question or request. Extremely common.<br><strong>3. R sounds like L</strong> - <span class="th-inline">อะไร</span> <span class="rom-inline">à-rai</span> comes out closer to <span class="rom-inline">à-lai</span>. Very typical of casual speech.<br><strong>4. No pronouns</strong> - <span class="th-inline">คุณ</span> <span class="rom-inline">kun</span> and the rest are simply left out.<br><strong>5. No คือ keu</strong> - dropped everywhere except the final line.</p><p class="tip-note">You'll also see <span class="th-inline">ใช่มั้ย</span> <span class="rom-inline">châi mái</span> written instead of <span class="th-inline">ใช่ไหม</span> <span class="rom-inline">châi măi</span>. Same question, just spelled the way people actually say it. Now play the recording once more and see how many of these five you can spot.</p></div></div>
  </section>

  <!-- ===================== PART 9 ===================== -->
  <section class="part" id="part-9">
    <div class="part-head"><div class="part-eyebrow">Part 09</div><h2>เป็น <span class="rom-inline">bpen</span> - jobs and nationalities</h2><p>The third and last "to be" verb. Where <span class="th-inline">คือ</span> <span class="rom-inline">keu</span> is an equals sign, <span class="th-inline">เป็น</span> <span class="rom-inline">bpen</span> <em>describes</em> someone: what they do, where they're from, what they are.</p></div>
    <div class="phrase-card">
      <div class="speaker-tag">The formula</div>
      <div class="line"><div class="th">ผม / ฉัน เป็น <span class="template-slot">your job</span></div><div class="rom">pŏm / chăn bpen …</div><div class="en">I am a / an …</div></div>
    </div>
    <div class="listen-block" style="margin-top:1.4rem">
      <div>
        <p class="hw-brief"><strong>Your awesome Thai teacher could say:</strong></p>
        <div class="line" style="margin-bottom:0.9rem"><div class="th">ฉันเป็นครู</div><div class="rom">chăn bpen kroo</div><div class="en">I am a teacher.</div></div>
        <div class="player" data-src="lesson_8_21.mp3" data-title="ฉันเป็นครู - I am a teacher"></div>
      </div>
      <figure class="listen-figure"><img src="kroo.png" alt="A Thai teacher" loading="lazy" onerror="lessonImgFail(this)"></figure>
    </div>
    <div class="phrase-card" style="margin-top:1.4rem">
      <div class="speaker-tag">Asking about someone's job</div>
      <div class="line"><div class="th">คุณทำงานอะไร</div><div class="rom">kun tam ngaan à-rai</div><div class="en">What do you do for work?</div></div>
      <p class="hw-brief" style="margin-top:0.9rem">A reminder of the pieces: <span class="th-inline">ทำงาน</span> <span class="rom-inline">tam ngaan</span> (to work) plus <span class="th-inline">อะไร</span> <span class="rom-inline">à-rai</span> (what?).</p>
    </div>
    <div class="listen-block listen-block--conversation listen-block--art" style="margin-top:1.4rem">
      <div>
        <p class="hw-brief"><strong>Listen first:</strong> two strangers swap jobs. New words: <span class="th-inline">นักธุรกิจ</span> <span class="rom-inline">nák tú-rá gìt</span> (businessman) and <span class="th-inline">พนักงานออฟฟิศ</span> <span class="rom-inline">pá-nák ngaan office</span> (office worker).</p>
        <div class="player" data-src="lesson_8_22.mp3" data-title="What do you do for work?"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-dialogue-22">Show the transcript <span class="chev">▾</span></button><div class="reveal-body" id="l8-dialogue-22" hidden><div class="dialogue">
          <div class="turn"><div class="turn-who">She</div><div class="turn-lines"><div class="line"><div class="th">คุณทำงานอะไรคะ</div><div class="rom">kun tam ngaan à-rai ká</div><div class="en">What do you do for work?</div></div></div></div>
          <div class="turn"><div class="turn-who">He</div><div class="turn-lines"><div class="line"><div class="th">ผมเป็นนักธุรกิจครับ แล้วคุณล่ะครับ</div><div class="rom">pŏm bpen nák tú-rá gìt kráp · láew kun lâ kráp</div><div class="en">I am a businessman. And you?</div></div></div></div>
          <div class="turn"><div class="turn-who">She</div><div class="turn-lines"><div class="line"><div class="th">ฉันเป็นพนักงานออฟฟิศค่ะ</div><div class="rom">chăn bpen pá-nák ngaan office kâ</div><div class="en">I am an office worker.</div></div></div></div>
        </div></div></div>
      </div>
      <figure class="listen-figure"><img class="conversation-art conversation-art--landscape" src="lesson_8_07.jpg" alt="An office worker at her desk" loading="lazy" onerror="lessonImgFail(this)"></figure>
    </div>
    <div class="listen-block listen-block--pair" style="margin-top:1.8rem">
      <div>
        <p class="hw-brief"><strong>Listen first:</strong> Mali and David do the same. You'll hear <span class="th-inline">ผู้จัดการ</span> <span class="rom-inline">pôo-jàt-gaan</span> (manager).</p>
        <div class="player" data-src="lesson_8_23.mp3" data-title="Mali and David - programmer and manager"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-dialogue-23">Show the transcript <span class="chev">▾</span></button><div class="reveal-body" id="l8-dialogue-23" hidden><div class="dialogue">
          <div class="turn"><div class="turn-who">Mali</div><div class="turn-lines"><div class="line"><div class="th">ทำงานอะไรคะ</div><div class="rom">tam ngaan à-rai ká</div><div class="en">What do you do for work?</div></div></div></div>
          <div class="turn"><div class="turn-who">David</div><div class="turn-lines"><div class="line"><div class="th">ผมเป็นโปรแกรมเมอร์ แล้วคุณล่ะครับ</div><div class="rom">pŏm bpen bproh-graem-mêr · láew kun lâ kráp</div><div class="en">I'm a programmer. And you?</div></div></div></div>
          <div class="turn"><div class="turn-who">Mali</div><div class="turn-lines"><div class="line"><div class="th">ฉันเป็นผู้จัดการที่โรงแรม</div><div class="rom">chăn bpen pôo-jàt-gaan têe rohng raem</div><div class="en">I'm a manager at a hotel.</div></div></div></div>
        </div><div class="reveal-note">Mali adds <span class="th-inline">ที่โรงแรม</span> <span class="rom-inline">têe rohng raem</span> - "at a hotel". The same <span class="th-inline">ที่</span> <span class="rom-inline">têe</span> (at) from Part 1.</div></div></div>
      </div>
      <figure class="listen-figure listen-figure--pair"><div class="fig-one"><img src="mali.png" alt="Mali" loading="lazy" onerror="lessonImgFail(this)"><span class="fig-name">Mali</span></div><div class="fig-one"><img src="david.png" alt="David" loading="lazy" onerror="lessonImgFail(this)"><span class="fig-name">David</span></div></figure>
    </div>
    <div class="part-head" style="margin-top:1.8rem"><h3>Nationalities</h3><p>Same verb, one extra word: <span class="th-inline">คน</span> <span class="rom-inline">kon</span> means "person", so you're literally saying "I am an America person".</p></div>
    <div class="phrase-card">
      <div class="line"><div class="th">ผม / ฉัน เป็นคน <span class="template-slot">your country</span></div><div class="rom">pŏm / chăn bpen kon …</div><div class="en">I am …</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">ผมเป็นคนอเมริกา</div><div class="rom">pŏm bpen kon America (à-may-rí-gaa)</div><div class="en">I am American. (male)</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">ฉันเป็นคนออสเตรเลีย</div><div class="rom">chăn bpen kon Australia (òt-dtray-liia)</div><div class="en">I am Australian. (female)</div></div>
      <div class="player" data-src="lesson_8_24.mp3" data-title="Listen and repeat - เป็นคน bpen kon + country" style="margin-top:1rem"></div>
    </div>
    <div class="tip no-figure"><div><div class="tip-label">Two ways to say where you're from</div><p>Both are correct and both are common - use whichever comes out first.</p><div class="line tip-line"><div class="th">ผมมาจากอเมริกา</div><div class="rom">pŏm maa jàak à-may-rí-gaa</div><div class="en">I am from America. (Lesson 2)</div></div><div class="line" style="margin-bottom:0.9rem"><div class="th">ผมเป็นคนอเมริกา</div><div class="rom">pŏm bpen kon à-may-rí-gaa</div><div class="en">I am American.</div></div><p class="tip-note">English uses two different words - France and French, Italy and Italian. Thai just uses one for both: <span class="th-inline">ฝรั่งเศส</span> <span class="rom-inline">fà-ràng-sèt</span> covers France <em>and</em> French, and the sentence tells you which. So <span class="th-inline">ผมมาจากฝรั่งเศส</span> is "I'm from France" and <span class="th-inline">ผมเป็นคนฝรั่งเศส</span> is "I'm French".</p></div></div>
    <div class="listen-block" style="margin-top:1.4rem">
      <div>
        <p class="hw-brief"><strong>Putting it together:</strong> meet Peter - 46, from the UK, a teacher. Everything he says here you already know.</p>
        <div class="player" data-src="lesson_8_25.mp3" data-title="Peter introduces himself"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l8-intro-25">Show the introduction <span class="chev">▾</span></button><div class="reveal-body" id="l8-intro-25" hidden><div class="dialogue">
          <div class="turn"><div class="turn-who">1</div><div class="turn-lines"><div class="line"><div class="th">สวัสดีครับ</div><div class="rom">sà-wàt-dee kráp</div><div class="en">Hello.</div></div></div></div>
          <div class="turn"><div class="turn-who">2</div><div class="turn-lines"><div class="line"><div class="th">ผมชื่อปีเตอร์ครับ</div><div class="rom">pŏm chêu Peter kráp</div><div class="en">My name is Peter.</div></div></div></div>
          <div class="turn"><div class="turn-who">3</div><div class="turn-lines"><div class="line"><div class="th">ผมเป็นคนอังกฤษ</div><div class="rom">pŏm bpen kon ang-grìt</div><div class="en">I'm British.</div></div></div></div>
          <div class="turn"><div class="turn-who">4</div><div class="turn-lines"><div class="line"><div class="th">ผมอายุสี่สิบหกปี</div><div class="rom">pŏm aa-yú sèe-sìp-hòk bpee</div><div class="en">I'm 46 years old.</div></div></div></div>
          <div class="turn"><div class="turn-who">5</div><div class="turn-lines"><div class="line"><div class="th">ผมเป็นครู</div><div class="rom">pŏm bpen kroo</div><div class="en">I'm a teacher.</div></div></div></div>
        </div><div class="reveal-note">Try the same five lines about yourself. That's a complete self-introduction in Thai.</div></div></div>
      </div>
      <figure class="listen-figure"><img src="man.png" alt="Peter" loading="lazy" onerror="lessonImgFail(this)"></figure>
    </div>
    <div class="part-head" style="margin-top:1.8rem"><h3>Negatives with เป็น bpen</h3><p>Good news - it's the same as <span class="th-inline">คือ</span> <span class="rom-inline">keu</span>. Both use <span class="th-inline">ไม่ใช่</span> <span class="rom-inline">mâi châi</span>.</p></div>
    <div class="phrase-card">
      <div class="line"><div class="th">ผมเป็นครู</div><div class="rom">pŏm bpen kroo</div><div class="en">I am a teacher.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">ผมไม่ใช่ครู</div><div class="rom">pŏm mâi châi kroo</div><div class="en">I am not a teacher.</div></div>

        '<div class="player-title">' + esc(title) +

  /* ==== SEGMENTATION (pure functions — no DOM, no audio context) ====

     These three functions are the whole "understand the recording"
     layer, and they are deliberately free of any browser object so
     they can be tested against a decoded file outside the page.

     THE IDEA

     A listen-and-repeat track has exactly two kinds of silence in
     it: the tiny breaks inside a phrase (breaths, the stop before
     a hard consonant — measured at 0.02–0.26 s on lesson 4) and
     the deliberate pauses the student repeats into (2.3–4.9 s on
     the same file). Those two populations are separated by a huge
     margin, so instead of guessing a fixed threshold — which is
     what the first version did, and what needed hand-tuning per
     file — we measure every silence in the recording and let the
     recording itself tell us where the boundary lies.

     That is why nothing has to be configured per lesson. Add two
     more words, or point this at Lesson 3's shorter track, and the
     split lands in the same empty stretch of the histogram.
     ================================================================ */

  /* Loudness is measured in 20 ms windows. Speech is anything above
     a threshold read from the recording's own levels, so a quiet
     mic, a loud mic and a re-export at a different gain all behave
     the same. */
  function analyseSegments(d, sr) {
    var WIN = 0.02;
    var win = Math.max(1, Math.round(sr * WIN));
    var count = Math.floor(d.length / win);
    if (count < 8) return [];

    var rms = new Float32Array(count), i, j;
    for (i = 0; i < count; i++) {
      var sum = 0, base = i * win;
      for (j = 0; j < win; j++) { var v = d[base + j]; sum += v * v; }
      rms[i] = Math.sqrt(sum / win);
    }

    var sorted = Array.prototype.slice.call(rms).sort(function (a, b) { return a - b; });
    var floor = sorted[Math.floor(count * 0.10)] || 0;
    var loud  = sorted[Math.floor(count * 0.95)] || 0;
    if (loud <= floor) return [];
    var thr = Math.max(floor * 5, loud * 0.07, 1e-5);

    /* Raw runs first: every unbroken stretch above the threshold,
       breaths included. Nothing is merged at this stage. */
    var runs = [], start = -1;
    for (i = 0; i < count; i++) {
      if (rms[i] >= thr) { if (start < 0) start = i; }
      else if (start >= 0) { runs.push([start, i]); start = -1; }
    }
    if (start >= 0) runs.push([start, count]);
    if (!runs.length) return [];

    var gaps = [];
    for (i = 0; i < runs.length - 1; i++) gaps.push((runs[i + 1][0] - runs[i][1]) * WIN);
    var split = splitPoint(gaps);

    var merged = [], cur = runs[0];
    for (i = 1; i < runs.length; i++) {
      if ((runs[i][0] - cur[1]) * WIN < split) cur = [cur[0], runs[i][1]];
      else { merged.push(cur); cur = runs[i]; }
    }
    merged.push(cur);

    /* A "word" shorter than 120 ms is a click or a stray breath that
       happened to clear the threshold, not something to navigate to. */
    merged = merged.filter(function (p) { return (p[1] - p[0]) * WIN >= 0.12; });
    if (!merged.length) return [];

    /* Asymmetric padding: a little ahead of the onset so jumping to a
       word never clips its first consonant, more after it so the tail
       of a falling tone is not cut off. Padding is capped at half the
       neighbouring silence, so two items can never overlap however
       tightly they were recorded. */
    var dur = d.length / sr;
    var PAD_IN = 0.12, PAD_OUT = 0.20;
    return merged.map(function (p, k) {
      var s = p[0] * WIN, e = p[1] * WIN;
      var prevEnd   = k > 0 ? merged[k - 1][1] * WIN : 0;
      var nextStart = k < merged.length - 1 ? merged[k + 1][0] * WIN : dur;
      return {
        s: Math.max(0,   s - Math.min(PAD_IN,  (s - prevEnd)   / 2)),
        e: Math.min(dur, e + Math.min(PAD_OUT, (nextStart - e) / 2))
      };
    });
  }

  /* Given every silence length in the file, return the length that
     separates "pause between items" from "break inside an item".

     Sorted, the gaps of a listen-and-repeat track look like
        0.02 0.02 … 0.22 | 1.50 2.36 … 4.84
     so the answer is the biggest RATIO step in that sorted list,
     ignoring steps that land somewhere no real pause could be. The
     margin on lesson 4 is about 7×, and it stays above 6× across a
     14 dB swing in threshold, so this is not a close call. */
  function splitPoint(gaps) {
    if (!gaps.length) return Infinity;
    var s = gaps.slice().sort(function (a, b) { return a - b; });
    var best = 0, at = -1;
    for (var i = 0; i < s.length - 1; i++) {
      if (s[i + 1] < 0.5) continue;
      var r = (s[i + 1] + 0.01) / (s[i] + 0.01);
      if (r > best) { best = r; at = i; }
    }
    /* No clear step. Either every gap is a real pause (a track with
       no breaths in it), or none of them is (one continuous phrase). */
    if (at < 0 || best < 2.2) return s[0] >= 0.5 ? Math.max(0.3, s[0] * 0.8) : Infinity;
    return (s[at] + s[at + 1]) / 2;
  }

  /* Is the first phrase a spoken instruction rather than word 1?
     The signature is the pause that follows it: nobody repeats an
     instruction, so it is followed by a short breath (1.5 s on
     lesson 4) where every real word is followed by a full repeat
     pause (2.4 s and up). Both tests must pass — clearly shorter
     than the typical pause AND shorter than every other pause. */
  function detectLeadIn(items) {
    if (items.length < 4) return false;
    var gaps = [], i;
    for (i = 0; i < items.length - 1; i++) gaps.push(items[i + 1].s - items[i].e);
    var rest = gaps.slice(1).sort(function (a, b) { return a - b; });
    var med = rest[Math.floor(rest.length / 2)];
    return gaps[0] < med * 0.6 && gaps[0] < rest[0] * 0.9;
  }
  /* ==== END SEGMENTATION ==== */

  /* ==== SLOW PLAYBACK (pure function — no DOM, no audio context) ====

     WHY THIS EXISTS

     An <audio> element slows down without changing pitch: browsers
     time-stretch it internally (preservesPitch, on by default). The
     Web Audio path has no such thing. AudioBufferSourceNode's
     playbackRate is plain resampling — it plays the same samples more
     slowly, which drags the pitch down with it. At 0.75x that is a
     drop of a musical fourth, roughly five semitones, and it turns
     the speaker on these recordings into a man.

     That is bad for any language and worse for a tonal one, so slow
     playback is done properly instead: the audio is rebuilt at the
     new length from short overlapping grains, each one positioned to
     line up with the waveform already written. The period of the
     voice is never altered, so the pitch, and every tone contour that
     rides on it, comes through unchanged. Measured on lesson 1 the
     speaker's pitch moves by well under a semitone, against nearly
     five semitones for plain resampling.

     Cost is one pass over the recording, a few hundred milliseconds,
     done once and cached. The grain length and search window suit
     speech from about 70 Hz upward, which covers any voice likely to
     appear on these tracks. */
  function timeStretch(x, rate) {
    if (rate === 1) return x;

    var N = 1024;                       /* grain, ~23 ms                     */
    var HS = N >> 1;                    /* how far the output advances       */
    var HA = Math.round(HS * rate);     /* how far the input advances        */
    var SEARCH = 640;                   /* +/-14 ms: over a pitch period     */
    var CORR = 512;                     /* samples compared when aligning    */
    var D = 8;                          /* coarse pass runs decimated by 8   */

    var outLen = Math.ceil(x.length / rate) + N;
    var out = new Float32Array(outLen);
    var norm = new Float32Array(outLen);
    var win = new Float32Array(N), i, k;
    for (i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (N - 1));

    var dl = Math.ceil(x.length / D);
    var xd = new Float32Array(dl);
    for (i = 0; i < dl; i++) xd[i] = x[i * D];

    var ana = 0, outPos = 0, tmpl = 0;

    while (ana + N + SEARCH < x.length && outPos + N < outLen) {
      var d = 0;
      if (tmpl > 0) {
        var lo = Math.max(0, ana - SEARCH);
        var hi = Math.min(x.length - N, ana + SEARCH);
        var num, den, c, p;

        /* Coarse: where does the incoming grain best continue what was
           just written? Searched on a decimated copy so the whole
           window costs almost nothing. */
        var bestC = -Infinity, bestPos = ana;
        var td = (tmpl / D) | 0, cd = (CORR / D) | 0;
        for (p = lo; p <= hi; p += D) {
          var pd = (p / D) | 0;
          num = 0; den = 0;
          for (k = 0; k < cd; k++) {
            var A = xd[pd + k] || 0, B = xd[td + k] || 0;
            num += A * B; den += A * A;
          }
          c = num / Math.sqrt(den + 1e-9);
          if (c > bestC) { bestC = c; bestPos = p; }
        }

        /* Fine: full rate, only the few samples either side. */
        var bestF = -Infinity, bestFine = bestPos;
        var from2 = Math.max(lo, bestPos - D), to2 = Math.min(hi, bestPos + D);
        for (p = from2; p <= to2; p++) {
          num = 0; den = 0;
          for (k = 0; k < CORR; k++) {
            var A2 = x[p + k] || 0, B2 = x[tmpl + k] || 0;
            num += A2 * B2; den += A2 * A2;
          }
          c = num / Math.sqrt(den + 1e-9);
          if (c > bestF) { bestF = c; bestFine = p; }
        }
        d = bestFine - ana;
      }

      var from = ana + d;
      for (i = 0; i < N; i++) {
        var v = x[from + i];
        if (v === undefined) break;
        out[outPos + i] += v * win[i];
        norm[outPos + i] += win[i];
      }
      tmpl = from + HS;
      ana += HA;
      outPos += HS;
    }

    /* Dividing by the summed window keeps the level flat where grains
       overlap, so nothing pumps or dips at the seams. */
    var end = Math.min(outLen, outPos + N);
    for (i = 0; i < end; i++) if (norm[i] > 1e-6) out[i] /= norm[i];
    return out.subarray(0, Math.round(x.length / rate));
  }

      var best = 0, bs = 0, be = 0;

    /* ---- rebuild with a different pause length ----
       The instruction keeps its own short gap: the student is not
       repeating it, so stretching it to 10 s would just be dead air. */

      var keepWord = words.length ? Math.max(0, wordIndexNear(pos())) : -1;
      if (playing) stop(false);

        var out = nb.getChannelData(0);

         word number rather than by seconds. */

      if (loopIdx >= words.length) loopIdx = -1;

       Every AudioBufferSourceNode gets an onended handler that first
       checks whether it is still THE current source. Without that
       check a node discarded half a millisecond ago reports "I ended"
       after its replacement has already started, and the player stops
       itself and jumps to 0:00 — which is exactly what the ⏭ button
       used to do. Identity is checked per node; there is deliberately
       no shared "was this deliberate?" flag to get out of step. */
    /* Looping runs a little way past the end of the word — roughly
       180 ms, so the repeat lands after a short breath rather than
       snapping straight back onto the next consonant. The tail is
       capped at whatever silence actually follows the word, so it can
       never eat into the next one, and the last word on every one of
       these tracks has ~400 ms of trailing pause to spend. */

      if (!playing) return startOffset;

        try { s.onended = null; } catch (e) {}
