      try { audio.defaultPlaybackRate = audio.playbackRate; } catch (e) {}
    });

    replay.addEventListener('click', function () {
      unlock();
      stopOthers(api);
      if (!ready()) { wantPlay = true; prepare(); paintBtn(); return; }
      audio.currentTime = 0;
      start();
    });

    whenNear(el, prepare);
    paint();
    paintBtn();

  /* =========================================================
     AUDIO CACHE VERSION
     Appended to audio requests as ?v=… so a re-exported mp3
     reaches students instead of the copy already sitting in
     their browser cache.

     Every player on this page reads it, as on the Lesson 2, 4
     and 6 pages. Bump this string whenever you re-record or
     re-export a file.
     ========================================================= */
  var AUDIO_VERSION = '2';

  function audioUrl(src) {
    return src + (AUDIO_VERSION ? (src.indexOf('?') < 0 ? '?v=' : '&v=') + AUDIO_VERSION : '');
  }

  /* =========================================================
     WAVEFORM PLAYER — the long tracks: listen-and-repeat, and
     English → Thai pairs. Opt a player in with data-waveform="true".

     WHY THIS IS DIFFERENT FROM THE PLAYER ABOVE

     The listen-and-repeat tracks are long files made of short
     spoken words separated by deliberate pauses, and that shape
     asks for two things a plain progress bar cannot give.

     Students need to move around by WORD rather than by second,
     and they need to SEE where a pause starts and ends. The word
     boundaries are found automatically by measuring loudness
     across the file, so nothing has to be typed in by hand — a
     re-recorded track just works, and so does a different lesson.

     This player also decodes the whole file into memory with the
     Web Audio API and plays it from an AudioBufferSourceNode
     instead of streaming it through an <audio> element. Seeking
     is therefore sample-exact rather than estimated from the
     bitrate, and long quiet passages cannot be skipped by the
     browser's media pipeline.

     The file is downloaded when the player comes near the screen
     (see WHERE THE SOUND COMES FROM above), with the progress shown
     in the status line; ▶ pressed meanwhile starts by itself.

     Everything degrades safely. If the file cannot be downloaded
     here at all (a page opened straight from disk over file://)
     or cannot be decoded, the element quietly falls back to the
     simple player above and the student still gets working audio.
     A missing file says so; a dropped connection offers "Try again".

     SUPPORTED ATTRIBUTES

  /* Loudness is measured in 20 ms windows. Speech is anything above

    if (start >= 0) runs.push([start, count]);
    if (!runs.length) return [];

      else { merged.push(cur); cur = runs[i]; }

       happened to clear the threshold, not something to navigate to. */

    if (!merged.length) return [];

       word never clips its first consonant, more after it so the tail
       of a falling tone is not cut off. Padding is capped at half the
       neighbouring silence, so two items can never overlap however
       tightly they were recorded. */

        s: Math.max(0,   s - Math.min(PAD_IN,  (s - prevEnd)   / 2)),

     Sorted, the gaps of a listen-and-repeat track look like
        0.02 0.02 … 0.22 | 1.50 2.36 … 4.84
     so the answer is the biggest RATIO step in that sorted list,
     ignoring steps that land somewhere no real pause could be. The
     margin on lesson 4 is about 7×, and it stays above 6× across a
     14 dB swing in threshold, so this is not a close call. */

  /* ==== SLOW PLAYBACK (pure function — no DOM, no audio context) ====

     WHY THIS EXISTS

     An <audio> element slows down without changing pitch: browsers
     time-stretch it internally (preservesPitch, on by default). The
     Web Audio path has no such thing. AudioBufferSourceNode's
     playbackRate is plain resampling — it plays the same samples more
     slowly, which drags the pitch down with it. At 0.75x that is a
     drop of a musical fourth, roughly five semitones, and it turns
     the speaker on these recordings into a man.

     That is bad for any language and worse for a tonal one, so slow
     playback is done properly instead: the audio is rebuilt at the
     new length from short overlapping grains, each one positioned to
     line up with the waveform already written. The period of the
     voice is never altered, so the pitch, and every tone contour that
     rides on it, comes through unchanged. Measured on lesson 1 the
     speaker's pitch moves by well under a semitone, against nearly
     five semitones for plain resampling.

     done once and cached. The grain length and search window suit
     speech from about 70 Hz upward, which covers any voice likely to
     appear on these tracks. */

    var HS = N >> 1;                    /* how far the output advances       */
    var HA = Math.round(HS * rate);     /* how far the input advances        */
    var SEARCH = 640;                   /* +/-14 ms: over a pitch period     */
    var CORR = 512;                     /* samples compared when aligning    */
    var D = 8;                          /* coarse pass runs decimated by 8   */

    var outLen = Math.ceil(x.length / rate) + N;
    var out = new Float32Array(outLen);

    var win = new Float32Array(N), i, k;
    for (i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (N - 1));

    var dl = Math.ceil(x.length / D);
    var xd = new Float32Array(dl);
    for (i = 0; i < dl; i++) xd[i] = x[i * D];

        var hi = Math.min(x.length - N, ana + SEARCH);
        var num, den, c, p;

           just written? Searched on a decimated copy so the whole
           window costs almost nothing. */
        var bestC = -Infinity, bestPos = ana;
        var td = (tmpl / D) | 0, cd = (CORR / D) | 0;

          }
          c = num / Math.sqrt(den + 1e-9);

        }

        /* Fine: full rate, only the few samples either side. */
        var bestF = -Infinity, bestFine = bestPos;
        var from2 = Math.max(lo, bestPos - D), to2 = Math.min(hi, bestPos + D);
        for (p = from2; p <= to2; p++) {
          num = 0; den = 0;
          for (k = 0; k < CORR; k++) {
            var A2 = x[p + k] || 0, B2 = x[tmpl + k] || 0;

        else                                           lead = detectLeadIn(origItems) ? 1 : 0;
      }

      roomTone    = grabRoomTone(origBuffer, origItems);

      setSegments(origBuffer, origItems);

      /* Optional cross-check. It cannot change anything — it only
         speaks up if the recording no longer matches the markup. */
      var want = parseInt(el.getAttribute('data-words'), 10);
      if (isFinite(want) && want > 0 && want !== words.length && window.console && console.warn) {
        console.warn('[wave-player] ' + src + ': data-words says ' + want +
                     ' but ' + words.length + ' words were detected' +
                     (lead ? ' (plus a lead-in instruction)' : '') + '.');
      }

      gainNode = ctx.createGain();
      gainNode.connect(ctx.destination);

      loadState = 'ready';
      btn.disabled = false;
      slowB.disabled = false;
      replay.disabled = false;
      if (words.length > 1) {
        prevB.disabled = false;
        nextB.disabled = false;
        loopB.disabled = false;
        gapSel.disabled = !roomTone;
      }
      render();
      paintBtn();
      if (api.onReady) api.onReady(words.length);

      if (wantWord >= 0) { var w = wantWord; wantWord = -1; wantPlay = false; playWord(w); }
      else if (wantPlay) { wantPlay = false; play(); }
    }

    function setSegments(buf, list) {
      buffer = buf;
      items  = list.slice();
      words  = unitsOf(items);
      peaks  = null;
    }

    /* Listen-and-repeat: every item after the instruction is a word.
       Pairs: each English item and the Thai item after it make one pair. */
    function unitsOf(list) {
      if (!PAIRS) return list.slice(lead);
      var out = [];
      for (var i = lead; i + 1 < list.length; i += 2) {
        out.push({ s: list[i].s, e: list[i + 1].e, en: list[i], th: list[i + 1] });
      }
      return out;
    }

    /* Mixing to mono keeps every later step simple, and these are voice
       recordings, so nothing meaningful lives in the stereo image. */
    function toMono(buf) {
      if (buf.numberOfChannels === 1) return buf;
      var n = buf.length;
      var out = ctx.createBuffer(1, n, buf.sampleRate);
      var d = out.getChannelData(0);
      var chans = [], c;
      for (c = 0; c < buf.numberOfChannels; c++) chans.push(buf.getChannelData(c));
      for (var i = 0; i < n; i++) {
        var s = 0;
        for (c = 0; c < chans.length; c++) s += chans[c][i];
        d[i] = s / chans.length;
      }
      return out;
    }

    /* A slice of real recorded silence. Reused to fill the gaps when the
       student lengthens the pause, so the rebuilt track keeps the same
       faint room tone instead of turning into digital silence. */
    function grabRoomTone(buf, list) {
      if (list.length < 2) return null;
      var best = 0, bs = 0, be = 0;
      for (var i = 0; i < list.length - 1; i++) {
        var g = list[i + 1].s - list[i].e;
        if (g > best) { best = g; bs = list[i].e; be = list[i + 1].s; }
      }
      if (best < 0.5) return null;
      var sr = buf.sampleRate;
      var mid = (bs + be) / 2;
      var half = Math.min(0.2, best / 2 - 0.05);
      return buf.getChannelData(0).slice(
        Math.round((mid - half) * sr), Math.round((mid + half) * sr)
      );
    }

    /* ---- source selection ----
       The pipeline is: recording -> optional slow-down -> optional pause
       rebuild. Doing it in that order means the slow-down is computed
       once from the original and never redone when the pause length
       changes, and that a pause set to 7 s is 7 s of silence at either
       speed rather than 7 s stretched into 9.3 s. */
    function srcBuf()  { return (rate === 1 || !slowBuffer) ? origBuffer : slowBuffer; }
    function srcList() { return (rate === 1 || !slowItems)  ? origItems  : slowItems; }
    function srcLeadGap() {
      var L = srcList();
      return (lead && L.length > 1) ? (L[1].s - L[0].e) : 0;
    }
    /* "Wait for me" keeps the recorded pauses: it stops instead of stretching. */
    function gapNow() { return (PAIRS && gapSel.value === 'wait') ? 0 : (parseFloat(gapSel.value) || 0); }

    /* Building the slowed copy blocks for a few hundred milliseconds, so
       the status line is updated and the controls greyed out first, and
       the work is handed to the next tick where the browser can paint. */
    function ensureSlow(done) {
      if (slowBuffer) { done(); return; }
      /* Remember exactly which controls were live and restore only those:
         on a track with nothing to navigate, the disabled buttons must
         stay disabled. */
      var all = el.querySelectorAll('.wave-tools .mini-btn, .wave-select');
      var held = [], i;
      for (i = 0; i < all.length; i++) if (!all[i].disabled) { held.push(all[i]); all[i].disabled = true; }
      sub.textContent = 'preparing slower playback…';
      setTimeout(function () {
        var d = timeStretch(origBuffer.getChannelData(0), SLOW_RATE);
        slowBuffer = ctx.createBuffer(1, d.length, origBuffer.sampleRate);
        slowBuffer.getChannelData(0).set(d);
        /* The stretch is uniform, so every boundary simply moves out by
           the same factor — no need to hunt for the words again. */
        slowItems = origItems.map(function (it) {
          return { s: it.s / SLOW_RATE, e: it.e / SLOW_RATE, k: it.k };
        });
        for (var k = 0; k < held.length; k++) held[k].disabled = false;
        done();
      }, 30);
    }

    /* ---- rebuild with a different pause length ----
       The instruction keeps its own short gap: the student is not
       repeating it, so stretching it to 10 s would just be dead air.
       In pairs mode only the pause after each English prompt changes;
       the one after the Thai answer stays as recorded. */
    function rebuild(gapSec) {
      var wasPlaying = playing;
      var keepWord = words.length ? Math.max(0, wordIndexNear(pos())) : -1;
      if (playing) stop(false);
      waiting = -1;

      var base = srcBuf(), list = srcList(), leadGap = srcLeadGap();

      function gapAfter(i) {
        if (lead && i === 0) return leadGap;
        if (!PAIRS) return gapSec;
        if (list[i].k === 'en') return gapSec;
        return (i + 1 < list.length ? list[i + 1].s : base.duration) - list[i].e;
      }

      if (!gapSec || !roomTone || !list.length) {
        setSegments(base, list);
      } else {
        var sr = base.sampleRate;
        var d = base.getChannelData(0);
        var lead0 = Math.round(0.15 * sr);
        var i, total = lead0;
        for (i = 0; i < list.length; i++) {
          total += Math.round((list[i].e - list[i].s) * sr) + Math.round(gapAfter(i) * sr);
        }
        var nb = ctx.createBuffer(1, total, sr);
        var out = nb.getChannelData(0);
        for (i = 0; i < total; i += roomTone.length) {
          out.set(roomTone.subarray(0, Math.min(roomTone.length, total - i)), i);
        }
        var w = lead0, ns = [];
        for (i = 0; i < list.length; i++) {
          var a = Math.round(list[i].s * sr);
          var b = Math.round(list[i].e * sr);
          out.set(d.subarray(a, b), w);
          ns.push({ s: w / sr, e: (w + (b - a)) / sr, k: list[i].k });
          w += (b - a) + Math.round(gapAfter(i) * sr);
        }
        setSegments(nb, ns);
      }

      /* Every timestamp just changed, so hold the student's place by
         word number rather than by seconds. */
      startOffset = (keepWord >= 0 && words[keepWord]) ? words[keepWord].s : 0;
      if (loopIdx >= words.length) loopIdx = -1;
      render();
      if (wasPlaying) play(startOffset);
    }

    /* ---- playback ----
       Every AudioBufferSourceNode gets an onended handler that first
       checks whether it is still THE current source. Without that
       check a node discarded half a millisecond ago reports "I ended"
       after its replacement has already started, and the player stops
       itself and jumps to 0:00 — which is exactly what the ⏭ button
       used to do. Identity is checked per node; there is deliberately
       no shared "was this deliberate?" flag to get out of step.

       A node can also be told where to stop (node._until): one word
       played from the word list, or — in pairs mode with "Wait for
       me" — the end of an English prompt. It is stopped there sample-
       exactly by the audio clock, and the player parks at that spot
       instead of running to the end and jumping back to 0:00. */
    /* Looping runs a little way past the end of the word — roughly
       180 ms, so the repeat lands after a short breath rather than
       snapping straight back onto the next consonant. The tail is
       capped at whatever silence actually follows the word, so it can
       never eat into the next one, and the last word on every one of
       these tracks has ~400 ms of trailing pause to spend. */
    var LOOP_TAIL = 0.18;

    function loopEnd(i) {
      var w = words[i];
      if (!w) return 0;
      var limit = buffer.duration;
      for (var k = 0; k < items.length; k++) {
        if (items[k].s > w.e) { limit = items[k].s; break; }
      }
      return Math.min(w.e + LOOP_TAIL, limit, buffer.duration);
    }

    function pos() {
      if (!buffer) return 0;
      if (!playing) return startOffset;
      var t = startOffset + (ctx.currentTime - startedAt);
      if (loopIdx >= 0 && words[loopIdx] && source && source.loop) {
        var a = words[loopIdx].s, b = loopEnd(loopIdx), len = b - a;
        if (len > 0 && t > b) t = a + ((t - a) % len);
      }
      if (source && typeof source._until === 'number' && t > source._until) t = source._until;
      return Math.max(0, Math.min(buffer.duration, t));
    }

    function dropSource() {
      if (source) {
        var s = source;
        source = null;
        try { s.onended = null; } catch (e) {}
        try { s.stop(); } catch (e) {}
        try { s.disconnect(); } catch (e) {}
      }
    }

    function stop(reset, at) {
      if (playing) startOffset = (typeof at === 'number') ? at : pos();
      dropSource();
      playing = false;
      if (reset) startOffset = 0;
      cancelAnimationFrame(raf);
      paintBtn();
      render();
      msUpdate(ms);
    }

    /* The audio context may only be woken from inside a tap on iPhones,
       so every tap wakes it straight away — even while the file is still
       downloading — and the sound can then start by itself later. */
    function unlockCtx() {
      try { if (ctx.state !== 'running' && ctx.resume) ctx.resume(); } catch (e) {}
    }

    /* Pairs, "Wait for me": the end of the next English prompt ahead. */
    function nextWaitPoint(t) {
      for (var i = 0; i < words.length; i++) {
        if (words[i].en.e > t + 0.02) return words[i].en.e;
      }
      return null;
    }

    function play(from, until) {
      if (!buffer) return;
      stopOthers(api);
      unlockCtx();
      dropSource();
      waiting = -1;

      var at = (typeof from === 'number') ? from : startOffset;
      if (at >= buffer.duration - 0.02) at = 0;

      var node = ctx.createBufferSource();
      node.buffer = buffer;
      /* Always 1: slowing down is done by rebuilding the audio, never by
         resampling it, so the speaker's pitch never moves. */
      node.playbackRate.value = 1;
      var end = (typeof until === 'number') ? until : null;
      var loopW = (loopIdx >= 0 && words[loopIdx]) ? words[loopIdx] : null;
      if (loopW && !(PAIRS && waitMode)) {
        node.loop = true;
        node.loopStart = loopW.s;
        node.loopEnd = loopEnd(loopIdx);
        if (at < node.loopStart || at > node.loopEnd) at = node.loopStart;
        end = null;
      } else if (end === null && PAIRS && waitMode) {
        if (loopW) {
          /* Looping a pair while waiting: English, wait, Thai, round again. */
          if (at < loopW.s || at > loopEnd(loopIdx)) at = loopW.s;
          end = (at < loopW.en.e - 0.02) ? loopW.en.e : loopEnd(loopIdx);
        } else {
          end = nextWaitPoint(at);
        }
      }
      if (end !== null && end <= at + 0.01) end = null;

      node.connect(gainNode);
      node.onended = function () { if (source === node) segmentEnded(node); };
      node._until = end;
      source = node;
      node.start(0, at);
      if (end !== null) { try { node.stop(ctx.currentTime + (end - at)); } catch (e) {} }

      startOffset = at;
      startedAt = ctx.currentTime;
      playing = true;
      paintBtn();
      msClaim(ms);
      tick();
    }

    /* The current node has finished: either the track ran out, or it
       reached the spot it was told to stop at. */
    function segmentEnded(node) {
      var end = node._until;
      if (typeof end !== 'number') { stop(true); return; }
      stop(false, end);
      if (PAIRS && waitMode) {
        if (loopIdx >= 0 && words[loopIdx] && Math.abs(end - loopEnd(loopIdx)) < 0.01) {
          play(words[loopIdx].s);
          return;
        }
        for (var i = 0; i < words.length; i++) {
          if (Math.abs(words[i].en.e - end) < 0.01) { waiting = i; break; }
        }
        paintBtn();
        render();
      }
    }

    function tick() {
      render();
      if (playing) raf = requestAnimationFrame(tick);
    }

    function seek(t, keepPlaying) {
      var was = playing;
      if (playing) stop(false);
      waiting = -1;
      startOffset = Math.max(0, Math.min(buffer ? buffer.duration : 0, t));
      if (was || keepPlaying) play(startOffset); else { render(); paintBtn(); msUpdate(ms); }
    }

    /* ▶ / ⏸, from the button, the keyboard or the lock screen. */
    function toggle() {
      unlockCtx();
      if (!buffer) {
        if (loadState === 'missing') return;
        if (loadState === 'network') { stopOthers(api); retryLoad(); return; }
        wantPlay = !wantPlay;
        wantWord = -1;
        if (wantPlay) { stopOthers(api); load(); }
        paintLoading();
        return;
      }
      if (playing) { stop(false); return; }
      if (PAIRS && waiting >= 0 && words[waiting]) { play(words[waiting].th.s); return; }
      play();
    }

    /* One word on its own, for the word-list speaker buttons. While Loop
       word is on, it moves the loop to that word instead. */
    function playWord(i) {
      unlockCtx();
      if (!buffer) {
        if (loadState === 'missing') return;
        stopOthers(api);
        wantWord = i;
        wantPlay = false;
        if (loadState === 'network') { loadState = ''; btn.disabled = false; }
        load();
        paintLoading();
        return;
      }
      if (!words[i]) return;
      if (loopIdx >= 0) { loopIdx = i; play(words[i].s); return; }
      play(words[i].s, loopEnd(i));
    }
    api.playWord = playWord;
    api.isReady = function () { return !!buffer; };

    /* ---- word lookup ----
       Three different questions, three different answers — conflating
       them is what made ⏭ skip a word. */

    /* The word the playhead is INSIDE, or -1 while in a pause. */
    function wordIndexAt(t) {
      for (var i = 0; i < words.length; i++) {
        if (t >= words[i].s && t <= words[i].e) return i;
      }
      return -1;
    }

    /* The word this moment belongs to: the one being spoken, or the
       one whose pause we are sitting in. Used by Loop word and by the
       rebuild, which need an answer even mid-silence. */
    function wordIndexNear(t) {
      var last = -1;
      for (var i = 0; i < words.length; i++) {
        if (words[i].s <= t + 0.05) last = i; else break;
      }
      return last;
    }

    function jump(dir) {
      if (!words.length) return;
      var t = pos(), i;
      if (dir > 0) {
        i = -1;
        for (var k = 0; k < words.length; k++) {
          if (words[k].s > t + 0.05) { i = k; break; }
        }
        if (i < 0) return;                 /* already at the last word */
      } else {
        /* First press restarts the word you are on; press again to
           step back. Sitting in a pause counts as "on" the word you
           have just heard, which is the one you want to hear again. */
        i = wordIndexNear(t - 0.25);
        if (i < 0) i = 0;
      }
      if (loopIdx >= 0) loopIdx = i;
      seek(words[i].s, true);
    }

    /* ---- drawing ---- */
    function cssVar(name, fallbackColor) {
      var v = getComputedStyle(el).getPropertyValue(name);
      return (v && v.trim()) || fallbackColor;
    }

    /* Canvas roundRect() is recent, so this draws the path by hand. */
    function roundRect(g, x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      g.beginPath();
      g.moveTo(x + r, y);
      g.arcTo(x + w, y,     x + w, y + h, r);
      g.arcTo(x + w, y + h, x,     y + h, r);
      g.arcTo(x,     y + h, x,     y,     r);
      g.arcTo(x,     y,     x + w, y,     r);
      g.closePath();
    }

    function buildPeaks(buckets) {
      var d = buffer.getChannelData(0), n = d.length;
      var out = new Float32Array(buckets), max = 0;
      var step = n / buckets;
      for (var i = 0; i < buckets; i++) {
        var a = Math.floor(i * step), b = Math.min(n, Math.floor((i + 1) * step));
        var m = 0;
        for (var j = a; j < b; j++) {
          var v = d[j] < 0 ? -d[j] : d[j];
          if (v > m) m = v;
        }
        out[i] = m;
        if (m > max) max = m;
      }
      if (max > 0) for (i = 0; i < buckets; i++) out[i] /= max;
      peaks = out;
      peakBuckets = buckets;
    }

    function render() {
      if (!buffer || !canvas.clientWidth) return;

      var dpr  = window.devicePixelRatio || 1;
      var wCss = canvas.clientWidth;
      var hCss = canvas.clientHeight || 78;
      var W = Math.round(wCss * dpr), H = Math.round(hCss * dpr);
      if (canvas.width !== W || canvas.height !== H) {
        canvas.width = W;
        canvas.height = H;
        peaks = null;
      }

      var barW = 2 * dpr, step = 3 * dpr;
      var buckets = Math.max(1, Math.floor(W / step));
      if (!peaks || peakBuckets !== buckets) buildPeaks(buckets);

      var g = canvas.getContext('2d');
      var accent = cssVar('--accent', '#b8893a');
      var soft   = cssVar('--ink-soft', '#6b5d44');
      var dur    = buffer.duration;
      var t      = pos();

      /* A label lane across the top carries the word numbers; the
         waveform lives underneath it. */
      var lane = Math.round(14 * dpr);
      var top = lane, boxH = H - lane;
      var mid = top + boxH / 2, maxH = boxH - 8 * dpr;
      var playedX = (t / dur) * W;
      function X(sec) { return (sec / dur) * W; }

      g.clearRect(0, 0, W, H);

      /* Pauses are marked, not boxed: an inset rounded shape at very
         low opacity. Enough to say "wait here", quiet enough to stay
         in the background. In pairs mode the pause the student answers
         in — after each English prompt — is tinted in the accent. */
      var prevEnd = 0, prevKind = '', k;
      for (k = 0; k <= items.length; k++) {
        var gs = prevEnd;
        var ge = (k < items.length) ? items[k].s : dur;
        if (ge - gs > 0.35) {
          var answer = PAIRS && prevKind === 'en';
          g.save();
          g.globalAlpha = answer ? 0.11 : 0.05;
          g.fillStyle = answer ? accent : soft;
          roundRect(g, X(gs), top + boxH * 0.16, X(ge) - X(gs), boxH * 0.68, 5 * dpr);
          g.fill();
          g.restore();
        }
        if (k < items.length) { prevEnd = items[k].e; prevKind = items[k].k || ''; }
      }

      /* The word being spoken right now, softly lit. */
      var cur = wordIndexAt(t);
      var marked = loopIdx >= 0 ? loopIdx : cur;
      if (marked >= 0 && words[marked]) {
        g.save();
        g.globalAlpha = loopIdx >= 0 ? 0.16 : 0.10;
        g.fillStyle = accent;
        roundRect(g, X(words[marked].s), top, X(words[marked].e) - X(words[marked].s), boxH, 4 * dpr);
        g.fill();
        g.restore();
      }

      /* Pairs: the English (and the instructions) are drawn quieter, in
         the secondary ink, so each Thai answer stands out in the accent. */
      var ki = 0;
      for (var i = 0; i < buckets; i++) {
        var x = i * step;
        var h = Math.max(2 * dpr, peaks[i] * maxH);
        var played = (x + barW / 2 <= playedX);
        var quiet = false;
        if (PAIRS) {
          var sec = ((x + barW / 2) / W) * dur;
          while (ki < items.length && items[ki].e < sec) ki++;
          quiet = ki < items.length && items[ki].s <= sec && items[ki].k !== 'th';
        }
        g.fillStyle = quiet ? soft : accent;
        g.globalAlpha = quiet ? (played ? 0.7 : 0.22) : (played ? 1 : 0.28);
        g.fillRect(x, mid - h / 2, barW, h);
      }
      g.globalAlpha = 1;

      /* Word numbers. These replace the old tick marks: a number says
         what a tick could not, and turns the waveform into a map the
         student can aim at. */
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = '600 ' + Math.round(10 * dpr) + 'px "Prompt", "Sarabun", sans-serif';
      if (lead && items.length) {
        g.globalAlpha = 0.5;
        g.fillStyle = soft;
        g.fillText('▸', (X(items[0].s) + X(items[0].e)) / 2, lane / 2);
      }
      var lastLabelX = -1e9;
      for (i = 0; i < words.length; i++) {
        var cx = (X(words[i].s) + X(words[i].e)) / 2;
        if (cx - lastLabelX < 13 * dpr) continue;   /* never let numbers collide */
        lastLabelX = cx;
        var hot = (i === marked);
        g.globalAlpha = hot ? 1 : 0.55;
        g.fillStyle = hot ? accent : soft;
        g.fillText(String(i + 1), cx, lane / 2);
      }
      g.globalAlpha = 1;

      g.fillStyle = accent;
      g.fillRect(Math.min(W - 2 * dpr, playedX), 0, 2 * dpr, H);

      timeEl.textContent = fmt(t) + ' / ' + fmt(dur);
      canvas.setAttribute('aria-valuenow', Math.round((t / dur) * 100));
      sub.textContent = statusText(t, cur);

      /* Tell the word list which row to light up: the word being spoken,
         or the one whose repeat pause is running. */
      if (api.onWord) {
        var m = -1;
        if (loopIdx >= 0) m = loopIdx;
        else if (playing && !(lead && items.length && t < items[0].e)) m = wordIndexNear(t);
        if (m !== lastMark) { lastMark = m; api.onWord(m); }
      }
    }

    function statusText(t, cur) {
      if (!words.length) return 'Click the waveform to jump anywhere';
      var n = words.length, head = n + ' ' + U.many + ' · ';
      if (PAIRS) {
        if (waiting >= 0) return head + 'pair ' + (waiting + 1) + ' · your turn — say it in Thai, then tap ▶';
        if (lead && items.length && t < items[0].e && loopIdx < 0) return head + 'instructions';
        var p = loopIdx >= 0 ? loopIdx : wordIndexNear(t);
        if (p < 0) return head + 'ready';
        var w = words[p], name = (loopIdx >= 0 ? 'looping pair ' : 'pair ') + (p + 1);
        if (t < w.en.e) return head + name + ' · English';
        if (t < w.th.s) return head + name + ' · your turn — say it in Thai';
        if (t <= w.th.e) return head + name + ' · Thai';
        return head + name;
      }
      if (loopIdx >= 0) return head + 'looping word ' + (loopIdx + 1);
      if (lead && items.length && t < items[0].e) return head + 'instructions';
      if (cur >= 0) return head + 'word ' + (cur + 1) + ' of ' + n;
      var near = wordIndexNear(t);
      if (near < 0) return head + 'ready';
      return head + 'your turn — repeat word ' + (near + 1);
    }

    function paintBtn() {
      var key = (wantPlay && !buffer && loadState === 'loading') ? 'load' : (playing ? 'pause' : 'play');
      if (key !== btnIcon) {
        btnIcon = key;
        btn.innerHTML = key === 'load' ? ICON_LOAD : (key === 'pause' ? ICON_PAUSE : ICON_PLAY);
      }
      btn.setAttribute('aria-label', key === 'load' ? 'Loading: ' + title : (key === 'pause' ? 'Pause' : 'Play: ' + title));
      btn.classList.toggle('is-waiting', waiting >= 0 && !playing);
    }

    /* ---- interaction ---- */
    btn.addEventListener('click', toggle);

    sub.addEventListener('click', function (e) {
      if (e.target && e.target.closest && e.target.closest('.wave-retry')) { unlockCtx(); stopOthers(api); retryLoad(); }
    });

    replay.addEventListener('click', function () {
      loopIdx = -1;
      loopB.setAttribute('aria-pressed', 'false');
      play(0);
    });

    /* Clicking a phrase snaps to its start, so a click can never land
       40 ms into a word and clip its first consonant. Clicking a pause
       still seeks exactly where you pointed. */
    canvas.addEventListener('click', function (e) {
      if (!buffer) { if (loadState !== 'missing') { unlockCtx(); load(); } return; }
      var r = canvas.getBoundingClientRect();
      var ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      var t = ratio * buffer.duration;
      for (var i = 0; i < items.length; i++) {
        if (t >= items[i].s && t <= items[i].e) { t = items[i].s; break; }
      }
      loopIdx = -1;
      loopB.setAttribute('aria-pressed', 'false');
      seek(t);
    });

    canvas.addEventListener('keydown', function (e) {
      if (!buffer) return;
      if (e.key === 'ArrowRight') { seek(pos() + 2); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { seek(pos() - 2); e.preventDefault(); }
      else if (e.key === ' ' || e.key === 'Enter') {
        toggle();
        e.preventDefault();
      }
    });

    prevB.addEventListener('click', function () { jump(-1); });
    nextB.addEventListener('click', function () { jump(1); });

    loopB.addEventListener('click', function () {
      var on = loopB.getAttribute('aria-pressed') === 'true';
      waiting = -1;
      if (on) {
        /* Releasing the loop always continues from just after the word
           that was looping, whether it ran round twice or fifty times.
           The old code read pos() AFTER clearing loopIdx, so pos() no
           longer wrapped and handed back the raw elapsed time — loop a
           word for half a minute and playback resumed half a minute
           further down the track. Read the resume point first, clear
           the loop second. */
        var at = words[loopIdx] ? words[loopIdx].e : pos();
        loopIdx = -1;
        loopB.setAttribute('aria-pressed', 'false');
        if (playing) play(at);
        else { startOffset = at; render(); paintBtn(); }
      } else {
        var i = wordIndexNear(pos());
        if (i < 0) i = 0;
        loopIdx = i;
        loopB.setAttribute('aria-pressed', 'true');
        play(words[i].s);
      }
    });

    slowB.addEventListener('click', function () {
      var on = slowB.getAttribute('aria-pressed') === 'true';
      if (on) {
        rate = 1;
        slowB.setAttribute('aria-pressed', 'false');
        rebuild(gapNow());
        return;
      }
      ensureSlow(function () {
        rate = SLOW_RATE;
        slowB.setAttribute('aria-pressed', 'true');
        rebuild(gapNow());
      });
    });

    gapSel.addEventListener('change', function () {
      waitMode = PAIRS && gapSel.value === 'wait';
      rebuild(gapNow());
    });

    /* Repaint on theme change and resize: the waveform once it is in,
       the loading line before that. */
    waveRedraws.push(function () { if (buffer) render(); else drawLoading(); });

    whenNear(el, load);
    if (!nearObserver) load();
    paintLoading();
  }

  /* Waveforms are painted, not styled, so they have to be repainted
     when the theme changes or the element is resized. */
  function repaintWaves() {
    for (var i = 0; i < waveRedraws.length; i++) waveRedraws[i]();
  }
  if (window.MutationObserver) {
    new MutationObserver(repaintWaves).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  var waveResizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(waveResizeTimer);
    waveResizeTimer = setTimeout(repaintWaves, 120);
  }, { passive: true });

  Array.prototype.forEach.call(document.querySelectorAll('.player[data-src]'), function (el) {
    if (el.getAttribute('data-waveform') === 'true') buildWavePlayer(el);
    else buildPlayer(el);
  });

  /* =========================================================
     WORD LIST ↔ VOCABULARY TRACK
     A waveform player with data-vocab-list="<id>" drives the
     speaker buttons in that list: button N plays word N of the
     track, and the row of the word being spoken lights up while
     the track plays. If the track turns out not to hold exactly
     one word per row, the buttons are switched off again.
     ========================================================= */
  var ICON_RING = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>';

  function linkVocab(trackEl) {
    var wave = trackEl._wave;
    var listEl = document.getElementById(trackEl.getAttribute('data-vocab-list'));
    if (!wave || !listEl) return;
    var rows = listEl.querySelectorAll('.vocab-item');
    if (!rows.length) return;
    var head = listEl.previousElementSibling;
    var lit = -1;

    function each(fn) {
      for (var i = 0; i < rows.length; i++) fn(rows[i], rows[i].querySelector('.vocab-play'), i);
    }
    function show(on) {
      each(function (row, b) {
        if (b) b.hidden = !on;
        row.classList.toggle('has-play', on);
      });
      if (head && head.classList.contains('vocab-head')) head.classList.toggle('has-audio', on);
    }
    /* A turning ring on the button pressed while the track is still on its way. */
    function spin(i) {
      each(function (row, b, k) {
        if (!b) return;
        var on = k === i;
        if (on === b.classList.contains('is-loading')) return;
        b.classList.toggle('is-loading', on);
        b.innerHTML = on ? ICON_RING : ICON_SPEAKER;
      });
    }
    function mark(i) {
      if (lit >= 0 && rows[lit]) rows[lit].classList.remove('is-current');
      lit = (i >= 0 && i < rows.length) ? i : -1;
      if (lit >= 0) { rows[lit].classList.add('is-current'); spin(-1); }
    }
    function unlink() {
      mark(-1);
      spin(-1);
      show(false);
      wave.onWord = null;
    }

    wave.onWord = mark;
    wave.onReady = function (count) {
      spin(-1);
      if (count !== rows.length) {
        if (window.console && console.warn) {
          console.warn('[vocab] the track has ' + count + ' words but the list has ' + rows.length +
                       ' rows, so the speaker buttons are switched off.');
        }
        unlink();
      }
    };
    wave.onFail = function () { spin(-1); };
    wave.onGone = unlink;

    each(function (row, b, i) {
      if (!b) return;
      b.addEventListener('click', function () {
        if (!wave.isReady()) spin(i);
        wave.playWord(i);
      });
    });
    show(true);
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-vocab-list]'), linkVocab);

  /* =========================================================
     "CLICK" OR "TAP"
     On touch screens the intro says "Tap the settings icon".
     ========================================================= */
  try {
    if (window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches) {
      Array.prototype.forEach.call(document.querySelectorAll('.js-tap'), function (s) { s.textContent = 'Tap'; });
    }
  } catch (e) {}

  /* =========================================================
     REVEAL BUTTONS
     ========================================================= */
  Array.prototype.forEach.call(document.querySelectorAll('.reveal-btn'), function (btn) {
    btn.addEventListener('click', function () {
      var body = document.getElementById(btn.getAttribute('aria-controls'));
      if (!body) return;
      var open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      body.hidden = open;
      btn.firstChild.nodeValue = (open ? btn.dataset.showLabel : btn.dataset.hideLabel) || btn.firstChild.nodeValue;
    });
    // Remember both label variants ("Show …" / "Hide …") on first wire.
    var label = btn.firstChild.nodeValue.trim();
    btn.dataset.showLabel = ' ' + label + ' ';
    btn.dataset.hideLabel = ' ' + label.replace(/^Show/, 'Hide') + ' ';
  });

  /* =========================================================
     COUNTRY PERSONALISATION
     Fills the student's country into the ผมมาจาก … ครับ pattern.
     ========================================================= */
  var countryInput = document.getElementById('yourcountry');
  var slotsTh   = document.querySelectorAll('[data-slot-th]');
  var slotsRom  = document.querySelectorAll('[data-slot-rom]');
  var slotsEn   = document.querySelectorAll('[data-slot-en]');

  function applyCountry(v) {
    var country = (v || '').trim();
    Array.prototype.forEach.call(slotsTh, function (s) {
      s.textContent = country || '…';
      s.classList.toggle('filled', !!country);
    });
    Array.prototype.forEach.call(slotsRom, function (s) {
      s.textContent = country || 'your country';
      s.classList.toggle('filled', !!country);
    });
    /* The full stop belongs to the finished sentence, so it only
       appears once there is a real country to end. */
    Array.prototype.forEach.call(slotsEn, function (s) {
      s.textContent = country ? country + '.' : '…';
      s.classList.toggle('filled', !!country);
    });
  }

  if (countryInput) {
    try {
      var saved = localStorage.getItem('thaiL2Country');
      if (saved) { countryInput.value = saved; applyCountry(saved); }
    } catch (e) {}

    countryInput.addEventListener('input', function () {
      applyCountry(countryInput.value);
      try { localStorage.setItem('thaiL2Country', countryInput.value.trim()); } catch (e) {}
    });
  }

  /* =========================================================
     THEME + TEXT SIZE

     The storage keys below are deliberately the "L1" ones. Theme and text
     size are reader preferences, not lesson data, so every review page in
     the course shares one pair of keys — set dark + 110% in Lesson 1 and
     Lesson 2 opens the same way. Keep these names in future lessons too.
     Lesson-specific answers (thaiL2Country) stay per-lesson.
     ========================================================= */
  var TOPBAR_COLOR = { warm: '#fffaf0', paper: '#eef1f4', dark: '#2a2622' };
  var metaColor = document.getElementById('meta-theme-color');
  var themeBtns = document.querySelectorAll('[data-theme-set]');

  function setTheme(name) {
    if (name === 'warm') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', name);
    if (metaColor) metaColor.setAttribute('content', TOPBAR_COLOR[name] || '#fffaf0');
    Array.prototype.forEach.call(themeBtns, function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-theme-set') === name ? 'true' : 'false');
    });
    try { localStorage.setItem('thaiL1Theme', name); } catch (e) {}
  }

  Array.prototype.forEach.call(themeBtns, function (b) {
    b.addEventListener('click', function () { setTheme(b.getAttribute('data-theme-set')); });
  });

  var slider = document.getElementById('text-slider');
  var sliderVal = document.getElementById('text-value');

  function setScale(n) {
    document.documentElement.style.setProperty('--tx', (n / 100).toFixed(2));
    if (sliderVal) sliderVal.textContent = n + '%';
    try { localStorage.setItem('thaiL1Text', String(n)); } catch (e) {}
  }

  if (slider) {
    slider.addEventListener('input', function () {
      var n = parseInt(slider.value, 10);
      if (isFinite(n)) setScale(n);
    });
  }

  // Restore saved preferences.
  try {
    var t = localStorage.getItem('thaiL1Theme');
    setTheme((t === 'paper' || t === 'dark') ? t : 'warm');

    var s = parseInt(localStorage.getItem('thaiL1Text'), 10);
    if (isFinite(s) && s >= 90 && s <= 140) { if (slider) slider.value = s; setScale(s); }
  } catch (e) { setTheme('warm'); }

  /* =========================================================
     SETTINGS PANEL
     ========================================================= */
  var settingsBtn   = document.getElementById('btn-settings');
  var settingsPanel = document.getElementById('settings-panel');

  function closeSettings() {
    settingsPanel.hidden = true;
    settingsBtn.setAttribute('aria-expanded', 'false');
  }

  settingsBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = !settingsPanel.hidden;
    settingsPanel.hidden = open;
    settingsBtn.setAttribute('aria-expanded', open ? 'false' : 'true');
  });

  document.addEventListener('click', function (e) {
    if (!settingsPanel.hidden && !settingsPanel.contains(e.target)) closeSettings();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !settingsPanel.hidden) { closeSettings(); settingsBtn.focus(); }
  });

  /* =========================================================
     SCROLL PROGRESS + BACK TO TOP
     ========================================================= */
  var progress = document.getElementById('progress');
  var toTop = document.getElementById('to-top');
  var ticking = false;

  function onScroll() {
    var doc = document.documentElement;
    var max = doc.scrollHeight - doc.clientHeight;
    var y = window.scrollY || doc.scrollTop;
    progress.style.width = (max > 0 ? (y / max) * 100 : 0) + '%';
    toTop.classList.toggle('show', y > 600);
    ticking = false;
  }

  window.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; window.requestAnimationFrame(onScroll); }
  }, { passive: true });

  window.addEventListener('resize', onScroll, { passive: true });
  onScroll();

  toTop.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

})();
</script>
</body>
</html>
