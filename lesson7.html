<script>
  /* Defined before the images so a fast/cached failure is still caught.
     Removes the illustration and collapses its grid column, so a missing
     image leaves no empty gutter. Part 2 shows two people in one figure, so
     only the missing one is dropped — the column collapses when nothing is
     left to show. */
  function lessonImgFail(img) {
    var fig = img.closest('figure');
    var holder = img.parentElement;
    img.remove();
    if (holder && holder !== fig && !holder.querySelector('img')) holder.remove();
    if (fig && !fig.querySelector('img')) {
      var parent = fig.parentElement;
      fig.remove();
      if (parent) parent.classList.add('no-figure');
    }
  }
</script>

<style>
  /* ============================================================
     THEMES — the same token names and values as the main app, so
     students who later unlock the app land on a familiar surface.
     Three themes only (Warm / Paper / Dark) rather than all six.
     ============================================================ */
  :root {
    --bg: #f5ecd9;
    --bg-2: #ebe0c4;
    --panel: #fffaf0;
    --ink: #2b2418;
    --ink-soft: #6b5d44;
    --accent: #b8893a;
    --accent-2: #8a6420;
    --rom: #7a5a1e;
    --shadow: rgba(80, 60, 20, 0.18);
    --shadow-strong: rgba(80, 60, 20, 0.3);
    --button-bg: #fffaf0;
    --button-hover: #f5ecd9;
    --topbar-bg: #fffaf0;
    --hairline: var(--shadow);

    /* Text-size multiplier driven by the A—A slider. */
    --tx: 1;
    /* Shared layout width. One number governs every block on the page. */
    --measure: 860px;
    --radius: 10px;
  }

  [data-theme="paper"] {
    --bg: #dee2e6;
    --bg-2: #d6dbe1;
    --panel: #fbfcfd;
    --ink: #1f2225;
    --ink-soft: #56606b;
    --accent: #5a6b80;
    --accent-2: #3f5266;
    --rom: #3f6b78;
    --shadow: rgba(30, 35, 45, 0.16);
    --shadow-strong: rgba(30, 35, 45, 0.28);
    --button-bg: #fbfcfd;
    --button-hover: #e9edf1;
    --topbar-bg: #eef1f4;
  }

  [data-theme="dark"] {
    --bg: #1a1815;
    --bg-2: #252220;
    --panel: #2a2622;
    --ink: #f0e6d2;
    --ink-soft: #b8a888;
    --accent: #d4b87a;
    --accent-2: #b8893a;
    --rom: #dcc48c;
    --shadow: rgba(0, 0, 0, 0.5);
    --shadow-strong: rgba(0, 0, 0, 0.7);
    --button-bg: #2a2622;
    --button-hover: #353028;
    --topbar-bg: #2a2622;
  }

  /* ========= RESET & BASE ========= */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    background-image: radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg) 70%);
    background-attachment: fixed;
    color: var(--ink);
    line-height: 1.55;
    min-height: 100%;
    transition: background-color 0.3s ease, color 0.3s ease;
    /* Text on a review page must stay copyable — the app disables selection
       globally because taps there are game moves, but here they are not. */
    -webkit-text-size-adjust: 100%;
  }
  [data-theme="paper"] body { background-image: none; }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }
  img { max-width: 100%; display: block; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .wrap { width: 100%; max-width: var(--measure); margin: 0 auto; padding: 0 1rem; }

  /* ========= SCROLL PROGRESS ========= */
  #progress {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    width: 0%;
    background: var(--accent);
    z-index: 60;
    transition: width 0.08s linear;
  }

  /* ========= TOPBAR ========= */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.55rem 1rem;
    background: var(--topbar-bg);
    border-bottom: 1px solid var(--hairline);
    box-shadow: 0 1px 6px var(--shadow);
  }
  .topbar-brand {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    min-width: 0;
  }
  .topbar-brand .tb-lesson {
    font-family: 'Prompt', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    color: var(--accent);
    white-space: nowrap;
  }
  .topbar-brand .tb-course {
    font-size: 0.82rem;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @media (max-width: 520px) { .topbar-brand .tb-course { display: none; } }

  .icon-btn {
    width: 40px;
    height: 40px;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background: var(--button-bg);
    border: 1px solid var(--shadow);
    transition: background-color 0.2s ease, transform 0.1s ease;
  }
  .icon-btn:hover { background: var(--button-hover); }
  .icon-btn:active { transform: scale(0.95); }
  .icon-btn svg { width: 20px; height: 20px; fill: var(--ink); }

  /* ========= SETTINGS PANEL ========= */
  .settings-wrap { position: relative; }
  .settings-panel {
    position: absolute;
    top: calc(100% + 0.5rem);
    right: 0;
    width: 260px;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-radius: 12px;
    box-shadow: 0 8px 28px var(--shadow-strong);
    padding: 0.9rem;
    z-index: 55;
  }
  .settings-panel[hidden] { display: none; }
  .settings-label {
    font-family: 'Prompt', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    margin-bottom: 0.45rem;
  }
  .theme-row { display: flex; gap: 0.4rem; margin-bottom: 1rem; }
  .theme-opt {
    flex: 1;
    padding: 0.5rem 0.2rem 0.45rem;
    border: 1px solid var(--shadow);
    border-radius: 8px;
    background: var(--button-bg);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--ink-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  /* The outline is an inset shadow, not a border. A border sits outside
     the box the gradient is sized to, so the gradient repeated into it and
     drew a stray 1px strip of the opposite colour along the top and bottom
     edges — the diagonal looked broken. The stops are also half a pixel
     apart, which keeps the diagonal smooth instead of stair-stepped. */
  .theme-opt .sw {
    width: 100%;
    height: 16px;
    border-radius: 4px;
    box-shadow: inset 0 0 0 1px var(--shadow);
    background-repeat: no-repeat;
  }
  .theme-opt[aria-pressed="true"] {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .sw-warm  { background-image: linear-gradient(135deg, #f5ecd9 calc(50% - 0.5px), #b8893a calc(50% + 0.5px)); }
  .sw-paper { background-image: linear-gradient(135deg, #dee2e6 calc(50% - 0.5px), #5a6b80 calc(50% + 0.5px)); }
  .sw-dark  { background-image: linear-gradient(135deg, #1a1815 calc(50% - 0.5px), #d4b87a calc(50% + 0.5px)); }

  /* Font-size slider — same pill component as the app's Vocabulary menu. */
  .font-slider {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 0.85rem;
    background: var(--bg);
    border: 1px solid var(--shadow);
    border-radius: 999px;
  }
  .font-slider .mfs-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink-soft);
    white-space: nowrap;
    display: flex;
    align-items: baseline;
    gap: 0.3rem;
  }
  .font-slider .mfs-a-small { font-size: 0.8rem; }
  .font-slider .mfs-a-big { font-size: 1.05rem; }
  .font-slider input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); cursor: pointer; }
  .font-slider .mfs-value {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent);
    min-width: 3.6ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ========= HERO ========= */
  .hero { text-align: center; padding: 2.4rem 0 1.6rem; }
  .hero h1 {
    font-family: 'Prompt', sans-serif;
    font-size: clamp(2rem, 7vw, 3rem);
    font-weight: 700;
    line-height: 1.05;
    color: var(--accent);
    letter-spacing: 0.01em;
  }
  .hero-rom {
    font-size: clamp(0.95rem, 3vw, 1.1rem);
    font-style: italic;
    font-weight: 500;
    color: var(--accent-2);
    margin-top: 0.15rem;
  }
  .hero-rom .th { font-style: normal; }
  .hero-lede {
    max-width: 32rem;
    margin: 0.9rem auto 0;
    color: var(--ink-soft);
    font-size: calc(1.02rem * var(--tx));
  }
  /* ========= CONTENTS ========= */
  .contents {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.5rem;
    margin: 0.5rem 0 2.6rem;
  }
  .toc-link {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.65rem 0.8rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-radius: var(--radius);
    text-decoration: none;
    color: var(--ink);
    font-size: 0.9rem;
    font-weight: 500;
    transition: border-color 0.15s ease, transform 0.12s ease;
  }
  .toc-link:hover { border-color: var(--accent); transform: translateY(-1px); }
  .toc-num {
    font-family: 'Prompt', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.06em;
    flex: 0 0 auto;
  }

  /* ========= PART SECTIONS ========= */
  .part {
    /* Clears the sticky topbar when a TOC link jumps here. */
    scroll-margin-top: 72px;
    margin-bottom: 3.2rem;
  }
  .part-head { margin-bottom: 1.3rem; }
  .part-eyebrow {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-family: 'Prompt', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.5rem;
  }
  .part-eyebrow::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }
  .part-head h2 {
    font-family: 'Prompt', sans-serif;
    font-size: calc(clamp(1.3rem, 4vw, 1.7rem) * var(--tx));
    font-weight: 600;
    line-height: 1.2;
    color: var(--ink);
  }
  .part-head p {
    margin-top: 0.4rem;
    color: var(--ink-soft);
    font-size: calc(1rem * var(--tx));
    max-width: 44rem;
  }

  /* ========= PHRASE CARDS ========= */
  .phrase-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
  }
  .phrase-card {
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-radius: var(--radius);
    padding: 1.1rem 1.15rem 1.2rem;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .question-transform {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    gap: 1rem;
    align-items: center;
  }
  .transform-example {
    min-width: 0;
    padding: 0.9rem 1rem;
    border-radius: calc(var(--radius) - 4px);
    background: color-mix(in srgb, var(--panel) 84%, var(--accent) 16%);
    border: 1px solid var(--hairline);
  }
  .transform-arrow {
    display: grid;
    justify-items: center;
    gap: 0.25rem;
    color: var(--accent-2);
    text-align: center;
  }
  .transform-arrow strong {
    font-family: 'Prompt', sans-serif;
    font-size: calc(0.78rem * var(--tx));
    line-height: 1.35;
  }
  .transform-arrow-symbol {
    font-size: 2rem;
    line-height: 1;
    color: var(--accent);
  }
  .speaker-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: 'Prompt', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-2);
    padding-bottom: 0.65rem;
    margin-bottom: 0.85rem;
    border-bottom: 1px solid var(--hairline);
    width: 100%;
  }
  /* Avatar icons in the speaker tags. Sized in rem, not em, so they stay
     put when the text-size slider moves — the tag label is fixed-size too. */
  .speaker-tag .sym-img {
    flex: none;
    width: 1.45rem;
    height: 1.45rem;
    object-fit: contain;
    margin-right: 0.1rem;
  }

  .line { margin-bottom: 0.95rem; }
  .line:last-child { margin-bottom: 0; }
  .question-transform .transform-example { margin-bottom: 0; }
  .line .th {
    font-size: calc(1.5rem * var(--tx));
    font-weight: 600;
    color: var(--ink);
    line-height: 1.7;
    word-break: break-word;
  }
  .line .rom {
    font-size: calc(1rem * var(--tx));
    font-weight: 500;
    color: var(--rom);
    line-height: 1.4;
    margin-top: 0.1rem;
  }
  .line .en {
    font-size: calc(0.9rem * var(--tx));
    color: var(--ink-soft);
    margin-top: 0.15rem;
  }

  /* The name slot that the personalisation input fills in. */
  .slot {
    display: inline-block;
    padding: 0 0.3em;
    border-bottom: 2px dotted var(--accent);
    color: var(--accent-2);
    font-weight: 600;
    min-width: 2.5em;
    text-align: center;
  }
  .slot.filled { border-bottom-style: solid; }

  /* The English line gets a plain slot — no underline, just a light
     emphasis once a real country is in it, so the sentence still reads
     as ordinary English. */
  .slot-en.filled { color: var(--ink); font-weight: 600; }

  /* ========= NAME PERSONALISATION ========= */
  .name-box {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.7rem;
    margin-top: 1.1rem;
    padding: 0.85rem 1rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
  }
  .name-box label {
    font-size: calc(0.92rem * var(--tx));
    font-weight: 500;
    color: var(--ink-soft);
  }
  .name-box input {
    flex: 1;
    min-width: 140px;
    padding: 0.5rem 0.75rem;
    font-size: calc(0.98rem * var(--tx));
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--shadow);
    border-radius: 8px;
  }
  .name-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--shadow); }

  /* ========= AUDIO PLAYER ========= */
  .player {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.85rem 1rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-radius: var(--radius);
    box-shadow: 0 1px 3px var(--shadow);
  }
  .player.is-error { opacity: 0.72; }

  /* A player nested inside a card would otherwise be panel-on-panel and
     disappear into it, so it drops back to the page background. */
  .phrase-card .player,
  .tip .player {
    background: var(--bg);
    box-shadow: none;
  }
  /* The .line above already contributes its own margin-bottom, so this only
     needs to top it up — 1.05rem here totalled ~2rem and read as a gap. */
  .phrase-card .player { margin-top: 0.35rem; }

  .play-btn {
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, filter 0.15s ease;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .play-btn svg { width: 22px; height: 22px; fill: var(--panel); }
  .play-btn:hover { filter: brightness(1.07); }
  .play-btn:active { transform: scale(0.94); }
  .play-btn:disabled { cursor: not-allowed; filter: grayscale(1); opacity: 0.5; }
  /* Loading: a turning ring in place of the play triangle. */
  .play-btn svg.spin {
    fill: none;
    stroke: var(--panel);
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-dasharray: 38 16;
    animation: play-spin 0.9s linear infinite;
  }
  @keyframes play-spin { to { transform: rotate(360deg); } }
  /* Waiting for the student (pairs player, "Wait for me"): a soft ring
     pulses out of the play button until it is tapped. */
  .play-btn.is-waiting { animation: play-wait 1.6s ease-out infinite; }
  @keyframes play-wait {
    0%   { box-shadow: 0 2px 8px var(--shadow), 0 0 0 0 var(--accent); }
    70%  { box-shadow: 0 2px 8px var(--shadow), 0 0 0 10px transparent; }
    100% { box-shadow: 0 2px 8px var(--shadow), 0 0 0 0 transparent; }
  }

  .player-body { flex: 1; min-width: 0; }
  .player-title {
    font-size: calc(0.92rem * var(--tx));
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 0.4rem;
    line-height: 1.3;
  }
  .player-title .hint { font-weight: 400; color: var(--ink-soft); }

  /* The seek bar. What you see is the thin 6px line (.player-track), but
     the bar itself is a 30px tall touch zone around it: the negative
     margins give the extra height back, so the layout is exactly what it
     was with the 6px bar. pan-y keeps a vertical swipe that starts on the
     bar scrolling the page; a tap or a sideways drag seeks. */
  .player-bar {
    position: relative;
    height: 30px;
    margin: -12px 0;
    cursor: pointer;
    touch-action: pan-y;
  }
  .player-track {
    position: absolute;
    left: 0;
    right: 0;
    top: 12px;
    height: 6px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--shadow);
    overflow: hidden;
  }
  .player-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
  }
  /* The handle shows the bar can be dragged; it grows while it is held. */
  .player-knob {
    position: absolute;
    left: 0%;
    top: 15px;
    width: 12px;
    height: 12px;
    margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 1px 4px var(--shadow-strong);
    transition: transform 0.15s ease;
    pointer-events: none;
  }
  .player-bar:hover .player-knob,
  .player-bar.is-dragging .player-knob { transform: scale(1.3); }
  .player-bar:focus-visible { outline: none; }
  .player-bar:focus-visible .player-track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .player-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    margin-top: 0.4rem;
  }
  /* The foot's contents sit above the lower edge of the seek bar's touch
     zone, so its buttons keep every pixel of their own. */
  .player-foot > * { position: relative; }
  .player-time {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .player-tools { display: flex; gap: 0.35rem; }
  .mini-btn {
    padding: 0.2rem 0.6rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--bg);
    border: 1px solid var(--shadow);
    border-radius: 999px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .mini-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mini-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .player-error { font-size: 0.78rem; color: var(--ink-soft); font-style: italic; }
  /* Shown in place of the seek bar and the buttons when a recording
     cannot be played. */
  .player-msg {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem 0.6rem;
    margin-top: 0.15rem;
  }
  .player-msg[hidden] { display: none; }
  .player-retry { flex: 0 0 auto; }

  /* Fingers need bigger targets than a mouse pointer. */
  @media (pointer: coarse) {
    .mini-btn { min-height: 34px; padding: 0.3rem 0.75rem; }
    .wave-select { min-height: 34px; }
  }

  /* ========= WAVEFORM PLAYER (listen-and-repeat tracks) =========
     Used only where a player carries data-waveform="true". It is a
     block, not the flex row above, because the waveform needs the
     full width under the title rather than a lane beside it. */
  .wave-player {
    display: block;
    padding: 0.95rem 1.1rem 0.85rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-radius: var(--radius);
    box-shadow: 0 1px 3px var(--shadow);
  }
  .wave-head { display: flex; align-items: center; gap: 0.9rem; }
  .wave-head-text { flex: 1; min-width: 0; }
  .wave-title {
    font-size: calc(0.92rem * var(--tx));
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
  }
  .wave-title .hint { font-weight: 400; color: var(--ink-soft); }
  .wave-sub {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 0.2rem;
    font-variant-numeric: tabular-nums;
  }
  .wave-canvas-wrap { margin-top: 0.8rem; }
  .wave-canvas {
    display: block;
    width: 100%;
    height: 78px;
    cursor: pointer;
    border-radius: 8px;
    /* Taps still seek, but a swipe that starts on the waveform scrolls
       the page as usual instead of getting stuck on it. */
    touch-action: manipulation;
  }
  .wave-canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .wave-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    margin-top: 0.55rem;
    flex-wrap: wrap;
  }
  .wave-time {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .wave-tools { display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; }
  .wave-tools .mini-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .wave-tools .mini-btn svg { width: 13px; height: 13px; fill: currentColor; display: block; }
  .wave-step { padding: 0.28rem 0.5rem; }
  .wave-gap { display: inline-flex; align-items: center; gap: 0.3rem; }
  .wave-gap-label { font-size: 0.75rem; font-weight: 600; color: var(--ink-soft); }
  .wave-select {
    font: inherit;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.2rem 0.4rem;
    color: var(--ink-soft);
    background: var(--bg);
    border: 1px solid var(--shadow);
    border-radius: 999px;
    cursor: pointer;
  }
  .wave-select:disabled { opacity: 0.45; cursor: not-allowed; }
  .wave-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .wave-retry { margin-left: 0.4rem; vertical-align: middle; }

  @media (max-width: 520px) {
    .wave-canvas { height: 64px; }
    .wave-foot { justify-content: flex-start; }
  }

  /* Phones: the buttons become one even row across the full width, with
     the pause setting and the time on a row of their own underneath —
     instead of wrapping wherever the text happens to run out. */
  @media (max-width: 560px) {
    .wave-foot { flex-wrap: wrap; gap: 0.45rem 0.35rem; }
    .wave-foot::after { content: ""; order: 6; flex: 0 0 100%; height: 0; }
    .wave-tools { display: contents; }
    .wave-tools .mini-btn { order: 1; flex: 1 1 auto; text-align: center; white-space: nowrap; }
    .wave-tools .wave-step { flex: 0 0 auto; min-width: 40px; display: inline-flex; align-items: center; justify-content: center; }
    .wave-tools .js-replay { order: 5; flex: 0 0 auto; min-width: 40px; }
    .wave-tools .wave-lbl { display: none; }   /* Replay shows just ↻ here, so one row holds every button */
    .wave-gap { order: 7; }
    .wave-time { order: 8; margin-left: auto; }
  }
  @media (max-width: 400px) {
    .wave-player { padding-left: 0.85rem; padding-right: 0.85rem; }
    .wave-tools .mini-btn { padding-left: 0.55rem; padding-right: 0.55rem; }
    .wave-tools .wave-step,
    .wave-tools .js-replay { min-width: 36px; }
  }

  /* ========= LISTENING BLOCK (image + player) ========= */
  .listen-block {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 190px;
    gap: 1.5rem;
    align-items: center;
  }
  .listen-block .listen-figure { justify-self: center; text-align: center; }
  .listen-block .listen-figure img {
    max-height: 260px;
    width: auto;
    margin: 0 auto;
    filter: drop-shadow(0 6px 14px var(--shadow));
  }
  /* The homework illustration is two people side by side, so it needs a wider
     column than the single-figure blocks above. */
  .listen-block--wide { grid-template-columns: minmax(0, 1fr) 280px; }
  .listen-block--wide .listen-figure img { max-height: 210px; }
  .listen-block--conversation { grid-template-columns: minmax(0, 1fr) 300px; }
  .listen-block .listen-figure img.conversation-art {
    display: block;
    width: min(100%, 361px);
    height: auto;
    aspect-ratio: 361 / 283;
    object-fit: contain;
    max-height: none;
    filter: none;
  }
  /* Two portraits need more room than one: at 320px each gets ~156px, which is
     comfortably wider than either image needs at 195px tall, so the height —
     not the width — stays the limiting dimension for both. */
  .listen-block--pair { grid-template-columns: minmax(0, 1fr) 320px; }
  .listen-block.no-figure { grid-template-columns: 1fr; }

  /* Two speakers side by side (Parts 2 and 3).
     Each portrait is drawn into a box of the SAME fixed height using
     object-fit: contain, so the two people appear the same size on screen
     whatever the source files measure. Mali is 869×1250 (ratio 0.695) and
     Achara 738×1167 (ratio 0.632): letting the shared 190px-ish column width
     drive the size made Achara render noticeably taller, because the narrower
     image had height left to spare. Driving height instead of width fixes it,
     and it keeps working for David, whose dimensions we don't know here. */
  .listen-figure--pair {
    display: flex;
    gap: 0.5rem;
    align-items: flex-end;
    justify-content: center;
    width: 100%;
  }
  .listen-figure--pair .fig-one { flex: 1 1 0%; min-width: 0; text-align: center; }
  /* Matched at the same weight as the .listen-block .listen-figure img rules
     above and placed after them, so these are the values that actually win. */
  .listen-block .listen-figure--pair img {
    height: calc(var(--pair-h, 195px) * var(--fig-scale, 1));
    width: 100%;
    max-height: none;
    object-fit: contain;
    object-position: bottom center;
  }
  /* Part 3 only: Mali is drawn at 90% of the shared height so David reads as
     slightly taller beside her. Scaling the SHORTER figure down (rather than
     David up) is what keeps this safe: no image ever grows, so the block's
     height is unchanged and no image can become width-limited at any
     breakpoint. Because the pair is bottom-aligned, their feet stay on the
     same line. Part 2 is untouched, so Mali and Achara stay matched there. */
  .listen-figure--pair .fig-one--short img { --fig-scale: 0.9; }
  .fig-name {
    display: block;
    margin-top: 0.35rem;
    font-family: 'Prompt', sans-serif;
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align: center;
  }

  /* The two .jpg illustrations sit on their own white background, which floats
     awkwardly on the warm and dark themes — a soft frame settles them down. */
  .framed {
    border: 1px solid var(--shadow);
    border-radius: var(--radius);
    background: #fff;
    padding: 4px;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .linking-figure {
    width: min(100%, 620px);
    margin: 1rem auto 0;
  }
  .linking-figure img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 786 / 514;
    object-fit: cover;
  }
  /* Outweighs the drop-shadow on .listen-block .listen-figure img — the frame
     carries its own box-shadow, so the filter would only double it up. */
  .listen-block .listen-figure img.framed { filter: none; }

  .hw-brief {
    font-size: calc(1rem * var(--tx));
    color: var(--ink);
    margin-bottom: 1rem;
    max-width: 40rem;
  }
  .hw-brief strong { color: var(--accent-2); font-weight: 600; }
  @media (max-width: 640px) {
    .listen-block { grid-template-columns: 1fr; gap: 1.1rem; }
    .listen-block .listen-figure { order: -1; }
    .listen-block .listen-figure img { max-height: 190px; }
    /* Declared after the cap above so the pair keeps its own equal height. */
    .listen-block .listen-figure--pair img { max-height: none; }
    .listen-figure--pair { --pair-h: 175px; }
    .listen-block .listen-figure img.conversation-art {
      width: min(100%, 320px);
      max-height: none;
    }
  }

  /* Landscape phones and small tablets: still a two-column grid, but a 320px
     figure column would squeeze the player. Narrow the figures and shrink
     their height to match, keeping height the limiting dimension. */
  @media (min-width: 641px) and (max-width: 760px) {
    .listen-block--pair { grid-template-columns: minmax(0, 1fr) 260px; }
    .listen-figure--pair { --pair-h: 160px; }
  }

  /* ========= REVEAL (transcript / answer) ========= */
  .reveal { margin-top: 0.9rem; }
  .reveal-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.42rem 0.9rem;
    font-size: calc(0.85rem * var(--tx));
    font-weight: 600;
    color: var(--accent-2);
    background: var(--panel);
    border: 1px dashed var(--accent);
    border-radius: 999px;
  }
  .reveal-btn:hover { background: var(--button-hover); }
  .reveal-btn .chev { transition: transform 0.2s ease; display: inline-block; }
  .reveal-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .reveal-body {
    margin-top: 0.7rem;
    padding: 0.85rem 1rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-left: 3px solid var(--accent-2);
    border-radius: var(--radius);
  }
  .reveal-body[hidden] { display: none; }
  /* A short teaching note under a transcript, set apart from the dialogue. */
  .reveal-note {
    margin-top: 0.9rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--hairline);
    font-size: calc(0.88rem * var(--tx));
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .reveal-note .th-inline { color: var(--ink); font-weight: 600; }
  .reveal-note .rom-inline { color: var(--rom); font-weight: 500; }

  /* ========= DIALOGUE TRANSCRIPT ========= */
  .dialogue { display: grid; }
  .turn {
    display: grid;
    grid-template-columns: 5rem minmax(0, 1fr);
    gap: 0 1rem;
  }
  /* Separator between speakers rather than a border on every turn — the reveal
     box already has its own accent edge, so extra rules would read as clutter. */
  .turn + .turn {
    margin-top: 0.9rem;
    padding-top: 0.9rem;
    border-top: 1px solid var(--hairline);
  }
  .turn-who {
    font-family: 'Prompt', sans-serif;
    font-size: calc(0.88rem * var(--tx));
    font-weight: 600;
    color: var(--accent);
    padding-top: 0.3rem;
  }
  .turn-lines .line { margin-bottom: 0.8rem; }
  .turn-lines .line:last-child { margin-bottom: 0; }
  .turn-lines .th { font-size: calc(1.28rem * var(--tx)); }

  @media (max-width: 560px) {
    .turn { grid-template-columns: 1fr; gap: 0.15rem; }
    .turn-who { padding-top: 0; }
  }

  /* ========= TIP BOX ========= */
  .tip {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 150px;
    gap: 1.2rem;
    align-items: center;
    margin-top: 1.3rem;
    padding: 1.05rem 1.15rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-left: 3px solid var(--accent-2);
    border-radius: var(--radius);
  }
  .tip-label {
    font-family: 'Prompt', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 0.4rem;
  }
  .tip p { font-size: calc(0.96rem * var(--tx)); color: var(--ink); }
  .tip .th-inline { font-weight: 600; }
  /* The casual form itself — spaced away from the sentence that introduces it
     and from the player that follows. */
  .tip-line { margin: 0.8rem 0 0.9rem; }
  .tip-note {
    margin-top: 0.9rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--hairline);
    font-size: calc(0.88rem * var(--tx));
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .tip-note .th-inline { color: var(--ink); }
  .tip .rom-inline { color: var(--rom); font-weight: 500; }
  .tip.no-figure { grid-template-columns: 1fr; }
  .tip-figure img { max-height: 170px; width: auto; margin: 0 auto; filter: drop-shadow(0 6px 14px var(--shadow)); }
  @media (max-width: 640px) {
    .tip { grid-template-columns: 1fr; }
    .tip-figure { order: -1; }
    .tip-figure img { max-height: 140px; }
  }

  /* ========= VOCABULARY ========= */
  .vocab-head {
    display: grid;
    grid-template-columns: 1fr 1fr 1.2fr;
    gap: 0.5rem;
    padding: 0 0.9rem 0.45rem;
    margin-bottom: 0.5rem;
    border-bottom: 1px solid var(--hairline);
    font-family: 'Prompt', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .vocab-list { display: grid; grid-template-columns: 1fr; gap: 0.4rem; }
  .vocab-item {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr 1.2fr;
    gap: 0.5rem;
    padding: 0.7rem 0.9rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-radius: 8px;
    align-items: center;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .vocab-item:hover { border-color: var(--accent); }
  .vocab-item .v-th  { font-weight: 600; color: var(--ink); font-size: calc(1.15rem * var(--tx)); line-height: 1.7; }
  .vocab-item .v-rom { font-weight: 500; color: var(--rom); font-size: calc(0.95rem * var(--tx)); }
  .vocab-item .v-en  { font-weight: 500; color: var(--ink); font-size: calc(0.95rem * var(--tx)); }

  /* Once the vocabulary track is wired to the list, every row gets a speaker
     button in a narrow first column (and the header an empty one). */
  .vocab-head .vh-play { display: none; }
  .vocab-head.has-audio { grid-template-columns: 34px 1fr 1fr 1.2fr; }
  .vocab-head.has-audio .vh-play { display: block; }
  .vocab-item.has-play { grid-template-columns: 34px 1fr 1fr 1.2fr; }

  /* The word being spoken on the vocabulary track right now. */
  .vocab-item.is-current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .vocab-item.is-current::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: var(--accent);
    opacity: 0.07;
    pointer-events: none;
  }

  /* Speaker button: plays just this word, cut from the vocabulary track. */
  .vocab-play {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border: 1px solid var(--shadow);
    color: var(--accent);
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .vocab-play[hidden] { display: none; }
  .vocab-play svg { width: 17px; height: 17px; fill: currentColor; }
  .vocab-play:hover { border-color: var(--accent); }
  .vocab-play:active { transform: scale(0.92); }
  .vocab-item.is-current .vocab-play { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  .vocab-play.is-loading svg { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round;
                               stroke-dasharray: 38 16; animation: play-spin 0.9s linear infinite; }

  /* Phones: the three columns become a stacked card — Thai leads, romanization
     under it, English as the muted gloss. Mirrors the app's ≤480px vocab row.
     The speaker button sits to the left of the card, centred. */
  @media (max-width: 560px) {
    .vocab-head { display: none; }
    .vocab-item {
      grid-template-columns: 1fr;
      gap: 0.1rem;
      padding: 0.75rem 0.9rem;
    }
    .vocab-item.has-play { grid-template-columns: 40px minmax(0, 1fr); column-gap: 0.8rem; }
    .vocab-item.has-play .vocab-play { grid-column: 1; grid-row: 1 / span 3; width: 40px; height: 40px; }
    .vocab-item.has-play .v-th,
    .vocab-item.has-play .v-rom,
    .vocab-item.has-play .v-en { grid-column: 2; }
    .vocab-item .v-en { color: var(--ink-soft); font-size: calc(0.88rem * var(--tx)); order: 3; }
    .vocab-item .v-rom { order: 2; }
    .vocab-item .v-th { order: 1; font-size: calc(1.25rem * var(--tx)); }
    .vocab-play svg { width: 19px; height: 19px; }
  }

  /* ========= PREVIOUS LESSON LINK ========= */
  .prev-lesson {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    max-width: 30rem;
    margin: 0 auto 2.4rem;
    padding: 0.85rem 1.1rem;
    background: var(--panel);
    border: 1px solid var(--shadow);
    border-radius: var(--radius);
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 1px 3px var(--shadow);
    transition: border-color 0.15s ease, transform 0.12s ease;
  }
  .prev-lesson:hover { border-color: var(--accent); transform: translateY(-1px); }
  .prev-lesson .pl-arrow {
    flex: 0 0 auto;
    font-size: 1.1rem;
    color: var(--accent);
  }
  .prev-lesson .pl-text { min-width: 0; }
  /* The three labels are spans, so they need to be told to stack. */
  .prev-lesson .pl-kicker,
  .prev-lesson .pl-title,
  .prev-lesson .pl-sub { display: block; }
  .prev-lesson .pl-kicker {
    font-family: 'Prompt', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .prev-lesson .pl-title { font-size: calc(0.95rem * var(--tx)); font-weight: 600; line-height: 1.3; }
  .prev-lesson .pl-sub { font-size: calc(0.85rem * var(--tx)); color: var(--ink-soft); line-height: 1.35; }

  /* ========= FOOTER ========= */
  .foot {
    text-align: center;
    padding: 2.2rem 0 3rem;
    border-top: 1px solid var(--hairline);
    margin-top: 1rem;
  }
  .foot-line {
    font-family: 'Prompt', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 0.2rem;
  }
  .foot-rom { font-style: italic; font-size: 0.9rem; color: var(--accent-2); margin-bottom: 1rem; }
  .foot-rom .th { font-style: normal; }
  .foot-credit { font-size: 0.8rem; color: var(--ink-soft); }
  .foot-credit-link {
    display: inline-flex;
    align-items: center;
    gap: 0.3em;
    margin-left: 0.12em;
    padding: 0.2em 0.58em;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    background: var(--button-bg);
    box-shadow: 0 2px 7px var(--shadow);
    color: var(--accent-2);
    font-weight: 600;
    line-height: 1.35;
    text-decoration: none;
    transition: transform 180ms ease, color 180ms ease, background-color 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    transform: translateZ(0);
  }
  .foot-credit-link::after {
    content: '\2197';
    font-size: 0.9em;
    line-height: 1;
    opacity: 0.72;
  }
  .foot-credit-link:hover {
    color: var(--accent);
    background: var(--button-hover);
    border-color: var(--accent);
    box-shadow: 0 4px 12px var(--shadow-strong);
    transform: translateY(-1px) scale(1.04);
  }
  .foot-credit-link:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }
  .foot-credit-link:active { transform: translateY(0) scale(0.99); }

  /* ========= BACK TO TOP ========= */
  #to-top {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--shadow);
    box-shadow: 0 3px 12px var(--shadow-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
    transition: opacity 0.2s ease, transform 0.2s ease;

  </section>

  <nav class="contents" aria-label="Lesson contents">
    <a class="toc-link" href="#part-1"><span class="toc-num">01</span> Making sentences negative</a>
    <a class="toc-link" href="#part-2"><span class="toc-num">02</span> Negatives in practice</a>
    <a class="toc-link" href="#part-3"><span class="toc-num">03</span> See and hear</a>

  <!-- ===================== PART 1 ===================== -->
  <section class="part" id="part-1">
    <div class="part-head"><div class="part-eyebrow">Part 01</div><h2>Making sentences negative with ไม่ <span class="rom-inline">mâi</span></h2><p>To say you <em>don't</em> do something, put <span class="th-inline">ไม่</span> <span class="rom-inline">mâi</span> (no / not) directly before the verb. Nothing else changes.</p></div>
    <div class="answer-grid">

      <div class="answer-card"><div class="th">ดื่ม</div><div class="rom">dèum</div><div class="en">to drink</div></div>
      <div class="answer-card"><div class="th">ไม่ดื่ม</div><div class="rom">mâi dèum</div><div class="en">don't drink</div></div>

    <div class="phrase-card question-transform" style="margin-top:1.4rem">

      <div class="speaker-tag">More examples</div>

      <div class="line" style="margin-top:1rem"><div class="th">ฉันไม่ชอบฟังเพลง</div><div class="rom">chăn mâi chôp fang pleng</div><div class="en">I don't like to listen to music.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">เขาไม่ชอบเรียน</div><div class="rom">kăo mâi chôp rian</div><div class="en">He / she doesn't like to study.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">พวกเขาไม่ชอบกินอาหารไทย</div><div class="rom">pûak kăo mâi chôp gin aa-hăan Thai</div><div class="en">They don't like to eat Thai food.</div></div>

  <!-- ===================== PART 2 ===================== -->
  <section class="part" id="part-2">
    <div class="part-head"><div class="part-eyebrow">Part 02</div><h2>Negatives in practice</h2><p>Try to build each sentence yourself before you reveal the answer. The example answers use a male speaker's <span class="th-inline">ผม</span> <span class="rom-inline">pŏm</span> and <span class="th-inline">ครับ</span> <span class="rom-inline">kráp</span>; women use <span class="th-inline">ฉัน</span> <span class="rom-inline">chăn</span> and <span class="th-inline">ค่ะ</span> <span class="rom-inline">kâ</span>.</p></div>
    <div class="homework-listen-grid">
      <div class="homework-listen-card"><div class="question-number">Say it in Thai</div><p class="hw-brief" style="margin-bottom:0.6rem">I don't go to the restaurant.</p><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l7-p2-a">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l7-p2-a" hidden><div class="line"><div class="th">ผมไม่ไปร้านอาหารครับ</div><div class="rom">pŏm mâi bpai ráan aa-hăan kráp</div><div class="en">I don't go to the restaurant.</div></div></div></div></div>
      <div class="homework-listen-card"><div class="question-number">Say it in Thai</div><p class="hw-brief" style="margin-bottom:0.6rem">I don't eat fruit.</p><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l7-p2-b">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l7-p2-b" hidden><div class="line"><div class="th">ผมไม่กินผลไม้</div><div class="rom">pŏm mâi gin pŏn-lá-mái</div><div class="en">I don't eat fruit.</div></div></div></div></div>
      <div class="homework-listen-card"><div class="question-number">Say it in Thai</div><p class="hw-brief" style="margin-bottom:0.6rem">I don't like to cook.</p><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l7-p2-c">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l7-p2-c" hidden><div class="line"><div class="th">ผมไม่ชอบทำอาหาร</div><div class="rom">pŏm mâi chôp tam aa-hăan</div><div class="en">I don't like to cook.</div></div></div></div></div>
      <div class="homework-listen-card"><div class="question-number">Say it in Thai</div><p class="hw-brief" style="margin-bottom:0.6rem">I don't like her.</p><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l7-p2-d">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l7-p2-d" hidden><div class="line"><div class="th">ผมไม่ชอบเขา</div><div class="rom">pŏm mâi chôp kăo</div><div class="en">I don't like her.</div></div></div></div></div>
      <div class="homework-listen-card"><div class="question-number">Say it in Thai</div><p class="hw-brief" style="margin-bottom:0.6rem">She doesn't like me.</p><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l7-p2-e">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l7-p2-e" hidden><div class="line"><div class="th">เขาไม่ชอบผม</div><div class="rom">kăo mâi chôp pŏm</div><div class="en">She doesn't like me.</div></div></div></div></div>
    </div>
    <div class="listen-block listen-block--pair" style="margin-top:1.8rem">
      <div>
        <p class="hw-brief"><strong>Listen first:</strong> David and Mali ask each other about exercising and music. Try to follow before opening the transcript.</p>
        <div class="player" data-src="lesson_7_01.mp3" data-title="David and Mali - likes and dislikes"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l7-dialogue-01">Show the transcript <span class="chev">▾</span></button><div class="reveal-body" id="l7-dialogue-01" hidden><div class="dialogue">
          <div class="turn"><div class="turn-who">Mali</div><div class="turn-lines"><div class="line"><div class="th">คุณชอบออกกำลังกายไหมคะ</div><div class="rom">kun chôp òk gam-lang gaai măi ká</div><div class="en">Do you like exercising?</div></div></div></div>

          <div class="turn"><div class="turn-who">Mali</div><div class="turn-lines"><div class="line"><div class="th">แล้วชอบฟังเพลงไหม</div><div class="rom">láew chôp fang pleng măi</div><div class="en">And do you like listening to music?</div></div></div></div>

    </div>
  </section>

  <!-- ===================== PART 3 ===================== -->
  <section class="part" id="part-3">
    <div class="part-head"><div class="part-eyebrow">Part 03</div><h2>See and hear</h2><p>Two useful verbs, and the same negative rule at work. Add <span class="th-inline">ไม่</span> <span class="rom-inline">mâi</span> before the verb, or <span class="th-inline">ไหม</span> <span class="rom-inline">măi</span> at the end to ask.</p></div>
    <div class="answer-grid two">
      <div class="answer-card"><div class="th">เห็น</div><div class="rom">hĕn</div><div class="en">to see</div></div>
      <div class="answer-card"><div class="th">ได้ยิน</div><div class="rom">dâai yin</div><div class="en">to hear</div></div>
    </div>
    <div class="phrase-card" style="margin-top:1rem">
      <div class="line"><div class="th">ผมเห็นคุณ</div><div class="rom">pŏm hĕn kun</div><div class="en">I see you.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">ผมไม่เห็นคุณ</div><div class="rom">pŏm mâi hĕn kun</div><div class="en">I don't see you.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">ผมได้ยินคุณ</div><div class="rom">pŏm dâai yin kun</div><div class="en">I hear you.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">ผมไม่ได้ยินคุณ</div><div class="rom">pŏm mâi dâai yin kun</div><div class="en">I don't hear you.</div></div>
    </div>
    <div class="listen-block" style="margin-top:1.4rem">
      <div>
        <p class="hw-brief"><strong>Picture this:</strong> you're in an online lesson with your Thai teacher, and suddenly the connection acts up. Here's how to handle it. These examples add a polite particle at the end.</p>
        <div class="player" data-src="lesson_7_02.mp3" data-title="Listen and repeat - see and hear, politely"></div>
        <div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l7-examples-03">Show the examples <span class="chev">▾</span></button><div class="reveal-body" id="l7-examples-03" hidden><div class="dialogue">

          <div class="turn"><div class="turn-who">A</div><div class="turn-lines"><div class="line"><div class="th">ได้ยิน แต่ไม่เห็นครับ</div><div class="rom">dâai yin · dtàe mâi hĕn kráp</div><div class="en">I can hear you, but I can't see you.</div></div></div></div>
          <div class="turn"><div class="turn-who">B</div><div class="turn-lines"><div class="line"><div class="th">ไม่เห็นเหรอ</div><div class="rom">mâi hĕn rŏr</div><div class="en">Oh, you can't see me? (surprised)</div></div></div></div>
        </div></div></div>
      </div>
      <figure class="listen-figure"><img src="video_call.png" alt="A laptop on a video call" loading="lazy" onerror="lessonImgFail(this)"></figure>
    </div>
    <div class="tip no-figure"><div><div class="tip-label">Drop the pronoun</div><p>In everyday Thai the pronouns usually disappear once the context is clear. People simply say <span class="th-inline">เห็นไหม</span> <span class="rom-inline">hĕn măi</span> ("See?"), <span class="th-inline">ได้ยินไหม</span> <span class="rom-inline">dâai yin măi</span> ("Hear?"), <span class="th-inline">ไม่เห็น</span> <span class="rom-inline">mâi hĕn</span> ("Don't see"), or <span class="th-inline">ไม่ได้ยิน</span> <span class="rom-inline">mâi dâai yin</span> ("Don't hear").</p><p class="tip-line">You can still sound polite by adding <span class="th-inline">ครับ</span> <span class="rom-inline">kráp</span> or <span class="th-inline">ค่ะ</span> <span class="rom-inline">kâ</span> at the end.</p></div></div>
  </section>

  <!-- ===================== PART 4 ===================== -->
  <section class="part" id="part-4">
    <div class="part-head"><div class="part-eyebrow">Part 04</div><h2>Linking with แต่ <span class="rom-inline">dtàe</span></h2><p>Last lesson you met <span class="th-inline">และ</span> <span class="rom-inline">láe</span> (and). Now meet its cousin <span class="th-inline">แต่</span> <span class="rom-inline">dtàe</span> (but) - used just like "but" in English.</p></div>
    <div class="phrase-card">

    </div>
    <div class="part-head" style="margin-top:1.8rem"><h3>Essential nouns</h3><p>Four foods you'll use constantly.</p></div>
    <div class="answer-grid">
      <div class="answer-card"><div class="th">ปลา</div><div class="rom">bplaa</div><div class="en">fish</div></div>
      <div class="answer-card"><div class="th">เนื้อ</div><div class="rom">néua</div><div class="en">beef</div></div>
      <div class="answer-card"><div class="th">หมู</div><div class="rom">mŏo</div><div class="en">pork</div></div>

  <!-- ===================== PART 6 ===================== -->
  <section class="part" id="part-6">
    <div class="part-head"><div class="part-eyebrow">Part 06</div><h2>Surprise and strong feelings</h2><p>A few verbs for talking and telling, plus the phrases Thai people reach for when something surprises them.</p></div>
    <div class="answer-grid">
      <div class="answer-card"><div class="th">คุย</div><div class="rom">kui</div><div class="en">to talk; chat</div></div>
      <div class="answer-card"><div class="th">บอก</div><div class="rom">bòk</div><div class="en">to tell</div></div>
      <div class="answer-card"><div class="th">พูด</div><div class="rom">pôot</div><div class="en">to speak</div></div>
      <div class="answer-card"><div class="th">รัก</div><div class="rom">rák</div><div class="en">to love</div></div>
    </div>
    <div class="tip no-figure" style="margin-top:1.3rem"><div><div class="tip-label">"Really?!" - จริงเหรอ</div><p>When something surprises you, use <span class="th-inline">จริงเหรอ</span> <span class="rom-inline">jing rŏr</span> - "Really?!". <span class="th-inline">จริง</span> <span class="rom-inline">jing</span> means "really / truly", and <span class="th-inline">เหรอ</span> <span class="rom-inline">rŏr</span> is a question particle that adds a sense of surprise. It's like <span class="th-inline">ไหม</span> <span class="rom-inline">măi</span>, but with a lift of astonishment.</p><p class="tip-line">To insist something is true, double the word: <span class="th-inline">จริง ๆ</span> <span class="rom-inline">jing jing</span> ("Really / truly"). To deny it, <span class="th-inline">ไม่จริง</span> <span class="rom-inline">mâi jing</span> ("Not true").</p><p class="tip-note">In casual speech the "R" often softens toward "L", so <span class="th-inline">เหรอ</span> <span class="rom-inline">rŏr</span> may sound like <span class="rom-inline">lŏr</span> - same word, just a relaxed pronunciation.</p></div></div>
    <div class="phrase-card" style="margin-top:1.4rem">
      <div class="speaker-tag">A little exchange</div>
      <div class="line"><div class="th">ผมรักคุณ</div><div class="rom">pŏm rák kun</div><div class="en">I love you.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">จริงเหรอ</div><div class="rom">jing rŏr</div><div class="en">Really? (surprised)</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">จริง ๆ</div><div class="rom">jing jing</div><div class="en">Really. (truly)</div></div>
    </div>
    <div class="listen-block listen-block--pair" style="margin-top:1.4rem">
      <div>
        <p class="hw-brief"><strong>Listen first:</strong> David and Mali - how old are you?</p>
        <div class="player" data-src="lesson_7_06.mp3" data-title="David and Mali - I'm not telling"></div>

          <div class="turn"><div class="turn-who">David</div><div class="turn-lines"><div class="line"><div class="th">อายุเท่าไหร่ครับ</div><div class="rom">aa-yú tâo rài kráp</div><div class="en">How old are you?</div></div></div></div>
          <div class="turn"><div class="turn-who">Mali</div><div class="turn-lines"><div class="line"><div class="th">ไม่บอกค่ะ</div><div class="rom">mâi bòk kâ</div><div class="en">I'm not telling you.</div></div></div></div>
        </div></div></div>
      </div>
      <figure class="listen-figure listen-figure--pair"><div class="fig-one"><img src="david.png" alt="David" loading="lazy" onerror="lessonImgFail(this)"><span class="fig-name">David</span></div><div class="fig-one"><img src="mali.png" alt="Mali" loading="lazy" onerror="lessonImgFail(this)"><span class="fig-name">Mali</span></div></figure>
    </div>

        <p class="hw-brief"><strong>Listen first:</strong> Mali is sure David likes movies. Is she right? You'll hear <span class="th-inline">ดูหนัง</span> <span class="rom-inline">doo năng</span> (to watch movies).</p>

          <div class="turn"><div class="turn-who">Mali</div><div class="turn-lines"><div class="line"><div class="th">ชอบดูหนังใช่ไหมคะ</div><div class="rom">chôp doo năng châi măi ká</div><div class="en">You like watching movies, right?</div></div></div></div>

          <div class="turn"><div class="turn-who">Mali</div><div class="turn-lines"><div class="line"><div class="th">จริงเหรอ</div><div class="rom">jing rŏr</div><div class="en">Really?!</div></div></div></div>
          <div class="turn"><div class="turn-who">David</div><div class="turn-lines"><div class="line"><div class="th">จริง ๆ ไม่ชอบดูหนัง</div><div class="rom">jing jing · mâi chôp doo năng</div><div class="en">Really. I don't like watching movies.</div></div></div></div>

          <div class="turn"><div class="turn-who">Achara</div><div class="turn-lines"><div class="line"><div class="th">ไม่จริง</div><div class="rom">mâi jing</div><div class="en">That's not true.</div></div></div></div>

  <!-- ===================== PART 7 ===================== -->
  <section class="part" id="part-7">
    <div class="part-head"><div class="part-eyebrow">Part 07</div><h2>The future with จะ <span class="rom-inline">jà</span></h2><p>To talk about the future, put <span class="th-inline">จะ</span> <span class="rom-inline">jà</span> (will) before the verb. That's the whole rule.</p></div>
    <div class="phrase-card question-transform">
      <div class="transform-example line"><div class="th">ผมทำงาน</div><div class="rom">pŏm tam ngaan</div><div class="en">I work. / I'm working.</div></div>
      <div class="transform-arrow" aria-label="Add จะ jà for the future"><span class="transform-arrow-symbol" aria-hidden="true">→</span><strong>Add จะ <span class="rom-inline">jà</span></strong></div>
      <div class="transform-example line"><div class="th">ผมจะทำงาน</div><div class="rom">pŏm jà tam ngaan</div><div class="en">I will work.</div></div>
    </div>
    <div class="phrase-card" style="margin-top:1rem">
      <div class="speaker-tag">Questions and negatives</div>
      <div class="line"><div class="th">ผมจะเรียนภาษาไทย</div><div class="rom">pŏm jà rian paa-săa thai</div><div class="en">I will study Thai.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">ผมจะไม่เรียนภาษาไทย</div><div class="rom">pŏm jà mâi rian paa-săa thai</div><div class="en">I will not study Thai.</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">คุณจะเรียนภาษาไทยไหม</div><div class="rom">kun jà rian paa-săa thai măi</div><div class="en">Will you study Thai?</div></div>
      <div class="player" data-src="lesson_7_09.mp3" data-title="Listen and repeat - the future with jà" style="margin-top:1rem"></div>
    </div>
    <div class="tip no-figure"><div><div class="tip-label">Negative future</div><p>For "will not", the order is <span class="rom-inline">jà + mâi + verb</span>: <span class="th-inline">ผมจะไม่ทำอาหาร</span> <span class="rom-inline">pŏm jà mâi tam aa-hăan</span> - "I will not cook." Women use <span class="th-inline">ฉัน</span> <span class="rom-inline">chăn</span>.</p></div></div>
    <div class="part-head" style="margin-top:1.8rem"><h3>Time words</h3><p>These can go at the <em>start</em> or the <em>end</em> of the sentence - both are correct.</p></div>
    <div class="answer-grid">
      <div class="answer-card"><div class="th">วันนี้</div><div class="rom">wan-née</div><div class="en">today</div></div>
      <div class="answer-card"><div class="th">พรุ่งนี้</div><div class="rom">prûng-née</div><div class="en">tomorrow</div></div>
      <div class="answer-card"><div class="th">คืนนี้</div><div class="rom">keun-née</div><div class="en">tonight</div></div>
    </div>
    <div class="phrase-card" style="margin-top:1rem">
      <div class="line"><div class="th">คุณจะทำอะไรพรุ่งนี้</div><div class="rom">kun jà tam à-rai prûng-née</div><div class="en">What are you going to do tomorrow?</div></div>
      <div class="line" style="margin-top:1rem"><div class="th">พรุ่งนี้คุณจะทำอะไร</div><div class="rom">prûng-née kun jà tam à-rai</div><div class="en">Tomorrow, what will you do? <strong>(same meaning)</strong></div></div>
    </div>
    <div class="part-head" style="margin-top:1.8rem"><h3>Your turn</h3><p>Build each sentence, then reveal the answer. Time words can sit at either end.</p></div>
    <div class="homework-listen-grid">
      <div class="homework-listen-card"><div class="question-number">Say it in Thai</div><p class="hw-brief" style="margin-bottom:0.6rem">I will exercise.</p><div class="reveal"><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="l7-p7-a">Show the answer <span class="chev">▾</span></button><div class="reveal-body" id="l7-p7-a" hidden><div class="line"><div class="th">ฉันจะออกกำลังกาย</div><div class="rom">chăn jà òk gam-lang gaai</div><div class="en">I will exercise. (female)</div></div></div></div></div>

               '<span class="v-th">'  + esc(v.th)  + '</span>' +
               '<span class="v-rom">' + esc(v.rom) + '</span>' +

  /* =========================================================
     PAIR CUES — where each English prompt and Thai answer sits in
     an English → Thai track (players with data-pairs="true").

     A pairs track cannot be read automatically the way the
     listen-and-repeat track is: an English prompt such as "Hello
     (male speaker)" has a breath in the middle, and the pause in
     which the student answers is barely longer than that breath.
     So the timings are written down here, once, in seconds.

       intro   the spoken instructions before the first pair
       pairs   [English start, English end, Thai start, Thai end]

     This lesson has no English → Thai track, so the table is
     empty. It stays because the waveform player reads it.
     ========================================================= */
  var PAIR_CUES = {};

  /* =========================================================
     AUDIO PLAYERS
     Each .player[data-src] becomes a full player. Only one clip
     plays at a time. A missing file degrades to a disabled
     button plus a short note rather than a silent dead control.

     WHERE THE SOUND COMES FROM — downloaded whole, played from memory

     Jumping around in a STREAMED file needs the server to answer
     "Range" requests (206 Partial Content). Cloudflare does not
     always do that: a file its cache does not hold yet comes back
     whole, as a plain 200, and the browser then treats the clip as
     not seekable at all — every click on the bar restarts it from
     0:00, even on a six-second clip that has fully arrived. A file
     played from memory (a Blob URL) can always be jumped around,
     whatever the server does.

     So every recording is fetched whole, once, and played from that
     copy. A player starts fetching its file when it comes near the
     screen (the short clips are small, so play is then instant), or
     at the latest on the first press. Play pressed while the file
     is still arriving shows a turning ring and starts by itself
     once it is in.

     If the download cannot be done at all (a page opened straight
     from disk over file://, a browser without fetch), the simple
     player streams the file exactly as before. A file the server
     says does not exist shows "Recording not available"; a dropped
     connection shows "Try again" instead of disabling the player.
     ========================================================= */
  var ICON_PLAY  = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
  var ICON_LOAD  = '<svg class="spin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/></svg>';

  var players = [];

  /* Pause every player except this one. */
  function stopOthers(api) {
    for (var i = 0; i < players.length; i++) {
      if (players[i] !== api) players[i].pause();
    }
  }

  function fmt(t) {
    if (!isFinite(t) || t < 0) t = 0;
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  /* iPhones: Web Audio normally obeys the ring/silent switch, so with the
     switch on silent the waveform players would play nothing while the
     simple players play fine. Declaring the page a "playback" app — what
     a music or podcast app is — makes both behave the same. Browsers
     without the Audio Session API simply skip this. */
  try {
    if (navigator.audioSession && 'type' in navigator.audioSession) navigator.audioSession.type = 'playback';
  } catch (e) {}

  /* ---- downloads: one per file, shared by everything that asks ----
     A failed download carries a kind:
       'missing'  the server has no such file (404, or a web page sent in
                  its place)
       'network'  it could not be fetched just now
       'local'    downloading is not possible here (file://, no fetch) */
  var audioJobs = {};

  function audioError(kind, msg) {
    var e = new Error(msg);
    e.kind = kind;
    return e;
  }

  /* The whole file, as one plain request (no Range header), with progress.
     urgent: the student is waiting for this one — it is asked for at high
     priority, while files fetched ahead of time go at low priority, so on
     a slow line they do not hold up the one that was actually pressed.
     (Browsers that do not know fetch priorities simply ignore them.) */
  function downloadAudio(url, onProgress, urgent) {
    if (typeof fetch !== 'function' || !window.Blob || location.protocol === 'file:') {
      return Promise.reject(audioError('local', 'downloading is not possible here'));
    }
    return fetch(url, { credentials: 'same-origin', priority: urgent ? 'high' : 'low' }).then(function (res) {
      var type = String(res.headers.get('content-type') || '').toLowerCase();
      if (res.status === 404 || res.status === 410 || (res.ok && type.indexOf('text/html') === 0)) {
        throw audioError('missing', 'HTTP ' + res.status + (type ? ' ' + type : ''));
      }
      if (!res.ok) throw audioError('network', 'HTTP ' + res.status);
      var enc = String(res.headers.get('content-encoding') || '').toLowerCase();
      var total = (!enc || enc === 'identity') ? (Number(res.headers.get('content-length')) || 0) : 0;
      var mime = type.indexOf('audio/') === 0 ? type.split(';')[0] : 'audio/mpeg';
      if (!res.body || !res.body.getReader) {
        return res.blob().then(function (b) { return { blob: b, total: total, mime: mime }; });
      }
      var reader = res.body.getReader(), chunks = [], got = 0;
      return (function pump() {
        return reader.read().then(function (r) {
          if (r.done) return { blob: new Blob(chunks, { type: mime }), total: total, mime: mime };
          chunks.push(r.value);
          got += r.value.byteLength;
          if (onProgress) onProgress(got, total);
          return pump();
        });
      })();
    }).then(function (x) {
      if (x.total && x.blob.size !== x.total) throw audioError('network', 'incomplete download');
      if (!x.blob.size) throw audioError('missing', 'empty file');
      return x.blob.type ? x.blob : new Blob([x.blob], { type: x.mime });
    }).catch(function (err) {
      throw (err && err.kind) ? err : audioError('network', String((err && err.message) || err));
    });
  }

  function getAudio(url, onProgress, urgent) {
    var job = audioJobs[url];
    if (!job) {
      job = audioJobs[url] = { listeners: [] };
      job.promise = downloadAudio(url, function (got, total) {
        for (var i = 0; i < job.listeners.length; i++) {
          try { job.listeners[i](got, total); } catch (e) {}
        }
      }, urgent).then(function (blob) {
        job.listeners = [];
        return blob;
      }, function (err) {
        delete audioJobs[url];        /* so "Try again" really tries again */
        throw err;
      });
    }
    if (onProgress) job.listeners.push(onProgress);
    return job.promise;
  }

  function blobBytes(blob) {
    return blob.arrayBuffer ? blob.arrayBuffer() : new Response(blob).arrayBuffer();
  }

  var nearObserver = null;

        entries.forEach(function (en) {

          var fn = en.target._whenNear;
          en.target._whenNear = null;
          if (fn) fn();

    }

     first press instead. */
  function whenNear(el, fn) {
    if (!nearObserver) return;
    el._whenNear = fn;
    nearObserver.observe(el);
  }

  /* ---- lock screen, notification and earbud controls (Media Session) ----
     Without this a phone shows a bare file name, or nothing, for whatever
     is playing. Now it shows the recording's title with the lesson under
     it. The player that last started playing owns these controls. */
  var MS = ('mediaSession' in navigator) ? navigator.mediaSession : null;
  var msOwner = null, msArt = null;
  var LESSON_LABEL = (function () {
    var t = document.querySelector('.tb-lesson');
    return (t && t.textContent.replace(/\s+/g, ' ').trim()) || document.title;
  })();

  /* The page's own icon (the golden circle), drawn as a PNG: lock screens
     want a real image rather than an SVG. */
  function msArtwork() {
    if (msArt) return msArt;
    msArt = [];
    try {
      var c = document.createElement('canvas'), n = 512;
      c.width = c.height = n;
      var g = c.getContext('2d');
      g.fillStyle = '#b8893a';
      g.beginPath();
      g.arc(n / 2, n / 2, n * 30 / 64, 0, Math.PI * 2);
      g.fill();
      g.globalAlpha = 0.55;
      g.strokeStyle = '#fffaf0';
      g.lineWidth = n * 3 / 64;
      g.beginPath();
      g.arc(n / 2, n / 2, n * 22 / 64, 0, Math.PI * 2);
      g.stroke();
      msArt = [{ src: c.toDataURL('image/png'), sizes: n + 'x' + n, type: 'image/png' }];
    } catch (e) {}
    return msArt;
  }

  /* c: { title, play(), pause(), seek(t), pos(), dur(), rate(), playing(),
          prev() and next() — optional } */
  function msClaim(c) {
    if (!MS) return;
    msOwner = c;
    try {
      if (typeof MediaMetadata !== 'undefined') {
        MS.metadata = new MediaMetadata({
          title: c.title, artist: LESSON_LABEL, album: 'Thai Beginner Course', artwork: msArtwork()
        });
      }
    } catch (e) {}
    var acts = {
      play:          function () { c.play(); },
      pause:         function () { c.pause(); },
      stop:          function () { c.pause(); },
      seekbackward:  function (d) { c.seek(c.pos() - ((d && d.seekOffset) || 5)); },
      seekforward:   function (d) { c.seek(c.pos() + ((d && d.seekOffset) || 5)); },
      seekto:        function (d) { if (d && isFinite(d.seekTime)) c.seek(d.seekTime); },
      previoustrack: c.prev ? function () { c.prev(); } : null,
      nexttrack:     c.next ? function () { c.next(); } : null
    };
    Object.keys(acts).forEach(function (a) {
      try { MS.setActionHandler(a, acts[a]); } catch (e) {}
    });
    msUpdate(c);
  }

  function msUpdate(c) {
    if (!MS || msOwner !== c) return;
    try { MS.playbackState = c.playing() ? 'playing' : 'paused'; } catch (e) {}
    try {
      var d = c.dur();
      if (MS.setPositionState && isFinite(d) && d > 0) {
        MS.setPositionState({ duration: d, playbackRate: c.rate() || 1, position: Math.max(0, Math.min(d, c.pos())) });
      }
    } catch (e) {}
  }

  /* ---- the simple player: short clips, and the fallback for the others ---- */
  function buildPlayer(el) {
    var src   = el.getAttribute('data-src');
    var title = el.getAttribute('data-title') || 'Audio';
    var hint  = el.getAttribute('data-hint') || '';
    var url   = audioUrl(src);

    el.innerHTML =
      '<button type="button" class="play-btn" aria-label="Play: ' + esc(title) + '">' + ICON_PLAY + '</button>' +
      '<div class="player-body">' +
        '<div class="player-title">' + esc(title) +
          (hint ? ' <span class="hint">' + esc(hint) + '</span>' : '') +
        '</div>' +
        '<div class="player-bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">' +
          '<div class="player-track"><div class="player-fill"></div></div>' +
          '<div class="player-knob"></div>' +
        '</div>' +
        '<div class="player-foot">' +
          '<span class="player-time">0:00 / 0:00</span>' +
          '<span class="player-tools">' +
            '<button type="button" class="mini-btn js-slow" aria-pressed="false" title="Play at 75% speed">0.75×</button>' +
            '<button type="button" class="mini-btn js-replay" title="Play from the start">↻ Replay</button>' +
          '</span>' +
        '</div>' +
        '<div class="player-msg" hidden>' +
          '<span class="player-error"></span>' +
          '<button type="button" class="mini-btn player-retry" hidden>↻ Try again</button>' +
        '</div>' +
      '</div>';

    var audio  = new Audio();
    audio.preload = 'auto';   /* it is only ever given the downloaded copy, or the stream fallback */
    /* Pinned explicitly so nothing can inherit or retain a changed rate:
       only the 0.75× button below ever moves it. */
    audio.defaultPlaybackRate = 1;
    audio.playbackRate = 1;
    if ('preservesPitch' in audio) audio.preservesPitch = true;

    var btn    = el.querySelector('.play-btn');
    var bar    = el.querySelector('.player-bar');
    var fill   = el.querySelector('.player-fill');
    var knob   = el.querySelector('.player-knob');
    var time   = el.querySelector('.player-time');
    var foot   = el.querySelector('.player-foot');
    var msg    = el.querySelector('.player-msg');
    var msgTxt = el.querySelector('.player-error');
    var retryB = el.querySelector('.player-retry');
    var slow   = el.querySelector('.js-slow');
    var replay = el.querySelector('.js-replay');

    /* source: ''        nothing fetched yet
               'loading' the file is on its way
               'blob'    playing from the downloaded copy (the normal case)
               'stream'  streaming the file itself (the fallback)
               'error'   it cannot be played; the message says why */
    var source = '', blobUrl = '';
    var wantPlay = false;     /* play was pressed while the file was still on its way */
    var buffering = false;    /* streaming only: playback is waiting for data */
    var drag = null;          /* a press on the seek bar: { id, r } */
    var btnIcon = '';

    var api = { pause: function () { wantPlay = false; audio.pause(); paintBtn(); } };
    players.push(api);

    function ready() { return source === 'blob' || source === 'stream'; }
    function isPlaying() { return !audio.paused && !audio.ended; }
    function dur() { var d = audio.duration; return (isFinite(d) && d > 0) ? d : 0; }

    var ms = {
      title: title,
      play: function () { start(); },
      pause: function () { api.pause(); },
      seek: function (t) { seekTo(t); },
      pos: function () { return audio.currentTime || 0; },
      dur: dur,
      rate: function () { return audio.playbackRate || 1; },
      playing: isPlaying
    };

    /* ---- the file ---- */
    function prepare() {
      if (source) return;
      source = 'loading';
      getAudio(url, null, wantPlay).then(function (blob) {
        if (source !== 'loading') return;
        try { blobUrl = URL.createObjectURL(blob); } catch (e) { useStream(); return; }
        use('blob', blobUrl);
      }, function (err) {
        if (source !== 'loading') return;
        if (err && err.kind === 'missing') fail('missing');
        else useStream();
      });

    function useStream() { use('stream', url); }
    function use(kind, u) {
      source = kind;
      audio.src = u;
      try { audio.load(); } catch (e) {}
      paint();
      paintBtn();
      if (wantPlay) { wantPlay = false; start(); }
    }

      if (blobUrl) { try { URL.revokeObjectURL(blobUrl); } catch (e) {} blobUrl = ''; }
    }

       before the file has arrived, load() on the still-empty element lets
       Safari treat this element as started by the student, so it can play
       by itself once the download is in. If it still refuses, the button
       simply shows ▶ again and the next tap plays. */
    function unlock() {
      if (!audio.getAttribute('src')) { try { audio.load(); } catch (e) {} }
    }

    function start() {
      if (!ready()) { wantPlay = true; prepare(); paintBtn(); return; }
      stopOthers(api);
      var p = audio.play();
      if (p && p.catch) p.catch(function () { paintBtn(); });
      msClaim(ms);
    }

    function fail(kind) {
      source = 'error';
      wantPlay = false;
      buffering = false;
      dropBlob();
      el.classList.add('is-error');
      bar.style.display = 'none';
      foot.style.display = 'none';
      msg.hidden = false;
      msgTxt.title = src;
      if (kind === 'missing') {
        btn.disabled = true;
        msgTxt.textContent = 'Recording not available';
        retryB.hidden = true;
      } else {
        msgTxt.textContent = 'Couldn’t load the audio — check your connection.';
        retryB.hidden = false;
      }
      if (window.console && console.warn) {
        console.warn('[player] ' + src + (kind === 'missing' ? ' could not be found.' : ' could not be loaded.'));
      }
      paintBtn();
    }

    function retry() {
      el.classList.remove('is-error');
      bar.style.display = '';
      foot.style.display = '';
      msg.hidden = true;
      btn.disabled = false;
      audio.removeAttribute('src');
      source = '';
      wantPlay = true;
      prepare();
      paintBtn();
    }

    audio.addEventListener('error', function () {
      if (!audio.getAttribute('src')) return;   /* the empty element from unlock(): nothing to report */
      if (source === 'blob') { dropBlob(); useStream(); return; }   /* a copy it cannot play: try the file itself */
      if (source === 'stream') fail('network');
    });

    /* ---- painting ---- */
    function paint() {
      var d = dur();
      var t = drag ? drag.r * d : audio.currentTime;
      var pct = d ? Math.max(0, Math.min(100, (t / d) * 100)) : 0;
      fill.style.width = pct + '%';
      knob.style.left = pct + '%';
      bar.setAttribute('aria-valuenow', Math.round(pct));
      time.textContent = fmt(t) + ' / ' + fmt(d);
    }

      var loading = (wantPlay && source === 'loading') || (buffering && isPlaying());
      var key = loading ? 'load' : (isPlaying() ? 'pause' : 'play');
      if (key !== btnIcon) {
        btnIcon = key;
        btn.innerHTML = key === 'load' ? ICON_LOAD : (key === 'pause' ? ICON_PAUSE : ICON_PLAY);
      }
      btn.setAttribute('aria-label', key === 'load' ? 'Loading: ' + title : (key === 'pause' ? 'Pause' : 'Play: ' + title));
    }

    audio.addEventListener('play',  function () { paintBtn(); msUpdate(ms); });
    audio.addEventListener('pause', function () { buffering = false; paintBtn(); msUpdate(ms); });
    audio.addEventListener('ended', function () { audio.currentTime = 0; paint(); paintBtn(); msUpdate(ms); });
    audio.addEventListener('waiting', function () { if (source === 'stream') { buffering = true; paintBtn(); } });
    audio.addEventListener('playing', function () { buffering = false; paintBtn(); });
    audio.addEventListener('timeupdate', paint);
    audio.addEventListener('loadedmetadata', paint);
    audio.addEventListener('durationchange', paint);
    audio.addEventListener('seeked', function () { msUpdate(ms); });
    audio.addEventListener('ratechange', function () { msUpdate(ms); });

    /* ---- the play button ---- */
    btn.addEventListener('click', function () {
      unlock();
      if (source === 'error') { stopOthers(api); retry(); return; }
      if (!ready()) {
        wantPlay = !wantPlay;
        if (wantPlay) { stopOthers(api); prepare(); }
        paintBtn();
        return;
      }
      if (isPlaying()) audio.pause(); else start();
    });

    retryB.addEventListener('click', function () { unlock(); stopOthers(api); retry(); });

    /* ---- the seek bar: tap anywhere, or drag the handle ---- */
    function ratioAt(clientX) {
      var r = bar.getBoundingClientRect();
      return r.width ? Math.min(1, Math.max(0, (clientX - r.left) / r.width)) : 0;

      drag = null;

    }

    if (window.PointerEvent) {
      bar.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (!dur()) { prepare(); return; }
        if (e.pointerType === 'mouse') e.preventDefault();   /* no text selection while dragging */
        drag = { id: e.pointerId, r: ratioAt(e.clientX) };
        bar.classList.add('is-dragging');
        try { bar.setPointerCapture(e.pointerId); } catch (x) {}
        paint();
      });
      bar.addEventListener('pointermove', function (e) {
        if (!drag || e.pointerId !== drag.id) return;

      });

        if (!drag || e.pointerId !== drag.id) return;
        var r = ratioAt(e.clientX);

      bar.addEventListener('pointercancel', function () { if (drag) { endDrag(); paint(); } });

      bar.addEventListener('click', function (e) { seekTo(ratioAt(e.clientX) * dur()); });
    }
    bar.addEventListener('keydown', function (e) {
      if (!dur()) return;
      if (e.key === 'ArrowRight') { seekTo(audio.currentTime + 2); e.preventDefault(); }
      if (e.key === 'ArrowLeft')  { seekTo(audio.currentTime - 2); e.preventDefault(); }

      var on = slow.getAttribute('aria-pressed') === 'true';
      slow.setAttribute('aria-pressed', on ? 'false' : 'true');
